<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Springboard — Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;450;500;600;700&family=Kaushan+Script&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper: #F4EFE6;
    --paper-deep: #EBE4D7;
    --ink: #2B281F;
    --ink-soft: #4b473d;
    --muted: #4b473d;
    --line: rgba(43,40,31,.18);
    --card-line: rgba(43,40,31,.22);
    --label: #4b473d;
    --bg: #F4EFE6;
    --panel: rgba(255,255,255,.56);
    --accent: #4F2759;        /* one data colour across every chart */
    --accent-deep: #3d1d45;
    --accent-soft: #e9deeb;
    --bad: #e83534; --bad-bg: #fdafbd; --bad-ink: #8f1d2e;
    --grid: rgba(43,40,31,.14);
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-display: "Fraunces", Georgia, serif;
    --radius: 10px;
    --shadow: 0 12px 30px rgba(43,40,31,.08);
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; font-family: var(--font-body); color: var(--ink);
    background:
      radial-gradient(760px 520px at 92% 4%, rgba(79,39,89,.10), transparent 66%),
      radial-gradient(680px 460px at -8% 42%, rgba(79,39,89,.07), transparent 68%),
      var(--paper) url("assets/brain/paper.jpg") repeat;
    background-size: auto, auto, 620px 620px;
    background-attachment: fixed;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(120% 100% at 50% 44%, transparent 62%, rgba(43,40,31,.045) 100%); }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 28px clamp(18px, 4vw, 48px) 72px; }

  header.app { background: rgba(244,239,230,.72); color: var(--ink); border-bottom: 1px solid var(--line); }
  header.app .wrap { display: flex; align-items: center; gap: 20px; padding-top: 22px; padding-bottom: 20px; }
  header.app h1 { font-family: var(--font-display); font-size: clamp(25px, 3vw, 34px); line-height: 1.05;
    letter-spacing: -.02em; margin: 0; color: var(--ink); font-weight: 500; }
  header.app h1 em { color: var(--accent); font-weight: 400; }
  header.app p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .back-link { margin-left: auto; align-self: center; text-decoration: none; font-size: 13px; white-space: nowrap; }
  header.app .back-link { min-height: 32px; background: rgba(255,255,255,.38); color: var(--accent);
    border: 1px solid rgba(79,39,89,.34); border-radius: 999px; box-shadow: none;
    transition: background .15s, border-color .15s, color .15s; }
  header.app .back-link:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
  header.app .back-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; box-shadow: none; }

  .panel { background: var(--panel); border: 1px solid var(--card-line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: clamp(18px, 2.5vw, 26px); backdrop-filter: blur(2px); }

  #statusMsg { font-size: 13px; color: var(--muted); margin: 0 0 14px; }

  .gate { max-width: 420px; margin: clamp(40px, 9vh, 92px) auto; }
  .gate::before { content: "Private dashboard"; display: block; margin-bottom: 14px; font-family: var(--font-display);
    font-size: 24px; font-style: italic; color: var(--accent); }
  .gate label { display: block; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--label); font-weight: 700; margin-bottom: 7px; }
  .gate input[type=password] { width: 100%; min-height: 42px; padding: 10px 12px; border: 1px solid var(--card-line);
    border-radius: 5px; font: inherit; margin-bottom: 13px; color: var(--ink); background: rgba(255,255,255,.52); }
  .gate input:focus { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: none; }

  .btn { min-height: 36px; padding: 8px 16px; border: 0; border-radius: 4px; font: inherit; font-weight: 600;
    cursor: pointer; transition: background .15s, border-color .15s, color .15s, opacity .15s; }
  .btn.primary { background: var(--accent); color: #fff; width: 100%; box-shadow: 0 5px 14px rgba(79,39,89,.18); }
  .btn.primary:hover { background: var(--accent-deep); }
  .btn.ghost { background: rgba(255,255,255,.46); border: 1px solid var(--card-line); color: var(--ink); width: auto; }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; box-shadow: none; }

  .alert.bad { background: var(--bad-bg); color: var(--bad-ink); border: 1px solid var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 10px 0 0; }

  #dash[hidden], #gate[hidden] { display: none; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }

  .totals-strip { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .tile { position: relative; overflow: hidden; background: rgba(255,255,255,.46); border: 1px solid var(--card-line);
    border-radius: var(--radius); box-shadow: 0 8px 24px rgba(43,40,31,.055); padding: 16px 18px; text-align: left; }
  .tile::after { content: ""; position: absolute; right: -24px; bottom: -36px; width: 100px; height: 90px;
    border-radius: 50%; background: rgba(79,39,89,.07); filter: blur(9px); pointer-events: none; }
  .tile .n { position: relative; z-index: 1; font-family: var(--font-display); font-size: 34px; font-style: italic;
    font-weight: 500; color: var(--accent); line-height: 1; }
  .tile .label { position: relative; z-index: 1; font-size: 12px; color: var(--muted); margin-top: 7px; text-transform: capitalize; }

  .card { margin-bottom: 24px; }
  .card h2 { font-family: var(--font-display); font-size: 19px; font-weight: 500; letter-spacing: -.01em; margin: 0 0 16px; }
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 860px) { .charts-grid { grid-template-columns: 1fr; } }

  .empty-note { color: var(--muted); font-family: var(--font-display); font-style: italic; font-size: 16px;
    padding: 32px 12px; text-align: center; margin: 0; border: 1px dashed var(--line); border-radius: 6px;
    background: rgba(235,228,215,.46); }

  /* Visually hidden but available to screen readers (chart data-table equivalents). */
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .chart-host { position: relative; min-width: 0; }
  svg.chart { display: block; max-width: 100%; overflow: visible; }
  svg.chart text { font-family: var(--font-body); fill: var(--ink); font-size: 12px; }
  svg.chart .axis-label { fill: var(--muted); }
  svg.chart .gridline { stroke: var(--grid); stroke-width: 1; }
  svg.chart .line-path { fill: none; stroke: var(--accent); stroke-width: 2; }
  svg.chart .dot { fill: var(--accent); }
  svg.chart .line-hit { fill: transparent; stroke: transparent; stroke-width: 2; cursor: help; }
  svg.chart .line-hit:focus-visible { fill: rgba(79,39,89,.10); stroke: var(--ink); outline: none; }
  svg.chart .max-label { fill: var(--ink); font-size: 11px; font-weight: 600; }

  .bar-chart { display: grid; gap: 5px; }
  .bar-row, .bar-scale { display: grid; grid-template-columns: minmax(112px, 190px) minmax(120px, 1fr) 34px;
    align-items: center; gap: 10px; min-height: 30px; }
  .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--ink-soft, var(--muted)); }
  .bar-plot { position: relative; height: 24px; border-left: 1px solid var(--grid); border-right: 1px solid var(--grid);
    background: linear-gradient(to right, transparent calc(50% - .5px), var(--grid) calc(50% - .5px), var(--grid) calc(50% + .5px), transparent calc(50% + .5px)); }
  .bar-fill { position: absolute; left: 0; top: 6px; width: var(--bar-w, 0%); min-width: 2px; height: 12px;
    border-radius: 0 4px 4px 0; background: var(--accent); transition: background .15s; }
  .bar-fill.is-active { background: var(--accent-deep); }
  .bar-mark { --bar-w: 0%; position: absolute; left: 0; top: 0; width: max(var(--bar-w), 24px); height: 24px;
    padding: 0; border: 0; background: transparent; cursor: help; }
  .bar-mark:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
  .bar-max { font-size: 11px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar-scale { min-height: 18px; margin-top: -3px; }
  .bar-ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }

  .chart-tooltip { position: absolute; z-index: 5; max-width: min(240px, calc(100% - 8px)); padding: 6px 8px;
    border-radius: 4px; background: var(--ink); color: var(--paper); box-shadow: 0 6px 18px rgba(43,40,31,.18);
    font-size: 11.5px; line-height: 1.35; pointer-events: none; }
  .chart-tooltip[hidden] { display: none; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.30); }
  table.recent { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.recent th, table.recent td { text-align: left; padding: 10px 11px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.recent th { background: rgba(235,228,215,.56); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--label); font-weight: 700; }
  table.recent td:nth-child(2) { white-space: normal; min-width: 220px; }
  table.recent tbody tr:last-child td { border-bottom: 0; }

  @media (max-width: 720px) {
    header.app .wrap { align-items: flex-start; padding-top: 18px; padding-bottom: 17px; }
    header.app p { max-width: 26ch; }
    .back-link { padding-left: 12px; padding-right: 12px; }
    .totals-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bar-row, .bar-scale { grid-template-columns: minmax(88px, 34%) minmax(100px, 1fr) 28px; gap: 7px; }
    .bar-label { font-size: 11px; }
  }
  @media (max-width: 430px) {
    .wrap { padding-left: 14px; padding-right: 14px; }
    header.app h1 { font-size: 24px; }
    header.app p { font-size: 12px; }
    header.app .back-link { font-size: 0; padding: 5px 10px; }
    header.app .back-link::after { content: "← Back"; font-size: 12px; }
    .tile { padding: 14px; }
    .tile .n { font-size: 30px; }
    .panel { padding: 17px 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<header class="app">
  <div class="wrap">
    <div>
      <h1>Springboard — <em>Admin stats</em></h1>
      <p>Usage analytics. Password-protected.</p>
    </div>
    <a class="btn ghost back-link" href="index.html">&larr; Back to Springboard</a>
  </div>
</header>

<div class="wrap">
  <main>
    <p id="statusMsg" role="status" hidden></p>

    <section id="gate" class="panel gate">
      <form id="gateForm" novalidate>
        <label for="pw">Admin password</label>
        <input type="password" id="pw" name="pw" autocomplete="current-password" required />
        <button type="submit" class="btn primary">View stats</button>
      </form>
      <p id="gateMsg" class="alert bad" role="alert" hidden></p>
    </section>

    <section id="dash" hidden>
    <div class="toolbar">
      <button type="button" id="refreshBtn" class="btn ghost">Refresh</button>
      <span id="errMsg" class="alert bad" role="alert" hidden></span>
    </div>

    <div id="totalsStrip" class="totals-strip" role="group" aria-label="Event totals"></div>

    <div class="card panel">
      <h2>PowerPoints generated per day (last 30 days)</h2>
      <div id="byDayChart"></div>
    </div>

    <div class="charts-grid">
      <div class="card panel">
        <h2>By curriculum</h2>
        <div id="byCurriculumChart"></div>
      </div>
      <div class="card panel">
        <h2>By routine (top 10)</h2>
        <div id="byRoutineChart"></div>
      </div>
      <div class="card panel">
        <h2>By stimulus type</h2>
        <div id="byStimulusChart"></div>
      </div>
      <div class="card panel">
        <h2>By subject</h2>
        <div id="bySubjectChart"></div>
      </div>
    </div>

    <div class="card panel">
      <h2>Recent activity</h2>
      <div class="table-scroll">
        <table class="recent">
          <thead>
            <tr>
              <th scope="col">Time</th>
              <th scope="col">Topic</th>
              <th scope="col">Curriculum</th>
              <th scope="col">Subject</th>
              <th scope="col">Year</th>
              <th scope="col">Routine</th>
            </tr>
          </thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
    </div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  // Same API_BASE logic as index.html (duplicated on purpose — the two pages are independent).
  var API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.protocol === "file:")
    ? "http://localhost:3000"
    : "https://springboard-dlp-s-projects.vercel.app"; // real URL substituted at deploy time

  var EVENT_TYPES = ["analyse", "generate", "regenerate", "download"];
  var STORE_KEY = "sb_admin";

  function $(id) { return document.getElementById(id); }
  var gate = $("gate"), gateForm = $("gateForm"), pwInput = $("pw"), gateMsg = $("gateMsg");
  var dash = $("dash"), statusMsg = $("statusMsg"), errMsg = $("errMsg"), refreshBtn = $("refreshBtn");

  function showGateError(msg) { gateMsg.textContent = msg; gateMsg.hidden = false; }
  function clearGateError() { gateMsg.hidden = true; gateMsg.textContent = ""; }
  function showLoadError(msg) { errMsg.textContent = msg; errMsg.hidden = false; }
  function clearLoadError() { errMsg.hidden = true; errMsg.textContent = ""; }

  function fetchStats(password) {
    return fetch(API_BASE + "/api/stats", {
      method: "POST",
      headers: { "x-sb-admin": password },
    }).then(function (res) {
      if (res.status === 401) { var e = new Error("wrong-password"); e.code = 401; throw e; }
      if (!res.ok) { var e2 = new Error("http-" + res.status); e2.code = res.status; throw e2; }
      return res.json();
    });
  }

  function loadStats(password) {
    clearGateError();
    clearLoadError();
    statusMsg.hidden = false;
    statusMsg.textContent = "Loading stats…";
    return fetchStats(password).then(function (data) {
      sessionStorage.setItem(STORE_KEY, password);
      gate.hidden = true;
      dash.hidden = false;
      render(data);
    }).catch(function (err) {
      if (err.code === 401) {
        sessionStorage.removeItem(STORE_KEY);
        dash.hidden = true;
        gate.hidden = false;
        showGateError("Wrong password.");
      } else if (dash.hidden) {
        showGateError("Couldn't reach the server. Try again.");
      } else {
        showLoadError("Couldn't refresh stats. Try again.");
      }
    }).then(function () {
      statusMsg.hidden = true;
      statusMsg.textContent = "";
    });
  }

  gateForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = pwInput.value;
    if (!pw) { showGateError("Enter a password."); return; }
    loadStats(pw);
  });

  refreshBtn.addEventListener("click", function () {
    var pw = sessionStorage.getItem(STORE_KEY);
    if (pw) loadStats(pw);
  });

  // Auto-fetch if a password is already remembered for this tab.
  var stored = sessionStorage.getItem(STORE_KEY);
  if (stored) loadStats(stored);

  // ---------- rendering (DOM APIs only — server strings are teacher free text, never innerHTML) ----------

  function render(data) {
    renderTotals(data.totals || []);
    lineChart($("byDayChart"), fill30Days(data.byDay || []));
    barChart($("byCurriculumChart"), data.byCurriculum || [], "curriculum", "Curriculum");
    barChart($("byRoutineChart"), (data.byRoutine || []).slice(0, 10), "routine", "Routine");
    barChart($("byStimulusChart"), data.byStimulus || [], "stimulus_type", "Stimulus type");
    barChart($("bySubjectChart"), data.bySubject || [], "subject", "Subject");
    renderRecent(data.recent || []);
  }

  function renderTotals(totals) {
    var el = $("totalsStrip");
    el.textContent = "";
    var byEvent = {};
    totals.forEach(function (r) { byEvent[r.event] = r.n; });
    EVENT_TYPES.forEach(function (type) {
      var tile = document.createElement("div");
      tile.className = "tile";
      var n = document.createElement("div");
      n.className = "n";
      n.textContent = String(byEvent[type] || 0);
      var label = document.createElement("div");
      label.className = "label";
      label.textContent = type;
      tile.appendChild(n);
      tile.appendChild(label);
      el.appendChild(tile);
    });
  }

  function renderRecent(rows) {
    var tbody = $("recentBody");
    tbody.textContent = "";
    if (!rows.length) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 6;
      td.className = "empty-note";
      td.textContent = "No recent activity yet.";
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }
    var cols = ["ts", "topic", "curriculum", "subject", "year_level", "routine"];
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      cols.forEach(function (key) {
        var td = document.createElement("td");
        var v = r[key];
        td.textContent = (v === null || v === undefined || v === "") ? "—" : String(v);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  // Fill the trailing 30-day window with 0 on days with no rows. Empty input -> empty
  // output, so barChart/lineChart show the "No data yet" placeholder instead of a
  // flat 30-day line of zeros. Uses pure epoch-ms arithmetic to stay UTC-consistent
  // (never crosses timezone frame via getDate/setDate).
  function fill30Days(rows) {
    if (!rows || !rows.length) return [];
    var byDay = {};
    (rows || []).forEach(function (r) { byDay[r.day] = r.n; });
    var out = [];
    var DAY_MS = 86400000;
    var todayUtcMs = Math.floor(Date.now() / DAY_MS) * DAY_MS;
    for (var i = 29; i >= 0; i--) {
      var key = new Date(todayUtcMs - i * DAY_MS).toISOString().slice(0, 10);
      out.push({ day: key, n: byDay[key] || 0 });
    }
    return out;
  }

  // ---------- hand-rolled chart helpers ----------

  var SVG_NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function emptyNote(el) {
    el.textContent = "";
    var p = document.createElement("p");
    p.className = "empty-note";
    p.textContent = "No data yet.";
    el.appendChild(p);
  }

  function makeChartTooltip(host) {
    host.classList.add("chart-host");
    var tooltip = document.createElement("div");
    tooltip.className = "chart-tooltip";
    tooltip.setAttribute("role", "tooltip");
    tooltip.hidden = true;
    host.appendChild(tooltip);
    return tooltip;
  }

  function wireChartTooltip(host, mark, tooltip, text, activeMark) {
    mark.setAttribute("tabindex", "0");
    mark.setAttribute("role", "img");
    mark.setAttribute("aria-label", text);
    function show() {
      tooltip.textContent = text;
      tooltip.hidden = false;
      if (activeMark) activeMark.classList.add("is-active");
      var markRect = mark.getBoundingClientRect();
      var hostRect = host.getBoundingClientRect();
      var left = markRect.left - hostRect.left + markRect.width / 2 - tooltip.offsetWidth / 2;
      left = Math.max(4, Math.min(left, hostRect.width - tooltip.offsetWidth - 4));
      var top = markRect.top - hostRect.top - tooltip.offsetHeight - 7;
      if (top < 2) top = markRect.bottom - hostRect.top + 7;
      tooltip.style.left = left + "px";
      tooltip.style.top = top + "px";
    }
    function hide() {
      tooltip.hidden = true;
      if (activeMark) activeMark.classList.remove("is-active");
    }
    mark.addEventListener("mouseenter", show);
    mark.addEventListener("focus", show);
    mark.addEventListener("mouseleave", hide);
    mark.addEventListener("blur", hide);
  }

  // Sighted-hidden data-table equivalent for a chart (WCAG 1.1.1) — same rows the
  // bars/dots draw from, so screen readers get every label+value, not just the "top" ones.
  function srDataTable(id, labelHeader, labelKey, rows) {
    var table = document.createElement("table");
    table.className = "sr-only";
    table.id = id;
    var thead = document.createElement("thead");
    var headRow = document.createElement("tr");
    [labelHeader, "Count"].forEach(function (h) {
      var th = document.createElement("th");
      th.scope = "col";
      th.textContent = h;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      var td1 = document.createElement("td");
      td1.textContent = String(row[labelKey] == null ? "—" : row[labelKey]);
      var td2 = document.createElement("td");
      td2.textContent = String(row.n || 0);
      tr.appendChild(td1);
      tr.appendChild(td2);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  }

  // Horizontal bar chart. rows: [{ [labelKey]: string, n: number }], already sorted desc.
  function barChart(el, rows, labelKey, labelHeader) {
    el.textContent = "";
    if (!rows.length) { emptyNote(el); return; }

    var max = Math.max.apply(null, rows.map(function (r) { return r.n || 0; }).concat([1]));
    var dataId = el.id + "-data";
    var chart = document.createElement("div");
    chart.className = "bar-chart";
    chart.setAttribute("role", "group");
    chart.setAttribute("aria-label", "Bar chart of " + (labelHeader || labelKey));
    chart.setAttribute("aria-describedby", dataId);
    el.appendChild(chart);
    var tooltip = makeChartTooltip(el);
    var maxLabelled = false;

    rows.forEach(function (row) {
      var fullLabel = String(row[labelKey] == null ? "—" : row[labelKey]);
      var n = row.n || 0;
      var barWidth = ((n / max) * 100).toFixed(2) + "%";
      var rowEl = document.createElement("div");
      rowEl.className = "bar-row";
      var label = document.createElement("span");
      label.className = "bar-label";
      label.title = fullLabel;
      label.textContent = fullLabel;
      var plot = document.createElement("div");
      plot.className = "bar-plot";
      var fill = document.createElement("span");
      fill.className = "bar-fill";
      fill.style.setProperty("--bar-w", barWidth);
      fill.setAttribute("aria-hidden", "true");
      var mark = document.createElement("button");
      mark.type = "button";
      mark.className = "bar-mark chart-mark";
      mark.style.setProperty("--bar-w", barWidth);
      wireChartTooltip(el, mark, tooltip, fullLabel + ": " + n, fill);
      plot.appendChild(fill);
      plot.appendChild(mark);
      var maxValue = document.createElement("span");
      maxValue.className = "bar-max";
      if (!maxLabelled && n === max) {
        maxValue.textContent = String(n);
        maxLabelled = true;
      }
      rowEl.appendChild(label);
      rowEl.appendChild(plot);
      rowEl.appendChild(maxValue);
      chart.appendChild(rowEl);
    });

    var scale = document.createElement("div");
    scale.className = "bar-scale";
    scale.setAttribute("aria-hidden", "true");
    scale.appendChild(document.createElement("span"));
    var ticks = document.createElement("span");
    ticks.className = "bar-ticks";
    [0, Math.round(max / 2), max].forEach(function (value) {
      var tick = document.createElement("span");
      tick.textContent = String(value);
      ticks.appendChild(tick);
    });
    scale.appendChild(ticks);
    scale.appendChild(document.createElement("span"));
    chart.appendChild(scale);
    el.appendChild(srDataTable(dataId, labelHeader || labelKey, labelKey, rows));
  }

  // Line chart. rows: [{ day: "YYYY-MM-DD", n: number }], pre-filled + ascending.
  function lineChart(el, rows) {
    el.textContent = "";
    if (!rows.length) { emptyNote(el); return; }

    el.classList.add("chart-host");
    var width = Math.max(320, Math.round(el.clientWidth || 700));
    var height = 220, padL = 40, padR = 16, padT = 16, padB = 26;
    var plotW = width - padL - padR, plotH = height - padT - padB;
    var max = Math.max.apply(null, rows.map(function (r) { return r.n || 0; }).concat([1]));

    var dataId = el.id + "-data";
    var svg = svgEl("svg", {
      "class": "chart line-chart", viewBox: "0 0 " + width + " " + height, width: "100%",
      height: String(height), role: "group", "aria-label": "Line chart of PowerPoints generated per day",
      "aria-describedby": dataId,
    });

    [0, 0.5, 1].forEach(function (f) {
      var y = padT + plotH * (1 - f);
      svg.appendChild(svgEl("line", { "class": "gridline", x1: padL, x2: width - padR, y1: y, y2: y }));
      var t = svgEl("text", { "class": "axis-label", x: padL - 8, y: y + 4, "text-anchor": "end" });
      t.textContent = String(Math.round(max * f));
      svg.appendChild(t);
    });

    var stepX = rows.length > 1 ? plotW / (rows.length - 1) : 0;
    var points = rows.map(function (r, i) {
      return { x: padL + stepX * i, y: padT + plotH * (1 - (r.n || 0) / max), row: r };
    });

    var d = points.map(function (p, i) { return (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1); }).join(" ");
    svg.appendChild(svgEl("path", { "class": "line-path", d: d }));

    var tooltip = makeChartTooltip(el);
    points.forEach(function (p, i) {
      if (i === 0 || i === points.length - 1 || i % 5 === 0) {
        var t = svgEl("text", { "class": "axis-label", x: p.x, y: height - 6, "text-anchor": "middle" });
        t.textContent = p.row.day.slice(5); // MM-DD
        svg.appendChild(t);
      }
      var dot = svgEl("circle", { "class": "dot", cx: p.x, cy: p.y, r: 3 });
      svg.appendChild(dot);
      var hit = svgEl("circle", { "class": "line-hit chart-mark", cx: p.x, cy: p.y, r: 12 });
      wireChartTooltip(el, hit, tooltip, p.row.day + ": " + (p.row.n || 0));
      svg.appendChild(hit);
    });

    el.appendChild(svg);
    el.appendChild(srDataTable(dataId, "Day", "day", rows));
  }
})();
</script>
</body>
</html>
