// Human-readable byte size, e.g. 26214400 -> "25.0 MB".
function formatBytes(n) {
  if (n == null || isNaN(n)) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}

// Resolve once the video has finished seeking to time t (seconds).
function seekTo(video, t) {
  return new Promise((resolve, reject) => {
    const onSeeked = () => { cleanup(); resolve(); };
    const onErr = () => { cleanup(); reject(new Error("seek failed")); };
    const cleanup = () => {
      video.removeEventListener("seeked", onSeeked);
      video.removeEventListener("error", onErr);
    };
    video.addEventListener("seeked", onSeeked);
    video.addEventListener("error", onErr);
    video.currentTime = Math.min(Math.max(t, 0), video.duration || t);
  });
}

// Sample `count` evenly-spaced still frames from a video File, fully in-browser.
// Returns JPEG data URLs. Never rejects: if the browser can't decode the format,
// resolves with frames:[] so the caller can fall back to a description + embed.
function extractVideoFrames(file, count = 4) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const video = document.createElement("video");
    video.muted = true;
    video.preload = "metadata";
    video.src = url;
    const finish = (frames, meta) => {
      URL.revokeObjectURL(url);
      resolve({ frames, poster: frames[0] || "", ...meta });
    };
    const fail = () => finish([], { duration: 0, width: 0, height: 0 });
    video.onerror = fail;
    video.onloadedmetadata = async () => {
      const duration = video.duration, vw = video.videoWidth, vh = video.videoHeight;
      if (!duration || !isFinite(duration) || !vw || !vh) return fail();
      const scale = Math.min(1, 1024 / Math.max(vw, vh));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(vw * scale);
      canvas.height = Math.round(vh * scale);
      const ctx = canvas.getContext("2d");
      const frames = [];
      try {
        for (let i = 1; i <= count; i++) {
          await seekTo(video, duration * i / (count + 1));
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          frames.push(canvas.toDataURL("image/jpeg", 0.8));
        }
      } catch (_) { /* keep whatever frames we captured */ }
      finish(frames, { duration, width: vw, height: vh });
    };
  });
}

// Decode a media file's audio, downmix to 16 kHz mono, return a 16-bit PCM WAV Blob.
// Caps at maxSeconds (truncating long clips) so the result stays under the API limit.
// Default (120s) keeps a 16kHz/16-bit mono WAV (~32 KB/s) under TRANSCRIBE_LIMIT with margin.
async function videoFileToWav16k(file, maxSeconds = 120) {
  const arrayBuf = await file.arrayBuffer();
  const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const tmp = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try { decoded = await tmp.decodeAudioData(arrayBuf.slice(0)); }
  finally { tmp.close && tmp.close(); }
  const srcRate = decoded.sampleRate, outRate = 16000;
  const wantSec = Math.min(decoded.duration, maxSeconds);
  const truncated = decoded.duration > maxSeconds + 0.5;
  const frames = Math.floor(wantSec * outRate);
  const off = new Ctx(1, frames, outRate);
  const buf = off.createBuffer(1, Math.floor(wantSec * srcRate), srcRate);
  // mono downmix
  const ch0 = decoded.getChannelData(0);
  const ch1 = decoded.numberOfChannels > 1 ? decoded.getChannelData(1) : null;
  const mono = buf.getChannelData(0);
  for (let i = 0; i < mono.length; i++) mono[i] = ch1 ? (ch0[i] + ch1[i]) / 2 : ch0[i];
  const node = off.createBufferSource(); node.buffer = buf; node.connect(off.destination); node.start();
  const rendered = await off.startRendering();
  const data = rendered.getChannelData(0);
  // PCM16 WAV
  const bytesPerSample = 2, blockAlign = bytesPerSample, byteRate = outRate * blockAlign;
  const ab = new ArrayBuffer(44 + data.length * 2), view = new DataView(ab);
  const wr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  wr(0, "RIFF"); view.setUint32(4, 36 + data.length * 2, true); wr(8, "WAVE"); wr(12, "fmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, outRate, true); view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true); view.setUint16(34, 16, true); wr(36, "data");
  view.setUint32(40, data.length * 2, true);
  let off2 = 44;
  for (let i = 0; i < data.length; i++) { let s = Math.max(-1, Math.min(1, data[i])); view.setInt16(off2, s < 0 ? s * 0x8000 : s * 0x7fff, true); off2 += 2; }
  return { blob: new Blob([ab], { type: "audio/wav" }), truncated };
}

function readFileAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* Shrink a photo before it is uploaded and sent to the model. Video frames were already capped at
   1024px, but photos went up at whatever the camera produced — a phone shot is several MB, which
   is slow to upload and buys nothing: the model tiles a large image and reads no more detail from
   it. 1568px is OpenAI's own long-edge ceiling for a single vision tile pass, so anything above
   that is pure upload cost. Falls back to the original data URL if anything goes wrong, because a
   deck built from a big photo beats no deck at all. */
const IMG_MAX_EDGE = 1568;
function downscaleDataUrl(dataUrl) {
  return new Promise((res) => {
    try {
      const img = new Image();
      img.onload = () => {
        try {
          const long = Math.max(img.naturalWidth, img.naturalHeight);
          if (!long || long <= IMG_MAX_EDGE) return res(dataUrl);
          const k = IMG_MAX_EDGE / long;
          const c = document.createElement("canvas");
          c.width = Math.round(img.naturalWidth * k);
          c.height = Math.round(img.naturalHeight * k);
          const ctx = c.getContext("2d");
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(img, 0, 0, c.width, c.height);
          const out = c.toDataURL("image/jpeg", 0.85);
          res(out && out.length < dataUrl.length ? out : dataUrl);
        } catch (_) { res(dataUrl); }
      };
      img.onerror = () => res(dataUrl);
      img.src = dataUrl;
    } catch (_) { res(dataUrl); }
  });
}

// Build a QR code data URL synchronously. Never throws — returns "" if the
// library is missing or generation fails, so a QR problem can't blank the app.
function makeQrDataUrl(text) {
  try {
    if (typeof qrcode !== "function" || !text) return "";
    const qr = qrcode(0, "M"); // type 0 = auto-size, medium error correction
    qr.addData(String(text));
    qr.make();
    return qr.createDataURL(6, 8); // cellSize, margin -> GIF data URL
  } catch (_) {
    return "";
  }
}

// Strip site chrome (nav, images, link URLs, related-article footers) out of the
// markdown a reader service returns, leaving mostly the article body.
function cleanArticleMarkdown(md) {
  let t = String(md || "");
  // Cut everything from the first end-of-article / footer marker onward.
  const markers = ["Explore more on these topics", "\n### Most viewed", "\n## Most viewed", "\nReuse this content", "\n## More from"];
  let cut = t.length;
  for (const m of markers) { const i = t.indexOf(m); if (i !== -1 && i < cut) cut = i; }
  t = t.slice(0, cut);
  t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, "");          // drop images
  t = t.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");        // links -> plain label
  t = t.replace(/^\s*-\s*\[[ xX]\]\s*$/gm, "");         // checkbox artefacts
  const drop = /^(Skip to|Search input|Show more|Hide expanded|Close dialogue|Support the Guardian|Fund independent|US edition|UK edition|Australia edition|Europe edition|International edition|Sign in|Print subscriptions|Download the app|View image|Prefer the Guardian|Toggle caption|Next image|Previous image|google-search)/i;
  t = t.split("\n").filter(l => !drop.test(l.trim())).join("\n");
  t = t.replace(/\n{3,}/g, "\n\n").trim();
  return t;
}

// Site furniture that must never become a lesson's lead image: mastheads, promo banners,
// newsletter/subscribe art, share buttons, tracking pixels, author headshots.
const JUNK_IMAGE = /logo|icon|sprite|avatar|headshot|placeholder|1x1|pixel|spacer|blank|beacon|tracking|favicon|badge|banner|promo|newsletter|subscri|share|social|byline|[-_/]ads?[-_/]|\.svg(\?|$)/i;

// Sites behind a bot check (Cloudflare and friends) hand the reader service a challenge page
// instead of the article. It answers HTTP 200 and carries enough words to pass a length check,
// so without this the challenge wording became the "article" — and there was no picture to find.
// Kept in sync with BOT_WALL in api/fetch-article.js.
const BOT_WALL_TEXT = /just a moment|performing security verification|security verification|checking your browser|enable javascript and cookies|attention required|verify (?:you|that you) are (?:a )?human|are you a robot|captcha|cf-browser-verification|ddos protection|request unsuccessful/i;
const looksLikeBotWall = (t) => BOT_WALL_TEXT.test(String(t || "").slice(0, 600));

// Find the first real content image URL in reader markdown.
function extractLeadImage(md) {
  const src = String(md || "");
  const scan = (text) => {
    const re = /!\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/g;
    let m;
    while ((m = re.exec(text))) {
      const u = m[1];
      if (JUNK_IMAGE.test(u)) continue;
      if (/\.(jpe?g|png|webp|gif)(\?|$)/i.test(u) || /\/img\/|\/media\/|\/images?\//i.test(u)) return u;
    }
    return "";
  };
  // Prefer an image from BELOW the article's first heading — mastheads and promo strips live above
  // it, and one of those winning the race put an unrelated picture on IGNITE. Fall back to the whole
  // document when the body carries no image of its own.
  const h = src.search(/^#{1,3}\s+\S/m);
  return (h > 0 ? scan(src.slice(h)) : "") || scan(src);
}

// Fetch a (possibly cross-origin) image and return a base64 data URL, routed through
// the wsrv.nl image proxy so CORS never blocks embedding it in the .pptx. "" on failure.
// Turn a base64 data URL into a File without fetch(): the page's CSP allows data: for img/media
// but connect-src is 'self' https: only, so fetch("data:…") throws "Failed to fetch".
function dataUrlToFile(dataUrl, name) {
  const [head, b64] = String(dataUrl || "").split(",");
  const mime = ((/data:([^;,]+)/.exec(head || "") || [])[1] || "image/jpeg").toLowerCase();
  const bin = atob(b64 || "");
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new File([bytes], name, { type: mime });
}

function blobToDataUrl(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}

async function urlToDataUrl(url) {
  if (!url) return "";
  if (/^data:/i.test(url)) return url;                 // api/fetch-article already inlined the bytes
  const proxied = "https://images.weserv.nl/?url=" + encodeURIComponent(url.replace(/^https?:\/\//, "")) + "&output=jpg";
  try {
    const resp = await fetch(proxied);
    if (!resp.ok) throw new Error("proxy " + resp.status);
    const blob = await resp.blob();
    return await blobToDataUrl(blob);
  } catch (_) { return ""; }
}

// Wikimedia (and plenty of CDNs) send CORS headers, so try the host itself before the proxy —
// one less hop, and full resolution.
async function imageUrlToDataUrl(url) {
  if (!url) return "";
  try {
    const resp = await fetch(url, { mode: "cors" });
    if (resp.ok) {
      const blob = await resp.blob();
      if (blob.size) return await blobToDataUrl(blob);
    }
  } catch (_) { /* no CORS here — fall back to the proxy */ }
  return urlToDataUrl(url);
}

// Find one relevant, free (CC-licensed) image for a topic via the Wikimedia
// Commons API (keyless, CORS-enabled with origin=*). Returns {url, title}, or null on any
// failure — so a missing image never breaks the flow.
async function findFreeImage(query) {
  const q = String(query || "").replace(/[^a-zA-Z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  if (!q) return null;
  try {
    const api = "https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=6&gsrsearch="
      + encodeURIComponent(q) + "&prop=imageinfo&iiprop=url&iiurlwidth=1400&format=json&origin=*";
    const resp = await fetch(api);
    if (!resp.ok) return null;
    const data = await resp.json();
    const pages = (data.query && data.query.pages) ? Object.values(data.query.pages) : [];
    pages.sort((a, b) => (a.index || 0) - (b.index || 0)); // keep search relevance order
    for (const p of pages) {
      const info = p && p.imageinfo && p.imageinfo[0];
      const u = info && (info.thumburl || info.url);
      if (u && /\.(jpe?g|png|webp)(\?|$)/i.test(u)) {     // raster only (skip svg/pdf/djvu)
        return { url: u, title: String(p.title || "").replace(/^File:/i, "").replace(/\.[a-z0-9]+$/i, "") };
      }
    }
    return null;
  } catch (_) { return null; }
}

// Words worth searching, taken from a page link. Some sites (nma.gov.au) answer every server,
// reader service and image proxy with 403 and only open for a real person's browser, so the link
// itself is all the app can read. A slug like
// "founding-australia-capt-arthur-phillip-rn-sydney-cove-jan-26th-1788-algernon-talmage-1937"
// describes the artwork better than most page titles do.
function keywordsFromLink(url) {
  let path = "";
  try { path = decodeURIComponent(new URL(url).pathname); } catch (_) { return ""; }
  const junk = /^(images?|media|photos?|pictures?|news|story|stories|articles?|wiki|index|home|en|au|www|assets|files|default|sites|content|collections?|objects?|items?|view|page|p|s|search|results?|result|query|q|find|browse|tags?|categor(y|ies))$/i;
  const words = path.replace(/\.(html?|php|aspx?|jpe?g|png|webp|gif)$/i, "")
    .split(/[\/\-_+.]+/)
    .filter(w => w && !junk.test(w) && !/^\d{1,2}(st|nd|rd|th)?$/i.test(w));
  // One word is not a subject, it is a coincidence, and this function's output is handed straight
  // to a Commons search whose picture is then presented to the teacher as theirs. "/search" came
  // through as the single word "search" and Commons answered with an unrelated photograph
  // (reported 2026-08-07). Two words or more, or say nothing and let the caller admit defeat.
  return words.length >= 2 ? words.slice(0, 12).join(" ") : "";
}

/* A results page is not a stimulus. Google Images identifies the picture you clicked with an
   internal id in the fragment (#sv=CAMSURoy...), never its address, so NOTHING on that link says
   which image the teacher was looking at. Worth naming explicitly because every reader downstream
   half-succeeds on one: the page fetch finds no lead image, and the Wikimedia fallback then
   searched the only word in the path and dropped a stranger's photo into the reel, announced as a
   "free version" of the teacher's picture (reported 2026-08-07). Better to say what to do instead. */
function isSearchResultsPage(url) {
  let u;
  try { u = new URL(url); } catch (_) { return false; }
  const host = u.hostname.replace(/^www\./i, "");
  const engine = /^(images\.)?(google\.[a-z.]+|bing\.com|duckduckgo\.com|search\.yahoo\.com|search\.brave\.com|yandex\.[a-z.]+|ecosia\.org|lens\.google\.com)$/i.test(host);
  if (!engine) return false;
  return /^\/(search|images|imghp|imgres|url|maps)\b/i.test(u.pathname) || u.searchParams.has("q");
}

/* "Copy image address" hands over the picture's own URL. That is neither a social post nor a page
   with a picture ON it, so both readers in importFromPostLink fail on one and the teacher is told
   to do the thing they just did. Recognised by file extension, or by being a search engine's own
   thumbnail host — Google's thumbnail addresses carry no extension at all, and they are exactly
   what "Copy image address" gives you from a Google Images results grid. */
function looksLikeImageUrl(url) {
  let u;
  try { u = new URL(url); } catch (_) { return false; }
  if (/\.(jpe?g|png|webp|gif|avif|bmp)$/i.test(u.pathname)) return true;
  return /(^|\.)(gstatic\.com|ggpht\.com|bing\.net|duckduckgo\.com)$/i.test(u.hostname)
    && /^\/(images|th|iu)\b/i.test(u.pathname);
}

// The one search link that DOES carry the picture: Google's older "imgres" viewer puts the real
// image address in ?imgurl=. Returns it so the ordinary import path can take over, "" otherwise.
function imageUrlFromSearchLink(url) {
  try {
    const raw = new URL(url).searchParams.get("imgurl") || "";
    return /^https?:\/\//i.test(raw) ? raw : "";
  } catch (_) { return ""; }
}

async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  await loadScript(PDFJS_SRC, PDFJS_SRI);
  const pdfjs = window.pdfjsLib;
  pdfjs.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js"; // self-hosted, same-origin (workers can't carry SRI)
  const pdf = await pdfjs.getDocument({ data: buf }).promise;
  let text = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(" ") + "\n";
  }
  return text.trim();
}

// Pull the first valid JSON object out of a string, defensively.
/* Parse the JSON the model has written SO FAR. A streamed reply is a half-finished object, so
   close whatever is still open — an unterminated string, then any dangling key, then every open
   brace and bracket — and parse that. Returns null while the text is not yet parseable (e.g. the
   very first characters), which is normal and not an error. This is what lets the build screen
   show IGNITE while THINK is still being written. */
// Walk JSON text, ignoring anything inside a string, and report what is STILL open at the end:
// the unclosed braces/brackets in order, and whether a string was left hanging. Two callers need
// this: the streamed "deck so far" parser below, and the cut-off check in parseJsonLoose.
function scanJsonOpen(body) {
  const stack = [];
  let inStr = false, esc = false;
  for (let i = 0; i < body.length; i++) {
    const c = body[i];
    if (esc) { esc = false; continue; }
    if (c === "\\") { if (inStr) esc = true; continue; }
    if (c === '"') { inStr = !inStr; continue; }
    if (inStr) continue;
    if (c === "{" || c === "[") stack.push(c);
    else if (c === "}" || c === "]") stack.pop();
  }
  return { stack, inStr };
}

function parsePartialJson(raw) {
  const start = raw.indexOf("{");
  if (start === -1) return null;
  const body = raw.slice(start);
  const { stack, inStr } = scanJsonOpen(body);
  let out = body;
  if (inStr) out += '"';                                   // close the value being written
  out = out.replace(/,\s*$/, "");                          // drop a trailing comma
  out = out.replace(/,\s*"[^"]*"\s*:\s*$/, "")             // drop a key with no value yet
           .replace(/([{[])\s*"[^"]*"\s*:\s*$/, "$1");
  out = out.replace(/,\s*$/, "");
  for (let i = stack.length - 1; i >= 0; i--) out += stack[i] === "{" ? "}" : "]";
  try { return JSON.parse(out); } catch (_) { return null; }
}

/* The finished reply, parsed as forgivingly as is honest.
   1. Strict parse — the normal path.
   2. A fence or a line of prose around it — take the first "{" to the last "}".
   3. Braces that never close — the reply was CUT OFF mid-write. Thrown with .truncated so the
      caller can say that in plain English instead of quoting a syntax position.
   Step 3 is why the old fallback had to go, and it is the whole of the 2026-08-07 bug. That
   fallback sliced to the last "}" ANYWHERE in the text; in a cut-off reply that brace is an inner
   one, so it spliced the document's head onto a random inner tail and JSON.parse then blamed a
   position inside the splice. The teacher was told "Expected ',' or ']' after array element in
   JSON at position 3602 (line 65 column 6)" — a fault at a place that never existed, describing
   the repair rather than the failure, and hiding the real one: the lesson ran out of room. */
function parseJsonLoose(raw) {
  try { return JSON.parse(raw); } catch (_) {}
  const start = raw.indexOf("{");
  if (start === -1) throw new Error("No JSON object found in model output.");
  // Checked BEFORE the salvage slice, not after it, so the diagnosis comes from the reply the
  // model actually sent rather than from whatever the repair made of it.
  const open = scanJsonOpen(raw.slice(start));
  if (open.stack.length || open.inStr) {
    const e = new Error("The reply stopped before the lesson was finished.");
    e.truncated = true;
    throw e;
  }
  const end = raw.lastIndexOf("}");
  if (end > start) return JSON.parse(raw.slice(start, end + 1)); // may throw -> caller catches
  throw new Error("No JSON object found in model output.");
}

// Grow a textarea to exactly fit its content. Height must be cleared first or scrollHeight only
// ever reports the taller of (content, current height) and the field can grow but never shrink.
function fitTextarea(el) {
  if (!el || el.tagName !== "TEXTAREA") return;
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

// Strip stray markdown (bold/italic/code/heading markers) the model sometimes adds.
function stripMd(s) {
  return String(s == null ? "" : s)
    .replace(/\*\*(.*?)\*\*/g, "$1")
    .replace(/__(.*?)__/g, "$1")
    .replace(/\*(.*?)\*/g, "$1")
    .replace(/`([^`]*)`/g, "$1")
    .replace(/^#{1,6}\s+/gm, "")
    .trim();
}

// Normalise guiding questions to { q, responses } objects. Accepts the model's
// new object shape ({ question, responses }) or a plain string (legacy / fallback),
// so older saved content and either prompt shape still load cleanly.
function normGuiding(arr) {
  if (!Array.isArray(arr) || !arr.length) return [{ q: "", responses: "" }, { q: "", responses: "" }, { q: "", responses: "" }];
  return arr.map(it => typeof it === "string"
    ? { q: stripMd(it), responses: "" }
    : { q: stripMd((it && (it.question || it.q)) || ""), responses: stripMd((it && it.responses) || "") });
}

// Shape a parsed model reply into the editable Springboard deck object. Pure (uses
// only stripMd), validating/defaulting the 4-part IGNITE / THINK / LAUNCH / REFLECT
// schema that the preview edits and Tasks 12-14 (export) consume. Arrays are trimmed
// to their limits; missing fields default to empty strings/arrays; think.routine is
// forced to the teacher's picked routineName so it always matches an exact ROUTINES name.
function shapeDeck(parsed, { routineName }) {
  const p = parsed && typeof parsed === "object" ? parsed : {};
  const str = v => stripMd(v == null ? "" : String(v));
  const arr = (v, max) => (Array.isArray(v) ? v.map(str).filter(Boolean).slice(0, max) : []);
  const obj = v => (v && typeof v === "object" ? v : {});
  const ig = obj(p.ignite), th = obj(p.think), la = obj(p.launch), re = obj(p.reflect), no = obj(p.notes);
  return {
    title: str(p.title),
    // The teacher's own words when they typed one, otherwise the model's. Whitelisted here or it
    // would be dropped before the slide and the editor ever saw it.
    intention: str(p.intention),
    keywords: arr(p.keywords, 6),
    ignite:  { question: str(ig.question) },
    // summary = the 5 sentences students read beside the routine on THINK (article stimulus only;
    // empty for an image/video reel, and empty on decks generated before this field existed).
    // minutes drives the THINK slide's countdown. Seeded from the routine's own "how to run it"
    // line, then owned by the teacher (the editor's Timer field), because timing always changes.
    // thinkMinutes is declared further down the file and hoisted; it clamps to 1-30 and falls back
    // to 3, so a missing or junk value cannot produce a broken timer.
    think:   { routine: str(routineName) || str(th.routine), steps: arr(th.steps, 4), structure: str(th.structure), summary: str(th.summary),
               minutes: thinkMinutes(th.minutes != null ? String(th.minutes) + " min" : th.structure),
               // The withheld surprise + the question that follows it (see the THINK slide's
               // click-to-reveal). Absent for routines that have nothing to withhold.
               // label names WHAT is behind the button ("the painting's origin") so the pill reads
               // "Click to reveal: …" instead of a bare "Click to reveal" the teacher can't plan from.
               reveal: { fact: str((th.reveal || {}).fact), question: str((th.reveal || {}).question), label: str((th.reveal || {}).label) } },
    // ideas = the 3 ways to run the launch. It was missing here, so the model's three
    // suggestions were dropped before export and the LAUNCH notes carried only the single
    // FACILITATION line.
    launch:  { connection: str(la.connection), bridge: str(la.bridge), question: str(la.question), ideas: arr(la.ideas, 3) },
    // metacognition = ONE lesson-specific line for the teacher notes, naming the strategy students
    // actually used today. It replaced a seven-line generic stem bank that printed identically on
    // every deck (and duplicated the student stems already on the slide).
    reflect: { revisit: str(re.revisit), prompts: arr(re.prompts, 4), metacognition: str(re.metacognition) },
    // next = the three teacher-only "Where to next" slides that close the deck: the lessons AFTER
    // this one. Kept to 3 because that's what the deck draws.
    next: (Array.isArray(p.next) ? p.next : []).slice(0, 3)
      .map(n => ({ title: str(obj(n).title), idea: str(obj(n).idea), thinking: str(obj(n).thinking) }))
      .filter(n => n.title || n.idea),
    notes:   { ignite: str(no.ignite), think: str(no.think), launch: str(no.launch), reflect: str(no.reflect) },
  };
}

// Strip characters that are illegal in Windows/macOS filenames (keeps the en-dash
// separators and everyday punctuation), collapse whitespace, and cap the length.
function sanitizeFilename(s) {
  return String(s == null ? "" : s)
    .replace(/[\\/:*?"<>|\x00-\x1f]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, 150) || "Springboard";
}

const TRANSCRIBE_LIMIT = 4 * 1024 * 1024; // Vercel serverless function request-body limit is ~4.5 MB; stay under it
// Below this, a "transcript" is a hallucination on a speechless soundtrack, not speech -- see transcribeMedia.
const TRANSCRIBE_MIN_CHARS = 40;

// Turn a failed backend response into a plain, teacher-facing message. 401 means
// the passcode is wrong; anything else surfaces the server's own error text.
async function backendErrorMessage(resp) {
  if (resp.status === 401) return "Passcode incorrect — check with the Digital Learning team.";
  let detail = "";
  try { const j = await resp.json(); detail = j && j.error ? String(j.error) : ""; }
  catch (_) { detail = await resp.text().catch(() => ""); }
  return `Server error (${resp.status}).${detail ? " " + detail : ""}`;
}

// Transcribe a video/audio File via the backend. Always downsamples to a 16 kHz
// mono WAV first (the backend only accepts raw WAV bytes), truncating very long
// clips so the upload stays under the size cap.
async function transcribeMedia({ passcode, file }) {
  let { blob: wavBlob, truncated } = await videoFileToWav16k(file);
  if (wavBlob.size > TRANSCRIBE_LIMIT) {
    const { blob: b2, truncated: t2 } = await videoFileToWav16k(file, 90);
    wavBlob = b2; truncated = t2 || truncated;
  }
  const resp = await fetch(API_BASE + "/api/transcribe", {
    method: "POST",
    headers: { "x-sb-passcode": passcode, "x-sb-filename": file.name.replace(/\.[^.]+$/, "") + ".wav", "Content-Type": "application/octet-stream" },
    body: wavBlob,
  });
  if (!resp.ok) throw new Error(await backendErrorMessage(resp));
  const data = await resp.json();
  const text = (data.text || "").trim();
  // A clip whose audio is machine noise or room tone has no speech in it, but the transcriber
  // does not return "" -- it invents a short sentence, often in another language. Measured
  // 2026-08-03 across 29 live lessons: a silent 3D-printing clip came back as
  // "そのチャンスを逃した。" and a lava clip as "მთავრობა.", and because the client passed any
  // non-empty transcript into the lesson prompt as real "clip notes", one deck put
  // "The Japanese caption ... means 'I missed that chance'" on a slide as the lesson's
  // surprising fact. Nothing in the video said that. Anything this short is noise, not speech,
  // so drop it and let the video frames carry the stimulus.
  if (text.length < TRANSCRIBE_MIN_CHARS) return { text: "", truncated: false, discarded: text };
  return { text, truncated };
}

// End-of-lesson reflection routines a teacher can pin from the REFLECT card dropdown
// ("" = let the model vary the choice each lesson, the default). Each carries the
// routine's real Harvard PZ prompt stems, injected into the generate prompt so
// reflect.prompts stay true to the routine while adapting to the stimulus.
const REFLECT_ROUTINES = [
  { name: "I Used to Think… / Now I Think…", stems: "I used to think… ; Now I think… ; (say what changed your thinking and why)" },
  { name: "Connect–Extend–Challenge", stems: "one new connection to what you already knew ; one way today extended or pushed your thinking ; one challenge or question still puzzling you" },
  { name: "3-2-1 Bridge", stems: "3 thoughts you now have ; 2 questions still on your mind ; 1 analogy for today's core idea" },
  { name: "Headlines", stems: "a one-line headline that captures the core idea of today's learning" },
  { name: "Reflect–Connect–Project", stems: "reflect on what stood out and why it matters ; connect it to earlier learning ; project forward to how you'll use it next time" },
  { name: "Compass Points", stems: "Excited — what excites you about today's idea? ; Worrisome — what worries or puzzles you? ; Need to know — what do you still need to find out? ; Stance/Step — your current stance or next step" },
  { name: "Color, Symbol, Image", stems: "Color — a colour for today's core idea, and why ; Symbol — a symbol for it, and why ; Image — an image for it, and why" },
  // Metacognition (EEF "thinking about thinking" — Task / Strategy / Self, plus a forward-looking step).
  { name: "Think About Your Thinking (Task · Strategy · Self)", stems: "Task — did your plan or approach work today, and how do you know? ; Strategy — which strategy helped most, and why? ; Self — what did you learn about yourself as a learner? ; Next time — what will you do differently, or which strategy will you reuse, next time?" },
];

/* --------------------------- Backend call --------------------------- */

async function generateSpringboard({ passcode, mode, media = [], sourceText = "", classInfo, routineName, reflectRoutine = "", intention = "", scope = "all", current = null, onPartial = null }) {
  const routine = ROUTINES.find(r => r.name === routineName) || ROUTINES[0];
  // Article stimulus (PDF / pasted text / fetched link) rather than a reel of images+video.
  // Only an article gets think.summary — the 5 sentences students read on the THINK slide.
  const isArticleStim = !(mode === "media" && Array.isArray(media) && media.length);
  const vceGuide = vceStudyGuide(classInfo);
  const acGuide = acStudyGuide(classInfo);
  const outcomeLine = vceGuide
    ? `A VCE study-design extract for ${classInfo.subject} is provided below. ALIGN the launch slide's curriculum connection to THAT extract (its areas of study and outcomes)${classInfo.outcome.trim() ? `, narrowed to this outcome/topic: "${classInfo.outcome.trim()}"` : ""}. Quote real phrases from the extract; never invent codes.`
    : acGuide
    ? `An Australian Curriculum (v9) extract for ${classInfo.subject}, ${classInfo.yearLevel}, is provided below. ALIGN the launch slide's curriculum connection to THAT extract (its achievement standard and content descriptions)${classInfo.outcome.trim() ? `, narrowed to this outcome/topic: "${classInfo.outcome.trim()}"` : ""}. Quote real AC9 codes and phrases from the extract; never invent codes.`
    : classInfo.outcome.trim()
      ? `ALIGN the launch slide to this exact outcome/topic, quoting its key phrases: "${classInfo.outcome.trim()}". Do not invent curriculum codes.`
      : `Write the curriculum connection in plain language for ${classInfo.curriculum} ${classInfo.subject}, year ${classInfo.yearLevel}. Never invent official curriculum codes or identifiers.`;
  const tone = { early: "very concrete, playful, spoken (ages 5-8)",
                 junior: "concrete, inquiry-led, reason-giving (ages 8-12)",
                 middle: "analytical, real-world (ages 12-15)",
                 senior: "critical, ethical, conceptual (ages 15-18)" }[bandOf(classInfo.yearLevel)];
  // The band's full audience brief (BAND_GUIDANCE) rides with the one-line tone: a Prep deck and a
  // Year 6 deck used to share one "ages 5-12" pitch, which is what the band split fixes.
  const bandBrief = BAND_GUIDANCE[BAND_KEY_OF[bandOf(classInfo.yearLevel)]] || "";
  let sys = `You create a 4-part lesson launch ("Springboard") from a teacher's stimulus.
Audience tone: ${tone}. ${bandBrief}
Slides carry MINIMAL text — every field respects its word limit.
Thinking routine to scaffold the THINK part: "${routine.name}" — ${routine.gist} (${routine.url}).
${outcomeLine}
Each notes field is a teacher script with EXACTLY these labelled sections, IN THIS ORDER, each 1-3 sentences:
FACILITATION: … ENABLING PROMPT: … EXTENDING PROMPT: … CURRICULUM LINKS: …
ENABLING PROMPT = how to simplify the task so a student who is stuck can still take part (a sentence stem, a smaller step, a concrete support).
EXTENDING PROMPT = how to push a student who finds it easy further into the same thinking (not extra work — deeper work).
Return STRICT JSON with keys: title, intention, keywords, ignite{question}, think{routine, steps, structure, summary, reveal{fact, question}}, launch{connection, bridge, question, ideas}, reflect{revisit, prompts, metacognition}, next[3]{title, idea, thinking}, notes{ignite, think, launch, reflect}.`;

  // Single-slide regenerate: rebuild only the scoped slide + its notes, copying the rest verbatim.
  if (scope !== "all") {
    // Ask for the scoped part ONLY. The old wording made the model re-emit the whole deck verbatim
    // just so we could throw all but one slide away — roughly double the output tokens on every
    // "New options" click, against a budget the model's reasoning already eats most of.
    sys += `\nThis is a TARGETED rewrite of ONE part of an existing lesson. Here is the lesson as it stands: ${JSON.stringify(current)}`;
    // "next" is the array of teacher-only follow-up lessons, not a slide with notes of its own.
    sys += scope === "next"
      ? `\nReturn JSON with ONLY the key "next": 3 genuinely different follow-up lesson ideas (not rewords of the ones above). Keep them consistent with the lesson above.`
      : `\nReturn JSON with ONLY these two keys: "${scope}" (a genuinely different version of that part, not a reword) and "notes" containing just its "${scope}" entry. Do NOT return the other parts — they are staying exactly as they are. Keep your new version consistent with the rest of the lesson above.`;
  }

  // Staging instructions for THIS routine (see ROUTINE_PLAY). Empty for routines not yet covered,
  // which then fall back to the general rules below.
  const playbook = routinePlaybook(routine.name);
  // The playbook is the most specific text in the prompt, and the observe/reveal families talk in
  // their own words about "describing before interpreting". At Prep–Year 2 that vocabulary kept
  // reappearing on the slides however the earlier rules were worded, so restate the ban right after
  // it — the model follows the most specific, most recent instruction.
  if (playbook) sys += "\n" + playbook;

  // Teacher pinned a specific end-of-lesson reflection routine from the REFLECT dropdown:
  // override the "vary the choice" instruction below and lock reflect.prompts to it.
  const pinnedReflect = REFLECT_ROUTINES.find(r => r.name === reflectRoutine);
  if (pinnedReflect) {
    sys += `\nFor the REFLECT part, the teacher has CHOSEN the "${pinnedReflect.name}" reflection routine — use exactly that one (ignore any instruction to vary or pick a different reflection routine). Its real prompt stems are: ${pinnedReflect.stems}. Set reflect.prompts to THOSE stems, lightly tailored to this lesson (<=4 short stems), keeping the routine's real moves and their order.`;
  }

  // Reading age, enforced per field rather than as one blanket paragraph. Two things were measured
  // on 2026-08-03: (1) a band brief at the TOP of the prompt loses to the far more specific field
  // rules below it, so Foundation lessons came back with "What testable question about the bee's
  // next movement could our class chase by watching the video?"; (2) a blanket ceiling added at the
  // BOTTOM wins, but wins too hard — the model honoured it by collapsing the article summary from
  // its required 5 sentences to 1. So the ceiling is attached only to the fields it belongs on, and
  // never goes near a field with a required count.
  // The banned words are not arbitrary: several of them (commit, evidence, perspective) are words
  // the general field rules below actively suggest, which is exactly why the early band has to
  // countermand them by name, in the same sentence, after they have been suggested.
  const sentCap = { early: 12, junior: 16 }[bandOf(classInfo.yearLevel)] || 0;
  const capClause = sentCap ? ` READING-AGE CEILING for this class, which beats the word limit just given for THIS field: at most ${sentCap} words per sentence, one instruction per sentence — split anything longer into two.` : "";
  const earlyWords = bandOf(classInfo.yearLevel) === "early" ? " " + EARLY_WORDS_RULE : "";
  const ageCap = capClause + earlyWords;

  // Field word-limits, kept beside the schema keys so the model honours them.
  const limits = [
    `title: <=8 words.`,
    // The teacher either brings the intention or asks the app for one. When they bring it, the whole
    // deck has to serve THAT intention (and it must come back word-for-word so the slide shows what
    // they wrote); when they don't, write one and let every part line up behind it.
    intention.trim()
      ? `intention: return the teacher's learning intention EXACTLY as written, unchanged: "${intention.trim()}". Every other field must serve this intention — the ignite question, the routine steps, the launch question and the reflection all work toward it.`
      : `intention: the lesson's learning intention, student-facing, <=18 words, starting "We are learning to". It MUST read as one grammatical sentence after those four words, and name BOTH the thinking move and the content (e.g. "We are learning to describe what we can actually see before we explain what it means"). NEVER restate, quote or lightly reword a curriculum content description, achievement standard, outcome statement or code — the curriculum extract says what the lesson COVERS, the intention says what STUDENTS WILL BE ABLE TO DO, in words a student would use. Measured failure (Year 4, 2026-07-31): "We are learning the effects of contact with other people on First Nations Australians and their Countries/Places following the arrival of the First Fleet and how this was viewed by First Nations Australians as an invasion" — the ACARA descriptor pasted whole, 40 words, and not even grammatical after "We are learning". It must match what the rest of this deck actually asks students to do.${ageCap}${earlyWords ? ' For this age, write it the way a teacher says it to the class: "We are learning to look hard and say what we can see before we say what it means."' : ""}`,
    `keywords: 3-6 short search terms a teacher might type to find this lesson later.`,
    // Stickiness has to land on the slides STUDENTS see, not only in the teacher notes. Measured on a
    // real Year 4 deck (2026-07-30): the notes said "collect three guesses before confirming" and
    // "the painting is dated 1937", while the slides carried a soft "imagine a child…" question. The
    // lesson was sticky to run and looked generic. Hence: commit out loud, and one true concrete
    // anchor on the slide.
    // 20, not 18: this field has to carry a commitment, a concrete detail from the stimulus AND the
    // sharing move. Measured across 29 live lessons (2026-08-03), 4 of them overshot 18 words and
    // every one of those was a good question doing all three jobs, e.g. "Should feeding the family
    // pet earn money? Choose yes or no, then defend one article clue to the class." (19). The slide
    // renders it with fit:"shrink" at 26-40pt, so 20 words still reads from the back of a room.
    `ignite.question: ONE provocative question, <=20 words. It MUST be answerable from what students can actually SEE OR READ at that moment — if the routine reveals the stimulus in stages, the question must work from the first fragment alone. It MUST ask for a commitment students could turn out to be wrong about (a guess, a stance, a prediction), not a safe invitation to imagine. Where the stimulus gives you one, anchor it with a true concrete detail from the stimulus itself (a number, a date, a name, a visible object). NEVER ask students to imagine what someone outside the frame thinks or feels before they have seen the whole stimulus — that is an end-of-lesson reflection question, not an opening one. It MUST also say what students DO with their answer, including the sharing move: name the choice and then how it goes public ("choose one visible clue and be ready to defend it to the class"). Measured failure (Year 4, 2026-07-31): "Does this raised British flag mark a beginning or a takeover? Choose one visible clue." — students pick a clue and are never told to share it, leaving the teacher to invent the lesson's most important move.${ageCap}`,
    `think.routine MUST be exactly "${routine.name}". This routine's real moves are: ${(routine.steps || []).map((s, i) => `${i + 1}) ${s}`).join(" ")}. think.steps: take THOSE actual moves and write each one FOR THIS STIMULUS — keep the routine's real moves and their order, do NOT invent different ones; <=4 short student-facing prompts. Each step must name the actual thing students are looking at, reading or doing at that moment (for a staged-reveal routine, name what that reveal shows: "the raised flag and the arms", "the trees on the left"), so a step could not be pasted onto a different lesson. Generic wording like "see one tiny section" or "look closely at the image" is a failure. Each step must also STAND ALONE as a complete instruction or question a student could act on without the teacher explaining it — a bare fragment tacked on the end ("What changes?") is a failure: name what changes and about what ("What does that change about who you thought this was made for?"). NEVER print the surprise inside a step — that is what think.reveal is for, and a step that reads "Reveal: the painter added this in 1937…" spoils the very reveal it sets up. The final step instead makes students ${earlyWords ? "CHOOSE OUT LOUD" : "COMMIT"} before the reveal (their best guess, their stance, the call they are willing to defend), so there is something to overturn. Write that commitment in plain classroom language — ${earlyWords ? 'choose, guess, point to it, say which one (for this age NEVER "commit", NEVER "the evidence")' : "decide, choose, predict, commit to, make a call"}. NEVER use gambling words ("bet", "wager", "odds", "what would you put money on"); measured failure (Year 4, 2026-07-31): "Using your 20 observations, bet: was this painted during the event or long afterwards?". Any duration named inside a step MUST match think.structure, which is printed directly above the steps on the same slide — measured failure (2026-07-31): a step said "look quietly for 30 seconds" under a structure line reading "Round 1—2 minutes", so the slide contradicted itself. If the structure names rounds, the steps use those rounds' times; if you are unsure, name no time in the step at all. think.structure: "${routine.structure || "Think-pair-share, 3 min"}".${ageCap}`,
    // The withheld surprise. It is hidden on the slide behind a "Click to reveal" button the teacher
    // presses once students have committed, so it can be specific without spoiling itself.
    `think.reveal: {"fact": the single most surprising TRUE thing about this stimulus, stated in one sentence students can read (<=30 words) — who made it, when, what it leaves out, who is missing, where it really came from; "question": ONE complete question (<=20 words) asking what that fact changes about the thinking they just committed to; "label": <=4 words naming WHAT is behind the reveal button, so a teacher reading the slide knows what they are about to show (e.g. "the painting's origin", "when it was taken"). Do NOT give the surprise away in the label — name the topic, not the fact}. NEVER invent a fact to be surprising: if nothing genuinely surprising is knowable from the stimulus, return {"fact": "", "question": "", "label": ""} and the reveal is left off the slide entirely. The question must stand alone — "What changes?" is a failure; name what changes and about what.${ageCap}`,
    `think.summary: ${isArticleStim
      ? `EXACTLY 5 sentences summarising the article FOR STUDENTS, printed beside the routine so they can read it while they think. Tone: ${tone}. Make the situation CONCRETE — establish clearly WHAT happened and the specifics a ${classInfo.yearLevel} student needs to follow it. Lead with the most surprising or relatable angle, use plain vivid language, and end on a note that invites discussion. NEVER invent quotes, names, numbers, or events that are not in the supplied text; if the article is vague on something important, leave it out rather than guessing. Punchy, never a dry recap.`
      : `"" — an empty string. The stimulus is an image/video reel, not an article, so there is nothing to summarise.`}${ageCap ? ageCap + " This shortens each sentence; it does NOT change the required number of them." : ""}`,
    `launch.connection: <=25 words curriculum connection; launch.bridge: <=20 words from the stimulus to today's lesson; launch.question: the lesson launch question${earlyWords ? ", which for this age must be one a 5-8 year old could answer out loud in a sentence, about the actual thing in front of them — never a definition question about when something counts as proof" : ""}; launch.ideas: EXACTLY 3 short, distinct ways to run the launch so students work toward launch.question (e.g. a quick debate, a rank/sort, a role-play, a prediction, a quick-write) — one sentence each, <=20 words.${ageCap}`,
    `reflect.revisit: ONE complete question a teacher reads aloud, <=20 words, sending students back to the ignite question now they know more. It must stand alone as a sentence — colon-compressed shorthand like "Reconsider: beginning or takeover? Use what the painting leaves out." (measured failure, Year 4, 2026-07-31) is a failure, because it reads as a note to self rather than something you can say to a class. For reflect.prompts, CHOOSE the end-of-lesson reflection routine that best fits THIS lesson, and VARY the choice across lessons (do NOT always use the same one). Pick from: (a) I Used to Think… / Now I Think…; (b) Connect–Extend–Challenge — one new connection, one way it extends thinking, one lingering challenge or question; (c) 3-2-1 Bridge — 3 thoughts, 2 questions, 1 analogy; (d) Headlines — a one-line headline capturing today's core idea; (e) Reflect–Connect–Project — reflect on it, connect to prior learning, project forward; (f) Think About Your Thinking (metacognition) — Task: did your plan/approach work and how do you know; Strategy: which strategy helped and what will you do differently next time; Self: what did you learn about yourself as a learner. Use THAT routine's real prompt stems as reflect.prompts (<=4 short stems). Tie every stem to THIS lesson's content (never generic), and ALWAYS make at least one stem a forward-looking metacognitive prompt — ${earlyWords ? 'for this age write it as what they will LOOK FOR or DO FIRST next time ("Next time I will look at … first"), never as a strategy, an observation or interpreting' : "what the student will do differently, or which strategy they'll reuse, next time"}. EVERY stem must be answerable from what THIS deck actually asked students to do. If a stem refers back to something students made earlier — a headline, a first guess, a ranking, a prediction — that thing must genuinely have been produced in ignite or think; otherwise pick a reflection routine that does not depend on one. Measured failure (Year 4, 2026-07-31): prompt 1 asked students to write a headline and prompt 2 then asked "The lesson moment that changed my headline was…", when they had never written one at the start, so there was nothing to have changed.${ageCap}`,
    // "Where to next" — three teacher-only slides at the end of the deck. These are the NEXT
    // LESSONS, not more ways to run today's: the teacher has just finished this lesson and wants to
    // know where the thinking goes from here.
    // Measured failure (2026-07-30): "Draft and peer-check a 60-word label naming 1788, the 1937
    // painting, invasion, one effect and the missing perspective." Every requirement was crammed into
    // one 28-word sentence, and the teacher who has to run it could not tell what the lesson was.
    // Hence: plain English, ONE task, and room to say it properly.
    `next: EXACTLY 3 follow-up LESSON ideas for the lessons AFTER this one, in a sensible teaching order (each builds on the last). Each: title <=7 words; idea = 1-2 plain-English sentences (<=40 words total) a teacher could read aloud and immediately picture running — say what students make or do, and what they end up with; thinking = the Understanding Map thinking move it grows into and why that is the natural next step, <=18 words. WRITE IT FOR A BUSY TEACHER, NOT AS A SPEC: no comma-stuffed checklists of everything the task must contain, no shorthand ("60-word label naming 1788, the painting, invasion, one effect and the missing perspective" is a failure — it reads as a rubric, not a lesson). One clear task per idea, named in words a teacher uses. They must follow from what THIS lesson's stimulus and routine established — never generic "research the topic" filler, and never a repeat of today's task.`,
    `reflect.metacognition: <=30 words, TEACHER-facing (it rides in the notes, never on a slide). Name the ONE thinking strategy students actually used in THIS lesson and the question that gets them to notice they used it. Be specific to this lesson's task — never a generic "reflect on your learning".`,
  ].join("\n");
  const instruction = `Create the Springboard now. Respect every word limit:\n${limits}\nReturn STRICT JSON only — no markdown, no code fences, plain text in every field.`;

  const userContent = [];
  const mediaItems = Array.isArray(media) ? media : [];

  if (mode === "media" && mediaItems.length) {
    const imgs = mediaItems.filter(m => m.kind === "image").length;
    const vids = mediaItems.filter(m => m.kind === "video").length;
    let mt = `The stimulus is a reel of ${mediaItems.length} item(s) shown in order` +
      `${imgs ? ` — ${imgs} image(s)` : ""}${vids ? `${imgs ? " and" : " —"} ${vids} video(s) (still frames attached per clip)` : ""}. ` +
      `Treat them as ONE stimulus in sequence; item 1 is the primary stimulus. Build the whole Springboard from what you genuinely see/read across them.`;
    const clipText = mediaItems
      .map((m, i) => ((m.kind === "video" || m.kind === "youtube") && m.text && m.text.trim()) ? `${m.kind === "youtube" ? "YouTube clip" : "Video"} at position ${i + 1} — ${m.text.trim().slice(0, 4000)}` : "")
      .filter(Boolean);
    if (clipText.length) mt += `\nClip notes:\n${clipText.join("\n")}`;
    userContent.push({ type: "text", text: instruction + "\n\n" + mt });
    mediaItems.forEach(m => {
      // smallUrl, not dataUrl: the model gets the shrunk copy, the deck keeps the full-resolution
      // original so Zoom In crops stay sharp. Older saved media has no smallUrl, hence the fallback.
      if (m.kind === "image") userContent.push({ type: "image_url", image_url: { url: m.smallUrl || m.dataUrl } });
      else if (m.kind === "youtube") { const y = m.thumb || m.poster; if (y) userContent.push({ type: "image_url", image_url: { url: y } }); }
      else (m.frames || []).forEach(fr => userContent.push({ type: "image_url", image_url: { url: fr } }));
    });
  } else {
    const trimmed = (sourceText || "").slice(0, 12000).replace(/"{3,}/g, "“”");
    userContent.push({ type: "text", text: instruction + `\n\nThe stimulus is the following article text. Build the Springboard from its real content:\n\n"""\n${trimmed}\n"""` });
  }

  const baseGuide = vceGuide || acGuide;
  const focus = Array.isArray(classInfo.focus) ? classInfo.focus : [];
  const studyGuide = baseGuide ? (focus.length ? { ...baseGuide, focus } : baseGuide) : null;
  // Hard client-side stop: a stalled request used to leave the build bar spinning with no
  // message at all. 3 minutes is well past a normal generate (~20-60s).
  const ctrl = new AbortController();
  const bail = setTimeout(() => ctrl.abort(), 180000);
  let resp;
  try {
    resp = await fetch(API_BASE + "/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-sb-passcode": passcode },
      signal: ctrl.signal,
      body: JSON.stringify({
        messages: [
          { role: "system", content: sys },
          { role: "user", content: userContent },
        ],
        response_format: { type: "json_object" },
        // 8000 = the server's ceiling, and the reasoning budget is why. Measured on the live model,
        // a plain article generate burns 1,766-2,254 REASONING tokens before it writes a character;
        // 6000 was set to clear that at reasoning_effort "low". GEN_REASONING went back to "medium"
        // on 2026-08-04 (0809bad), which buys quality by thinking longer — and thinking is drawn
        // from this same budget, so the headroom for the JSON shrank and a rich stimulus started
        // running out mid-lesson again (reported 2026-08-07). Unused headroom is free: OpenAI bills
        // the tokens emitted, not the ceiling. Raise reasoning_effort again and this must be re-measured.
        max_completion_tokens: 8000,
        stickiness: true,
        reasoning_effort: GEN_REASONING,
        // Stream when the caller wants to watch it arrive. Measured 2026-08-03: a real Year 4
        // lesson takes ~69s end to end, so without this the teacher stares at an estimated bar
        // for over a minute. Streaming does not make it finish sooner, it makes IGNITE readable
        // seconds in while the rest is still being written.
        ...(onPartial ? { stream: true } : {}),
        ...(studyGuide ? { studyGuide } : {}),
      }),
    });
  } catch (netErr) {
    if (netErr && netErr.name === "AbortError") throw new Error("The lesson took too long to build (over 3 minutes) and was stopped. Try again, or use a smaller stimulus (fewer images, or a shorter clip).");
    throw new Error("Couldn't reach the Springboard server. Check your internet connection and try again.");
  } finally {
    clearTimeout(bail);
  }

  if (!resp.ok) throw new Error(await backendErrorMessage(resp));

  let raw = "";
  // OpenAI's own word for why it stopped. "length" means it hit the token ceiling mid-sentence,
  // which is the difference between "the model wrote nonsense" and "the lesson didn't fit".
  let finishReason = "";
  if (onPartial && /event-stream/.test(resp.headers.get("content-type") || "")) {
    // Reassemble the model's text from the SSE frames, handing the caller the deck-so-far as it
    // grows. Throttled: re-shaping on every token would re-render the page hundreds of times.
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "", lastPaint = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // Frames arrive split across chunks, so only consume up to the last complete one.
      const cut = buf.lastIndexOf("\n");
      if (cut === -1) continue;
      const lines = buf.slice(0, cut).split("\n");
      buf = buf.slice(cut + 1);
      for (const line of lines) {
        if (!line.startsWith("data: ") || line.includes("[DONE]")) continue;
        try {
          const frame = JSON.parse(line.slice(6));
          raw += frame.choices?.[0]?.delta?.content || "";
          if (frame.choices?.[0]?.finish_reason) finishReason = frame.choices[0].finish_reason;
        } catch (_) {}
      }
      const now = Date.now();
      if (now - lastPaint > 180) {
        lastPaint = now;
        const partial = parsePartialJson(raw);
        if (partial) { try { onPartial(partial); } catch (_) {} }
      }
    }
  } else {
    const data = await resp.json();
    raw = data?.choices?.[0]?.message?.content || "";
    finishReason = data?.choices?.[0]?.finish_reason || "";
  }
  if (!raw.trim()) throw new Error("The model returned an empty response.");
  let parsed;
  try {
    parsed = parseJsonLoose(raw);
  } catch (perr) {
    // Running out of room is a different problem from bad output and needs a different sentence:
    // nothing is wrong with the stimulus, the lesson simply didn't fit, and building again usually
    // works. The old message quoted a JSON position, which told a teacher nothing they could act on.
    const e = new Error(perr.truncated || finishReason === "length"
      ? "The lesson was still being written when it ran out of room, so it arrived unfinished. Press Build again — it normally fits second time. A shorter article, or fewer pictures, makes it more certain."
      : "Could not parse the model's JSON: " + perr.message);
    e._raw = raw;
    throw e;
  }
  // Prep-Year 2 only: a second, narrow pass over the words students actually read.
  parsed = await simplifyForEarlyYears({ passcode, deck: parsed, classInfo, onPartial });
  return { parsed, raw };
}

/* ------------------- Read it back as a five-year-old (Prep-Year 2 only) -------------------
   Writing the whole lesson and keeping its language at a five-year-old's level are two different
   jobs, and asking for both in one prompt loses the second. Measured over seven prompt variants
   (2026-08-03) Foundation decks kept "observation", "interpretation", "evidence", "commit" and
   "justify" on slides for children who cannot read them, because the thinking routine at that age
   IS "tell what you see apart from what you think it means" — so the model treats those words as
   the lesson's content, not as jargon. Repeating the ban made it worse (naming a word primes it).

   So this is a separate call with exactly one job, and it sees ONLY the lines students read.
   Deliberately out of scope: notes{} and reflect.metacognition (a teacher's script, which SHOULD
   say "strategy"), launch.connection (real curriculum wording and codes — simplifying it would
   fabricate them) and next[] (teacher-facing follow-up lessons).

   Every field is merged back under a shape guard: same array lengths, same sentence count on the
   article summary, no empty strings. Anything that fails the guard keeps the original, so the
   worst case for this pass is that it changes nothing. */
const EARLY_SIMPLIFY_FIELDS = ["intention", "ignite.question", "think.steps", "think.reveal.fact",
  "think.reveal.question", "think.summary", "launch.question", "reflect.revisit", "reflect.prompts"];

async function simplifyForEarlyYears({ passcode, deck, classInfo, onPartial = null }) {
  if (!deck || bandOf(classInfo && classInfo.yearLevel) !== "early") return deck;
  const src = {
    intention: typeof deck.intention === "string" ? deck.intention : undefined,
    igniteQuestion: deck.ignite && deck.ignite.question,
    thinkSteps: deck.think && Array.isArray(deck.think.steps) ? deck.think.steps : undefined,
    revealFact: deck.think && deck.think.reveal && deck.think.reveal.fact,
    revealQuestion: deck.think && deck.think.reveal && deck.think.reveal.question,
    summary: deck.think && deck.think.summary,
    launchQuestion: deck.launch && deck.launch.question,
    reflectRevisit: deck.reflect && deck.reflect.revisit,
    reflectPrompts: deck.reflect && Array.isArray(deck.reflect.prompts) ? deck.reflect.prompts : undefined,
  };
  // Nothing worth sending (e.g. a scoped regenerate of a teacher-only part).
  const payload = Object.fromEntries(Object.entries(src).filter(([, v]) => v !== undefined && v !== null && (Array.isArray(v) ? v.length : String(v).trim())));
  if (!Object.keys(payload).length) return deck;

  const summarySentences = String(src.summary || "").split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 1).length;
  const sys = `You rewrite lesson text so a ${classInfo.yearLevel === "F" ? "Prep" : "Year " + classInfo.yearLevel} class (age 5-8) can follow it when their teacher reads it aloud. You are NOT writing a new lesson — keep every idea, every instruction and every order exactly as it is, and change only the words.
${EARLY_WORDS_RULE}
Also: at most 12 words per sentence, one instruction per sentence — split a long sentence into two short ones rather than dropping anything. Keep questions as questions. Keep any name, number, colour or object that is named. Never add a new fact.
Return STRICT JSON with EXACTLY the same keys and the same shape you were given. Arrays must come back with the SAME NUMBER of items, in the same order.${summarySentences ? ` "summary" must come back as EXACTLY ${summarySentences} sentences.` : ""}`;

  let out;
  try {
    const resp = await fetch(API_BASE + "/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-sb-passcode": passcode },
      body: JSON.stringify({
        messages: [
          { role: "system", content: sys },
          { role: "user", content: "Rewrite these for the class, per the system instructions:\n\n" + JSON.stringify(payload, null, 1) },
        ],
        response_format: { type: "json_object" },
        // Narrow rewrite, no research: measured ~900 completion tokens, so 2500 is headroom.
        max_completion_tokens: 2500,
        reasoning_effort: "low",
      }),
    });
    if (!resp.ok) return deck;
    const data = await resp.json();
    out = parseJsonLoose(data?.choices?.[0]?.message?.content || "");
  } catch (_) {
    return deck; // a failed rewrite must never cost the teacher their lesson
  }
  if (!out || typeof out !== "object") return deck;

  const str = (v) => (typeof v === "string" && v.trim() ? stripMd(v).trim() : null);
  const sameLenArray = (v, original) => Array.isArray(v) && v.length === original.length && v.every(x => str(x)) ? v.map(x => str(x)) : null;

  const next = { ...deck, think: { ...deck.think }, ignite: { ...deck.ignite }, launch: { ...deck.launch }, reflect: { ...deck.reflect } };
  if (deck.think && deck.think.reveal) next.think.reveal = { ...deck.think.reveal };

  const put = (ok, apply) => { if (ok) apply(ok); };
  put(str(out.intention), v => { next.intention = v; });
  put(str(out.igniteQuestion), v => { next.ignite.question = v; });
  put(src.thinkSteps && sameLenArray(out.thinkSteps, src.thinkSteps), v => { next.think.steps = v; });
  put(str(out.revealFact) && str(src.revealFact) ? str(out.revealFact) : null, v => { next.think.reveal.fact = v; });
  put(str(out.revealQuestion) && str(src.revealQuestion) ? str(out.revealQuestion) : null, v => { next.think.reveal.question = v; });
  // The summary is the one field with a required count, so it only lands if the count survived.
  const newSummary = str(out.summary);
  if (newSummary && summarySentences && newSummary.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 1).length === summarySentences) next.think.summary = newSummary;
  put(str(out.launchQuestion), v => { next.launch.question = v; });
  put(str(out.reflectRevisit), v => { next.reflect.revisit = v; });
  put(src.reflectPrompts && sameLenArray(out.reflectPrompts, src.reflectPrompts), v => { next.reflect.prompts = v; });

  // The streamed preview showed the pre-rewrite words; repaint so what the teacher ends on is what
  // they keep.
  if (onPartial) { try { onPartial(next); } catch (_) {} }
  return next;
}

/* ----------------------- Analyse stimulus (the new step before Generate) -----------------------
   Reads the stimulus and recommends 3 thinking routines (band-filtered from ROUTINES), so the
   teacher picks a routine before Generate runs. Media-parts packaging mirrors generateSpringboard
   above. */
async function analyseStimulus({ passcode, mode, media = [], sourceText = "", classInfo, move = null }) {
  const band = bandOf(classInfo.yearLevel); // "early" | "junior" | "middle" | "senior"
  // Candidate routines are scoped to the chosen Thinking Move (band-filtered, topped
  // up by moveRoutineList); fall back to the full band list only if no move was passed.
  const bandRoutines = move ? moveRoutineList(move, band) : ROUTINES.filter(r => r.bands.includes(band));
  const routineMenu = bandRoutines.map(r => `- ${r.name}: ${r.gist}`).join("\n");
  const moveLine = move ? `The teacher has chosen the Thinking Move "${move.name}" (${move.question}). Rank the routines from the menu that best serve THAT move for this stimulus and age group.\n` : "";
  const sys = `You help a ${classInfo.curriculum} teacher of ${classInfo.subject}, year ${classInfo.yearLevel}, launch student thinking from a stimulus.
${moveLine}Return STRICT JSON only: {"summary": string (<=40 words, what the stimulus shows),
"routines": [{"name": string, "why": string (<=20 words, why it fits THIS stimulus and age group)} x3]}
Routine names MUST be copied exactly from this menu:\n${routineMenu}`;

  const userContent = [];
  const mediaItems = Array.isArray(media) ? media : [];
  if (mode === "media" && mediaItems.length) {
    userContent.push({ type: "text", text: "Analyse this stimulus and recommend routines per the system instructions." });
    mediaItems.forEach(m => {
      // smallUrl, not dataUrl: the model gets the shrunk copy, the deck keeps the full-resolution
      // original so Zoom In crops stay sharp. Older saved media has no smallUrl, hence the fallback.
      if (m.kind === "image") userContent.push({ type: "image_url", image_url: { url: m.smallUrl || m.dataUrl } });
      else if (m.kind === "youtube") { const y = m.thumb || m.poster; if (y) userContent.push({ type: "image_url", image_url: { url: y } }); }
      else (m.frames || []).forEach(fr => userContent.push({ type: "image_url", image_url: { url: fr } }));
    });
  } else {
    const trimmed = (sourceText || "").slice(0, 12000).replace(/"{3,}/g, "“”");
    userContent.push({ type: "text", text: `Analyse this article text and recommend routines per the system instructions:\n\n"""\n${trimmed}\n"""` });
  }

  const resp = await fetch(API_BASE + "/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-sb-passcode": passcode },
    body: JSON.stringify({
      messages: [
        { role: "system", content: sys },
        { role: "user", content: userContent },
      ],
      response_format: { type: "json_object" },
      max_completion_tokens: 1400, // reasoning tokens are billed against this cap too — see generate
    }),
  });
  if (!resp.ok) throw new Error(await backendErrorMessage(resp));

  const data = await resp.json();
  const raw = data?.choices?.[0]?.message?.content || "";
  if (!raw.trim()) throw new Error("The model returned an empty response.");
  const parsed = parseJsonLoose(raw);

  // Canonicalise routine names against ROUTINES (case-insensitive), dropping anything the
  // model invents; top up to 3 from the band-filtered list so the UI never shows fewer than
  // 3 real, linkable routines even on a flaky/partial reply.
  const byLower = new Map(bandRoutines.map(r => [r.name.toLowerCase(), r.name]));
  const seen = new Set();
  const routines = [];
  (Array.isArray(parsed.routines) ? parsed.routines : []).forEach(r => {
    const nameRaw = stripMd(r && r.name);
    const canon = byLower.get(String(nameRaw).toLowerCase().trim());
    if (canon && !seen.has(canon)) {
      seen.add(canon);
      routines.push({ name: canon, why: stripMd((r && r.why) || "") });
    }
  });
  for (const r of bandRoutines) {
    if (routines.length >= 3) break;
    if (!seen.has(r.name)) { seen.add(r.name); routines.push({ name: r.name, why: r.gist }); }
  }

  return { summary: stripMd(parsed.summary || ""), routines: routines.slice(0, 3) };
}

/* ----------------------- Suggest outcomes (AI option on the Outcome field) -----------------------
   Suggests 1-4 curriculum connections for the class, grounded in the stimulus when one exists.
   Media packaging mirrors analyseStimulus. VCE Y11/12 and AC F-10 pass studyGuide so the server
   injects the real curriculum extract — suggestions quote real phrases/codes, never invented. */
async function suggestOutcomes({ passcode, mode, media = [], sourceText = "", classInfo }) {
  const guide = vceStudyGuide(classInfo) || acStudyGuide(classInfo);
  const sys = `You help a ${classInfo.curriculum} teacher of ${classInfo.subject}, year ${classInfo.yearLevel}, connect a lesson stimulus to their curriculum.
Return STRICT JSON only: {"suggestions": [{"outcome": string (<=30 words, one curriculum connection/outcome this lesson could target), "why": string (<=18 words, why it fits this stimulus and class)} x4]}
${guide ? "A curriculum extract is appended below. Ground every suggestion in THAT extract (its outcomes, achievement standards or content descriptions), quoting its real phrases and codes; never invent codes." : "Use plain language. Never invent official curriculum codes or identifiers."}`;

  const userContent = [];
  const mediaItems = Array.isArray(media) ? media : [];
  if (mode === "media" && mediaItems.length) {
    userContent.push({ type: "text", text: "Suggest curriculum connections for this stimulus per the system instructions." });
    mediaItems.forEach(m => {
      // smallUrl, not dataUrl: the model gets the shrunk copy, the deck keeps the full-resolution
      // original so Zoom In crops stay sharp. Older saved media has no smallUrl, hence the fallback.
      if (m.kind === "image") userContent.push({ type: "image_url", image_url: { url: m.smallUrl || m.dataUrl } });
      else if (m.kind === "youtube") { const y = m.thumb || m.poster; if (y) userContent.push({ type: "image_url", image_url: { url: y } }); }
      else (m.frames || []).forEach(fr => userContent.push({ type: "image_url", image_url: { url: fr } }));
    });
  } else if ((sourceText || "").trim()) {
    const trimmed = sourceText.slice(0, 12000).replace(/"{3,}/g, "“”");
    userContent.push({ type: "text", text: `Suggest curriculum connections for this article per the system instructions:\n\n"""\n${trimmed}\n"""` });
  } else {
    userContent.push({ type: "text", text: "No stimulus added yet. Suggest curriculum connections a teacher of this class could build a lesson around, per the system instructions." });
  }

  const resp = await fetch(API_BASE + "/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-sb-passcode": passcode },
    body: JSON.stringify({
      messages: [
        { role: "system", content: sys },
        { role: "user", content: userContent },
      ],
      response_format: { type: "json_object" },
      max_completion_tokens: 1600, // reasoning tokens are billed against this cap too — see generate
      ...(guide ? { studyGuide: guide } : {}),
    }),
  });
  if (!resp.ok) throw new Error(await backendErrorMessage(resp));

  const data = await resp.json();
  const raw = data?.choices?.[0]?.message?.content || "";
  if (!raw.trim()) throw new Error("The model returned an empty response.");
  const parsed = parseJsonLoose(raw);
  const out = (Array.isArray(parsed.suggestions) ? parsed.suggestions : [])
    .map(s => ({ outcome: stripMd(s && s.outcome), why: stripMd((s && s.why) || "") }))
    .filter(s => s.outcome);
  if (!out.length) throw new Error("No suggestions came back — try again.");
  return out.slice(0, 4);
}

/* ----------------------- Suggest a learning intention ("Let AI decide") -----------------------
   Writes ONE student-facing intention on the spot so the teacher can read it, try another, or edit
   it BEFORE the deck is built (the box then rides into generateSpringboard as the teacher's own
   wording, word-for-word). Grounded in the stimulus when one exists, the chosen thinking
   move/routine when picked, and the real curriculum extract via studyGuide. `avoid` carries the
   wording already on screen so "Try another" comes back genuinely different, not a reword. */
async function suggestIntention({ passcode, mode, media = [], sourceText = "", classInfo, move = null, routineName = "", avoid = "" }) {
  const guide = vceStudyGuide(classInfo) || acStudyGuide(classInfo);
  const focus = Array.isArray(classInfo.focus) ? classInfo.focus : [];
  const studyGuide = guide ? (focus.length ? { ...guide, focus } : guide) : null;
  const tone = { early: "very concrete, playful, spoken (ages 5-8)",
                 junior: "concrete, inquiry-led, reason-giving (ages 8-12)",
                 middle: "analytical, real-world (ages 12-15)",
                 senior: "critical, ethical, conceptual (ages 15-18)" }[bandOf(classInfo.yearLevel)];
  const routine = ROUTINES.find(r => r.name === routineName) || null;
  const moveLine = move ? `The thinking students will do is the "${move.name}" move (${move.question}).\n` : "";
  const routineLine = routine ? `They will do it through the "${routine.name}" routine — ${routine.gist}\n` : "";
  const outcomeLine = classInfo.outcome && classInfo.outcome.trim()
    ? `The teacher's learning focus for the lesson: "${classInfo.outcome.trim()}".\n` : "";

  let sys = `You write ONE learning intention for a ${classInfo.curriculum} lesson: ${classInfo.subject}, year ${classInfo.yearLevel}.
Audience tone: ${tone}.
${moveLine}${routineLine}${outcomeLine}${guide ? "A curriculum extract is appended below. Keep the intention true to THAT extract, but write it in plain student words — never quote codes or curriculum jargon on a student slide.\n" : ""}Return STRICT JSON only: {"intention": string}
The intention must: be student-facing and start "We are learning to"; be <=18 words; name BOTH the thinking move AND the actual content of this stimulus (e.g. "We are learning to describe what we can actually see before we explain what it means"); stay concrete and specific to this stimulus. A generic line like "We are learning to explore the topic" is a failure. Plain text, no markdown, no quote marks around it.`;
  if (avoid) sys += `\nThe teacher has already seen this wording: "${avoid}". Write a genuinely different intention — a different angle on the thinking or the content — not a reword of it.`;

  const userContent = [];
  const mediaItems = Array.isArray(media) ? media : [];
  if (mode === "media" && mediaItems.length) {
    userContent.push({ type: "text", text: "Write the learning intention for this stimulus per the system instructions." });
    mediaItems.forEach(m => {
      // smallUrl, not dataUrl: the model gets the shrunk copy, the deck keeps the full-resolution
      // original so Zoom In crops stay sharp. Older saved media has no smallUrl, hence the fallback.
      if (m.kind === "image") userContent.push({ type: "image_url", image_url: { url: m.smallUrl || m.dataUrl } });
      else if (m.kind === "youtube") { const y = m.thumb || m.poster; if (y) userContent.push({ type: "image_url", image_url: { url: y } }); }
      else (m.frames || []).forEach(fr => userContent.push({ type: "image_url", image_url: { url: fr } }));
    });
  } else if ((sourceText || "").trim()) {
    const trimmed = sourceText.slice(0, 12000).replace(/"{3,}/g, "“”");
    userContent.push({ type: "text", text: `Write the learning intention for this article per the system instructions:\n\n"""\n${trimmed}\n"""` });
  } else {
    userContent.push({ type: "text", text: "No stimulus added yet. Write the learning intention from the class, subject and learning focus above, per the system instructions." });
  }

  const resp = await fetch(API_BASE + "/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-sb-passcode": passcode },
    body: JSON.stringify({
      messages: [
        { role: "system", content: sys },
        { role: "user", content: userContent },
      ],
      response_format: { type: "json_object" },
      max_completion_tokens: 1600, // reasoning tokens are billed against this cap too — see generate
      ...(studyGuide ? { studyGuide } : {}),
    }),
  });
  if (!resp.ok) throw new Error(await backendErrorMessage(resp));

  const data = await resp.json();
  const raw = data?.choices?.[0]?.message?.content || "";
  if (!raw.trim()) throw new Error("The model returned an empty response.");
  const parsed = parseJsonLoose(raw);
  const out = stripMd((parsed && parsed.intention) || "").replace(/^["“']|["”']$/g, "").trim();
  if (!out) throw new Error("No intention came back — try again.");
  return out;
}

/* Merge a scoped regenerate's parsed reply back into the deck: only the scoped slide
   (ignite | think | launch | reflect) and its teacher notes are replaced, so edits to the
   other three slides survive. think.routine stays the teacher's pick. Full-scope callers
   use shapeDeck directly; a scope of "all" (or an unknown scope) falls back to a full shape. */
function mergeScopedFields(deck, scope, parsed) {
  const shaped = shapeDeck(parsed, { routineName: deck.think.routine });
  const SLICES = ["ignite", "think", "launch", "reflect"];
  // "next" is a top-level array (the three teacher-only Where-to-next slides), not a slide object
  // with its own notes, so it merges on its own rather than through the [scope] path below.
  if (scope === "next") return { ...deck, next: shaped.next };
  // "all"/unexpected → full shape. shapeDeck builds a fresh object, so re-attach the teacher's
  // ticked curriculum focus (it lives on the deck, not in the model's reply) or the LAUNCH notes
  // would silently lose it.
  if (!SLICES.includes(scope)) return { ...shaped, curriculumFocus: deck.curriculumFocus };
  return {
    ...deck,
    [scope]: shaped[scope],
    notes: { ...deck.notes, [scope]: shaped.notes[scope] },
  };
}

/* ------------------------------ Icons ------------------------------ */

  sun: "M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6L4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z",
