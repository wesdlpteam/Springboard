                    <button type="button" className="bx-x" title="Remove" aria-label={"Remove next lesson " + (i + 1)} onClick={() => delNext(i)}>×</button>
                  </div>
                  <textarea className="bx-ta" style={{ marginTop: 6 }} rows={2} aria-label={"What students do in next lesson " + (i + 1)} value={n.idea || ""} placeholder="What students would actually do…" onChange={e => patchNext(i, "idea", e.target.value)} />
                  <textarea className="bx-ta" style={{ marginTop: 6 }} rows={1} aria-label={"Thinking move for next lesson " + (i + 1)} value={n.thinking || ""} placeholder="The thinking move it grows into…" onChange={e => patchNext(i, "thinking", e.target.value)} />
                </div>
              ))}
              {(spot.next || []).length < 3 && <button type="button" className="bx-add" onClick={addNext}>+ Add a next-lesson idea</button>}
              {!(spot.next || []).length && <p className="bx-note">Nothing here yet — rebuild the lesson and Springboard will suggest three follow-up lessons.</p>}
            </div>

            <div style={{ display: "flex", gap: 12, flexWrap: "wrap", paddingTop: 20, borderTop: "1px solid var(--line)" }}>
              <button className="bx-btn" disabled={exporting} onClick={download}>{exporting ? "Preparing…" : "Download the deck ↓"}</button>
              <button className="bx-btn ghost" disabled={loading || !!regenSlide || !selectedRoutine} onClick={generate}>Rebuild the whole lesson</button>
            </div>
          </div>
        </div>
      )}
    </section>
  );

  const renderBrain = () => (
    <div className="ww" ref={brainRootRef}>
      <div className="ww-grain" aria-hidden="true" />
      {/* ink-roughen filter: displaces the smooth font outline into irregular, dry-brush ink
          edges — the only way to get *visible* brush texture from live (non-image) text */}
      <svg width="0" height="0" style={{ position: "absolute" }} aria-hidden="true">
        <filter id="wwInkRoughen" x="-8%" y="-20%" width="116%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.028 0.045" numOctaves="2" seed="7" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </svg>
      <span className="sr-only" aria-live="polite" ref={liveRef} />
      <header className="bx-mast">
        <button type="button" className="bx-word" onClick={goHome} aria-label="Springboard — back to the start" title="Back to the start">Spring<i>board</i></button>
        <nav className="bx-nav">
          <a href="about.html" onClick={fadeToAbout}>About</a>
        </nav>
      </header>
      {/* mute-music: floating button, fixed bottom-right on every scene (cover, map, chamber) */}
      <button type="button" className={"bx-mute" + (musicMuted ? " is-muted" : "")} onClick={toggleMusic}
        aria-pressed={musicMuted} aria-label={musicMuted ? "Unmute music" : "Mute music"}
        title={musicMuted ? "Unmute music" : "Mute music"}>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path className="spk" d="M4 9.5v5h3.2L12 18.5V5.5L7.2 9.5H4z" />
          <g className="waves"><path d="M15 9.2a4 4 0 0 1 0 5.6" /><path d="M17.4 7a7.2 7.2 0 0 1 0 10" /></g>
          <path className="slash" d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
        </svg>
      </button>
      {/* soundtrack moved to the standalone #sb-music <audio> + script in <body> so it starts
          before React boots (instant resume from About). No React-managed <audio> here anymore. */}
      {/* soft paper top-fade so chamber text scrolling under the fixed masthead doesn't collide
          with the wordmark (see .bx-topfade). Chamber only — the cover/map keep a clear header. */}
      {bxScene === "chamber" && <div className="bx-topfade" aria-hidden="true" />}

      {(bxScene === "cover" || bxScene === "transport") && (
        <section className={"ww-cover" + (bxScene === "transport" ? " fading" : "")}>
          <div className="ww-cover-art" aria-hidden="true">
            {/* One watercolour clip: the brain draws itself in ink, then blue/teal washes bloom
                and bleed outside the outline, and it holds on its finished frame (no loop, no
                crossfade). The still IS that final frame — shown for reduced-motion, on clip
                error, or when returning to the cover so it never repaints. */}
            <img className={"ww-cover-still" + ((prefersReducedMotion || paintFailed || paintSeenRef.current) ? " on" : "")}
              src={BX_ASSETS.base + BX_ASSETS.cover} alt="" />
            {!prefersReducedMotion && !paintFailed && !paintSeenRef.current && (
              <video
                src={BX_ASSETS.base + BX_ASSETS.coverPaint} muted playsInline autoPlay preload="auto"
                onEnded={() => { paintSeenRef.current = true; }}
                onError={() => { setPaintFailed(true); }} />
            )}
          </div>
          <div className="ww-cover-copy">
            <div className="ww-kicker">A thinking tool for Wesley teachers</div>
            {/* The cover stays mounted behind the later scenes, so it hands the h1 over once the
                teacher moves on — one page, one h1, whichever scene is showing. */}
            {React.createElement(bxScene === "cover" ? "h1" : "h2", null,
              "Start with the ", <span className="pu" key="p">thinking</span>, ", not the topic.")}
            <p className="ww-sub">Pick a thinking move, add a photo, film or article, and Springboard builds a lesson that takes your class from remembering into understanding.</p>
            <button className="ww-enter" autoFocus onClick={enterMind}><span>Enter the mind</span></button>
          </div>
          <footer className="ww-foot">
            <span>Built on <a href="https://pz.harvard.edu/thinking-routines" target="_blank" rel="noopener">Harvard Project Zero</a> Thinking Routines &amp; Cultures of Thinking</span>
            <span>Brought to you by the DLP team</span>
          </footer>
        </section>
      )}

      {(bxScene === "transport" || bxScene === "inside" || bxScene === "glide") && (
        // The map: paper stays put; only its INK fades. transport / glide-out = fading in
        // under (or behind) the outgoing scene; glide-in = fading away beneath the chamber.
        <div className={"ww-map" + ((bxScene === "transport" || (bxScene === "glide" && glideDir === "out")) ? " entering"
              : (bxScene === "glide" && glideDir === "in") ? " fading" : "")}
          ref={insideStageRef} tabIndex={-1} aria-label="The Map of Understanding — eight thinking moves">
          {/* (No cords, no light pulses, no centre splotch — Nathan's call. The eight blooms
              orbit the title, which is the centrepiece; hover is a quiet bloom swell.)
              The map's CONTENT mounts only once we've actually arrived (inside/glide), never
              during the enter crossfade — otherwise the un-placed blooms clustered top-left
              for a frame and then jumped ("the paintbrush in the corner", the jerk). Mounting
              here is also the trigger for the watercolour spread-in + the handwritten title. */}
          {bxScene !== "transport" && (<React.Fragment>
          {/* eight watercolour move-blooms (multiply melts their white paper into ours); each
              bleeds outward from its centre like water hitting pigment, staggered via --i */}
          {MOVES.map((m, i) => (
            <img key={m.name} className="ww-bloom" ref={el => { bloomEls.current[i] = el; }} aria-hidden="true"
              src={BX_ASSETS.base + BX_ASSETS.bloom(IMG_MOVE_POS[m.name].bloom)} alt=""
              style={{ "--i": i }} />
          ))}
          {/* The map's nameplate. It is this scene's ONLY heading, so it has to be the h1: the map
              replaces the cover entirely, and a page with no h1 leaves screen-reader users with
              nothing to orient by. */}
          {React.createElement(bxScene === "inside" ? "h1" : "h2",
            { ref: centreTitleRef, className: "ww-title" },
            // The map stays mounted behind the chamber, so it steps down to an h2 there and the
            // chamber's move name is the page's only h1. Two h1s is as unhelpful as none.
            <span className="k" key="k">The Map of Understanding</span>,
            <span className="n" key="n">Thinking Moves</span>)}
          {MOVES.map((m, i) => (
            <button key={m.name} ref={el => { labelEls.current[i] = el; }} className="ww-label"
              style={{ "--dot": bwTint(m.name), "--i": i, "--tilt": ([-1.6, 1.2, -1, 1.7, 1.3, -1.7, 1, -1.2][i] || 0) + "deg" }}
              onClick={() => chooseMove(m.name)}
              onMouseEnter={() => startMoveHover(i)} onMouseLeave={() => endMoveHover(i)}
              // :focus-visible gate: the return-from-chamber focus restore (programmatic, after
              // a mouse click) must not swell as if hovered — only real keyboard focus reads as
              // intent to look at this move.
              onFocus={(e) => { try { if (e.target.matches(":focus-visible")) startMoveHover(i); } catch (_) { startMoveHover(i); } }}
              onBlur={() => endMoveHover(i)}>
              <span>{m.name}</span>
            </button>
          ))}
          {/* Mobile map: the circle can't hold eight long labels on a phone, so narrow screens
              get a clean scrollable list instead (bloom + name rows). Hidden on desktop via CSS;
              the positioned circle above is hidden on mobile. */}
          <div className="ww-maplist" aria-label="The eight thinking moves">
            <div className="ww-maplist-head"><span className="k">The Map of Understanding</span><span className="n">Thinking Moves</span></div>
            {MOVES.map((m) => (
              <button key={m.name} className="ww-maplist-row" style={{ "--dot": bwTint(m.name) }} onClick={() => chooseMove(m.name)}>
                <img src={BX_ASSETS.base + BX_ASSETS.bloom(IMG_MOVE_POS[m.name].bloom)} alt="" aria-hidden="true" />
                <span>{m.name}</span>
              </button>
            ))}
          </div>
          </React.Fragment>)}
        </div>
      )}

      {(bxScene === "chamber" || bxScene === "glide") && selectedMoveObj && (
        // Inside a thinking move: light paper chamber. Mounting during glide-in plays the
        // fade-in animation over the fading map; glide-out swaps in the .out fade so "All
        // moves" reverses the ink instead of popping. selectedMove clears once leaveChamber's
        // timeout lands back on "inside".
        <div className={"ww-chamber" + ((bxScene === "glide" && glideDir === "out") ? " out" : "")}
          tabIndex={-1} aria-label={selectedMove + " — build the lesson"}
          style={{ "--bwt": bwTint(selectedMove), "--mv": bxColor(selectedMove),
            ...(bxScene === "glide" ? { pointerEvents: "none" } : null) }}>
          <div className="ww-chamber-bg" aria-hidden="true">
            {interiorOk && (
              // soft watercolour wash field (wc-chamber.png); fades in when loaded, and the
              // tintwash beneath carries the move's colour with or without it
              <img src={BX_ASSETS.base + BX_ASSETS.chamber} alt=""
                ref={(el) => { if (el && el.complete && el.naturalWidth) el.classList.add("ready"); }}
                onLoad={(e) => e.currentTarget.classList.add("ready")}
                onError={() => setInteriorOk(false)} />
            )}
            <div className="tintwash" />
          </div>
          {renderBrainTool()}
        </div>
      )}

    </div>
  );

  /* ------------------------------ render ------------------------------ */
  const routineUrlFor = spot ? routineUrl(spot.think.routine) : "";

  return (
    <React.Fragment>
      {brainView && renderBrain()}
      {!brainView && (<React.Fragment>
      <header className="app">
        <div className="logo"><Icon d={I.spring} size={26} stroke /></div>
        <div>
          <h1>Springboard</h1>
          <p>Launch student thinking — stimulus to slides in two minutes.</p>
        </div>
        <a className="admin-link" href="about.html" target="_blank" rel="noopener" title="How Springboard works — its purpose and the teaching design behind it">How it works</a>
        <button type="button" className="admin-icon" onClick={() => setDark(d => !d)} aria-pressed={dark} aria-label={dark ? "Switch to light mode" : "Switch to dark mode"} title="Toggle dark mode"><Icon d={dark ? I.sun : I.moon} size={16} stroke /></button>
        <button type="button" className="admin-icon" onClick={() => setAdminOpen(true)} aria-label="Admin analytics" title="Admin analytics — password protected"><Icon d={I.chart} size={16} stroke /></button>
        <span className="appver" title="App version — check this matches after a refresh">{APP_VERSION}</span>
      </header>

      {adminOpen && <AdminGate onClose={() => setAdminOpen(false)} />}

      <main className={"layout" + (previewOpen ? "" : " pre")}>
        {/* Welcome hero — first-visit warmth; disappears once the preview opens so the
            two-minute path stays clear. */}
        {!previewOpen && (
          <section className="hero">
            <h2>What will <span className="hero-mark">spark</span> your class today?</h2>
            <p className="hero-sub">Two steps: drop in a photo, an article, a video or a link in <b>step&nbsp;1</b>, set up your class and thinking move in <b>step&nbsp;2</b> — Springboard turns it into a ready-to-teach thinking deck in about two minutes.</p>
            <div className="hero-arc">
              <span className="arc-chip arc-1">Ignite</span><span className="arc-sep" aria-hidden="true">→</span>
              <span className="arc-chip arc-2">Think</span><span className="arc-sep" aria-hidden="true">→</span>
              <span className="arc-chip arc-3">Launch</span><span className="arc-sep" aria-hidden="true">→</span>
              <span className="arc-chip arc-4">Reflect</span>
            </div>
          </section>
        )}
        {/* ----------------- INPUT PANEL ----------------- */}
        {/* Two .icol wrappers: pre-generate they are the panel's two internal columns
            (stimulus | class + generate); post-generate they display:contents away. */}
        <div className="panel input">
          <div className="icol">
          <div className="icol-head"><span className="n">1</span><h3>Add your stimulus</h3></div>
          <div className="group">
            <label className="cap" id="lbl-mode">Stimulus mode</label>
            <div className="modes" role="group" aria-labelledby="lbl-mode">
              {["media", "article"].map(m => (
                <button key={m} type="button" className={mode === m ? "active" : ""} aria-pressed={mode === m} onClick={() => setMode(m)}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                    <Icon d={m === "media" ? I.image : I.doc} size={16} stroke />
                    {m === "media" ? "Images / video" : "Article"}
                  </span>
                </button>
              ))}
            </div>
          </div>

          {mode === "media" && (
            <div className="group">
              <label className="cap" htmlFor="f-media">Images &amp; video <span style={{ color: "var(--muted)", fontWeight: 600 }}>(swipeable reel)</span></label>
              <button type="button" className="filebox"
                aria-label="Add images or videos to the reel"
                onClick={() => mediaInput.current.click()}
                onDragOver={e => { e.preventDefault(); }}
                onDrop={e => { e.preventDefault(); addMediaFiles(e.dataTransfer.files); }}>
                {extractingVideo
                  ? <React.Fragment><div className="big"><span className="spinner" style={{ borderTopColor: "var(--accent)", borderColor: "var(--accent-soft)" }}></span></div><div className="small">Reading video…</div></React.Fragment>
                  : <React.Fragment><div className="big"><Icon d={I.image} size={26} stroke /></div><div className="small">Click, or drop images / videos here ({media.length}/{MAX_MEDIA})</div></React.Fragment>}
              </button>
              <input ref={mediaInput} id="f-media" type="file" accept="image/*,video/*" multiple hidden onChange={onMedia} />
              <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                <input id="f-postlink" type="text" aria-label="Post link to grab photos and videos from"
                  value={postLink} placeholder="…or paste a post link — Instagram, YouTube, X, Facebook"
                  onChange={e => setPostLink(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter" && !importingPost) { e.preventDefault(); importFromPostLink(); } }} />
                <button type="button" className="btn ghost" style={{ width: "auto", padding: "9px 12px", whiteSpace: "nowrap" }}
                  disabled={importingPost || extractingVideo} onClick={() => importFromPostLink()}>
                  {importingPost ? "Fetching…" : "Add from link"}
                </button>
              </div>
              {mediaNote && <div className="alert info" role="status" aria-live="polite" style={{ marginTop: 8 }}>{mediaNote}</div>}

              {media.length > 0 && (
                <div className="media-strip">
                  {media.map((it, i) => (
                    <div className="media-thumb" key={it.id}>
                      <img src={it.kind === "image" ? it.dataUrl : it.poster} alt={it.name} />
                      {(it.kind === "video" || it.kind === "youtube") && <span className="vtag"><Icon d={I.play} size={14} /></span>}
                      <div className="media-thumb-tools">
                        <button type="button" className="iconbtn" aria-label={"Move " + it.name + " earlier"} disabled={i === 0} onClick={() => moveMedia(it.id, -1)}>‹</button>
                        <span className="ord">{i + 1}</span>
                        <button type="button" className="iconbtn" aria-label={"Move " + it.name + " later"} disabled={i === media.length - 1} onClick={() => moveMedia(it.id, +1)}>›</button>
                        <button type="button" className="iconbtn" aria-label={"Remove " + it.name} onClick={() => removeMedia(it.id)}><Icon d={I.close} size={13} stroke /></button>
                      </div>
                      {it.kind === "video" && (
                        <textarea className="media-text" rows={2} value={it.text}
                          placeholder="Transcript / what's in this clip (optional)"
                          onChange={e => setMediaText(it.id, e.target.value)} />
                      )}
                      {it.kind === "video" && (
                        <div className="hint" aria-live="polite">
                          {it.transcribeState === "running" && <React.Fragment><span className="spinner sm dark"></span> transcribing…</React.Fragment>}
                          {it.transcribeState === "done" && `transcript ready (${(it.text ? it.text.trim().split(/\s+/).length : 0)} words) ${it.transcribeNote}`}
                          {it.transcribeState === "failed" && it.transcribeNote}
                        </div>
                      )}
                      {it.kind === "video" && (it.convertState === "converting" || it.convertState === "failed" || it.convertedFrom) && (
                        <div className="hint" aria-live="polite" style={{ marginTop: 2 }}>
                          {it.convertState === "converting" && <React.Fragment><span className="spinner sm dark"></span> making this clip PowerPoint-friendly… {it.convertPct || 0}%</React.Fragment>}
                          {it.convertState === "done" && it.convertedFrom && <span style={{ color: "var(--accent)", fontWeight: 600 }}>Converted ✓ plays in PowerPoint</span>}
                          {it.convertState === "failed" && (
                            <span style={{ background: "var(--warn-bg)", color: "var(--warn-ink)", padding: "1px 6px", borderRadius: 6, fontWeight: 600 }}>Couldn't convert — may play sound with no picture online</span>
                          )}
                        </div>
                      )}
                      {it.kind === "youtube" && (
                        <React.Fragment>
                          <textarea className="media-text" rows={2} value={it.text}
                            placeholder="What happens in this clip? (it can't be transcribed)"
                            onChange={e => setMediaText(it.id, e.target.value)} />
                          <div className="hint" aria-live="polite">
                            {it.text.trim()
                              ? <span style={{ color: "var(--accent)", fontWeight: 600 }}>Description added ✓</span>
                              : <span>YouTube clips can't be transcribed — type what happens so the questions match.</span>}
                          </div>
                        </React.Fragment>
                      )}
                    </div>
                  ))}
                </div>
              )}

              <div className="group" style={{ marginTop: 10 }}>
                <label className="cap" htmlFor="f-mlink">Link (optional — becomes a QR code)</label>
                <input id="f-mlink" type="text" value={link} placeholder="https://…" onChange={e => setLink(e.target.value)} />
              </div>
              <div className="hint">Add one or many — they appear as a swipeable carousel with the routine on the right, and export as a click-through slideshow. Videos: still frames are read so the model can "see" them; small clips embed and play in <b>desktop</b> PowerPoint. YouTube links become a live click-to-play clip on the slide (needs internet; works in desktop and web PowerPoint).</div>
            </div>
          )}

          {mode === "article" && (
            <div className="group">
              <label className="cap" htmlFor="f-pdf">Article — upload PDF or paste text</label>
              <button type="button" className="filebox" aria-label={pdfName ? `Replace PDF ${pdfName}` : "Upload a PDF"} onClick={() => pdfInput.current.click()}>
                <div className="big"><Icon d={I.doc} size={26} stroke /></div>
                <div className="small">{pdfName || "Click or press Enter to upload a PDF"}</div>
              </button>
              <input ref={pdfInput} id="f-pdf" type="file" accept="application/pdf" hidden onChange={onPdf} />

              <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                <input type="text" aria-label="Article link" value={link} placeholder="…or paste an article link (https://…)" onChange={e => setLink(e.target.value)} />
                <button type="button" className="btn ghost" style={{ width: "auto", padding: "9px 12px", whiteSpace: "nowrap" }} disabled={fetchingArticle} onClick={fetchArticleFromLink}>
                  {fetchingArticle ? "Fetching…" : "Fetch text"}
                </button>
              </div>

              {articleNote && <div className={"alert " + (articleNote.ok ? "info" : "bad")} role={articleNote.ok ? "status" : "alert"} aria-live="polite" style={{ marginTop: 8 }}>{articleNote.text}</div>}
              <textarea style={{ marginTop: 8 }} aria-label="Article text" value={articleText} placeholder="…the fetched or pasted article text appears here (edit freely)" onChange={e => onArticleTextChange(e.target.value)} />
              <div className="hint"><b>Fetch text</b> pulls the article via a public reader service — works for open news sites (the link also becomes the QR code). Hard paywalls may fail; upload the PDF or paste the text instead.</div>
            </div>
          )}

          <div className="group">
            <label className="cap" htmlFor="f-title">Title (optional)</label>
            <input id="f-title" type="text" value={title} placeholder="Leave blank to auto-generate" onChange={e => setTitle(e.target.value)} />
          </div>
          </div>

          <div className="icol">
          <div className="icol-head"><span className="n">2</span><h3>Set up &amp; generate</h3></div>
          <div className="group">
            <label className="cap">Class settings</label>
            <div className="field-row">
              <label htmlFor="f-curr">Curriculum</label>
              <select id="f-curr" value={classInfo.curriculum}
                      onChange={e => saveClassInfo({ ...classInfo, curriculum: e.target.value })}>
                {CURRICULA.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            {/* Year level before Subject: year decides which subject picker shows
                (VCE Y11/12 studies, AC F-10 year-filtered subjects, or free text). */}
            <div className="field-row">
              <label htmlFor="f-year">Year level</label>
              <input id="f-year" type="text" placeholder="e.g. Prep, 4, 8, 11"
                     value={classInfo.yearLevel} onChange={e => saveClassInfo({ ...classInfo, yearLevel: e.target.value })} />
            </div>
            <div className="field-row">
              <label htmlFor="f-subj">Subject</label>
              {isVceSenior(classInfo)
                ? <select id="f-subj" value={classInfo.subject}
                          onChange={e => saveClassInfo({ ...classInfo, subject: e.target.value })}>
                    <option value="">Choose your VCE study…</option>
                    {VCE_AREAS.map(area => (
                      <optgroup label={area} key={area}>
                        {VCE_SUBJECTS.filter(s => s.area === area).map(s => (
                          <option key={s.key} value={s.name}>{s.name}</option>
                        ))}
                      </optgroup>
                    ))}
                  </select>
                : isAcF10(classInfo)
                ? <select id="f-subj" value={classInfo.subject}
                          onChange={e => saveClassInfo({ ...classInfo, subject: e.target.value })}>
                    <option value="">Choose your subject…</option>
                    {AC_AREAS.map(area => {
                      const subs = acSubjectsFor(classInfo.yearLevel).filter(s => s.area === area);
                      return subs.length ? (
                        <optgroup label={area} key={area}>
                          {subs.map(s => <option key={s.key} value={s.name}>{s.name}</option>)}
                        </optgroup>
                      ) : null;
                    })}
                  </select>
                : <input id="f-subj" type="text" placeholder="e.g. Science, English, Humanities"
                         value={classInfo.subject} onChange={e => saveClassInfo({ ...classInfo, subject: e.target.value })} />}
            </div>
            <div className="field-row">
              <label htmlFor="f-outcome">Outcome or topic (optional)</label>
              <div className="modes sm" role="group" aria-label="Outcome source">
                <button type="button" className={outcomeMode === "paste" ? "active" : ""} aria-pressed={outcomeMode === "paste"} onClick={() => setOutcomeMode("paste")}>Paste from planner</button>
                <button type="button" className={outcomeMode === "ai" ? "active" : ""} aria-pressed={outcomeMode === "ai"} onClick={() => setOutcomeMode("ai")}>AI suggestions</button>
              </div>
              {outcomeMode === "paste" && (
                <textarea id="f-outcome" rows={2} style={{ marginTop: 8 }}
                          placeholder="e.g. 'Students analyse how text structures shape meaning' or 'Unit: Body systems'"
                          value={classInfo.outcome} onChange={e => saveClassInfo({ ...classInfo, outcome: e.target.value })} />
              )}
              {outcomeMode === "ai" && (
                <React.Fragment>
                  <button type="button" className="btn ghost" style={{ marginTop: 8 }}
                          disabled={suggesting || !classInfo.subject.trim() || !classInfo.yearLevel.trim()}
                          aria-busy={suggesting} onClick={runSuggestOutcomes}>
                    {suggesting
                      ? <React.Fragment><span className="spinner sm dark"></span> Suggesting…</React.Fragment>
                      : <React.Fragment><Icon d={I.generate} size={16} stroke /> {suggests ? "Suggest again" : "Suggest connections"}</React.Fragment>}
                  </button>
                  {(!classInfo.subject.trim() || !classInfo.yearLevel.trim())
                    ? <div className="hint">Fill in year level and subject first. Adding a stimulus makes suggestions sharper.</div>
                    : <div className="hint">Suggests where your lesson could connect to the curriculum — tick one or more, then edit freely.</div>}
                  {suggestError && <div className="alert bad" role="alert">{suggestError}</div>}
                  {suggests && (
                    <div className="routine-cards">
                      {/* Multi-select: each ticked suggestion becomes one line of the outcome;
                          membership is line-based so unticking removes exactly that line. */}
                      {suggests.map(s => {
                        const lines = classInfo.outcome.split("\n").map(l => l.trim()).filter(Boolean);
                        const picked = lines.includes(s.outcome);
                        const toggle = () => {
                          const next = picked ? lines.filter(l => l !== s.outcome) : [...lines, s.outcome];
                          saveClassInfo({ ...classInfo, outcome: next.join("\n") });
                        };
                        return (
                          <div className={"routine-card" + (picked ? " on" : "")} key={s.outcome}>
                            <label className="routine-card-pick">
                              <input type="checkbox" checked={picked} onChange={toggle} />
                              <span>{s.outcome}</span>
                            </label>
                            <p className="routine-card-why">{s.why}</p>
                          </div>
                        );
                      })}
                    </div>
                  )}
                  {classInfo.outcome.trim() !== "" && (
                    <React.Fragment>
                      <div className="hint" style={{ marginTop: 8 }}>Chosen outcomes (edit freely):</div>
                      <textarea id="f-outcome" rows={2} aria-label="Chosen outcome"
                                value={classInfo.outcome} onChange={e => saveClassInfo({ ...classInfo, outcome: e.target.value })} />
                    </React.Fragment>
                  )}
                </React.Fragment>
              )}
            </div>
          </div>

          {/* ----------------- THINKING MOVE STEP (new first step, from the Understanding Map) ----------------- */}
          <div className="group">
            <label className="cap">Choose a Thinking Move</label>
            <div className="hint" style={{ marginBottom: 8 }}>Start from the Understanding Map. Analyse then suggests the routines that best fit this move.</div>
            <div className="move-cards" role="radiogroup" aria-label="Thinking Move">
              {MOVES.map(m => (
                <button type="button" key={m.name}
                  role="radio" aria-checked={selectedMove === m.name}
                  className={"move-card" + (selectedMove === m.name ? " on" : "")}
                  onClick={() => pickMove(m.name)}>
                  <span className="move-card-name">{m.name}</span>
                  <span className="move-card-q">{m.question}</span>
                </button>
              ))}
            </div>
          </div>

          {/* ----------------- ANALYSE STEP ----------------- */}
          <div className="group">
            <label className="cap">Analyse stimulus</label>
            <button type="button" className="btn ghost" disabled={!inputReady() || analysing || !selectedMove} aria-busy={analysing} onClick={runAnalyse}>
              {analysing
                ? <React.Fragment><span className="spinner sm dark"></span> Analysing…</React.Fragment>
                : <React.Fragment><Icon d={I.generate} size={16} stroke /> Analyse stimulus</React.Fragment>}
            </button>
            <div className="hint">{selectedMove
              ? `Reads your stimulus and ranks routines for "${selectedMove}" before you generate.`
              : "Choose a Thinking Move above to enable Analyse."}</div>

            {analyseError && <div className="alert bad" role="alert">{analyseError}</div>}

            {analysis && (
              <React.Fragment>
                <p className="hint" style={{ marginTop: 10 }}>{analysis.summary}</p>

                <div className="routine-cards">
                  {analysis.routines.map(r => (
                    <div className={"routine-card" + (selectedRoutine === r.name ? " on" : "")} key={r.name}>
                      <label className="routine-card-pick">
                        <input type="radio" name="routineCard" value={r.name}
                          checked={selectedRoutine === r.name} onChange={() => pickRoutine(r.name)} />
                        <span className="routine-card-name">{r.name}</span>
                      </label>
                      <p className="routine-card-why">{r.why}</p>
                      <a className="routine-card-link" href={routineUrl(r.name)} target="_blank" rel="noopener">View routine ↗</a>
                    </div>
                  ))}
                </div>

                <details className="routine-browse">
                  <summary>{selectedMove ? `Browse all routines for "${selectedMove}"` : "Browse all routines"}</summary>
                  {routineGroups.map(([group, list]) => (
                    <div className="routine-browse-group" key={group}>
                      <div className="routine-browse-heading">{group}</div>
                      {list.map(r => (
                        <label className="routine-browse-item" key={r.name}>
                          <input type="radio" name="routineCard" value={r.name}
                            checked={selectedRoutine === r.name} onChange={() => pickRoutine(r.name)} />
                          <span>{r.name}</span>
                        </label>
                      ))}
                    </div>
                  ))}
                </details>
              </React.Fragment>
            )}
            {/* Zoom In's crop tool — same component the brain view uses (Classic must not silently
                export default frames the teacher never saw). */}
            {zoomInPicked && activeReveal && (
              <div className="group" style={{ marginTop: 14 }}>
                <label className="cap">Zoom In · what do they see first?</label>
                <RevealEditor src={revealPhoto.dataUrl} frames={activeReveal} setFrames={setRevealFrames} idx={revealIdx} setIdx={setRevealIdx} />
              </div>
            )}
          </div>

          <button className="btn primary generate" ref={genBtnRef} disabled={loading || !!regenSlide || !selectedRoutine} aria-busy={loading} onClick={generate}>
            {loading ? <React.Fragment><ProgressRing value={genProgress} /> Generating… {Math.round(genProgress)}%</React.Fragment>
              : spot ? <React.Fragment><Icon d={I.refresh} size={16} stroke /> Regenerate</React.Fragment>
              : <React.Fragment><Icon d={I.spring} size={18} stroke /> Generate Springboard</React.Fragment>}
          </button>
          {!selectedRoutine && <div className="hint">Analyse the stimulus and pick a thinking routine to enable Generate.</div>}

          {/* Screen-reader-only live status: announces the generation lifecycle (the
              visible cue is the button text/spinner; errors are announced via role=alert). */}
          <div className="sr-only" role="status" aria-live="polite">
            {loading ? "Generating your Springboard, this may take a moment."
              : regenSlide ? "Regenerating that section, please wait."
              : (spot && !error) ? "Your Springboard is ready below."
              : ""}
          </div>

          {error && <div className="alert bad" role="alert"><b>Something went wrong.</b><pre>{error}</pre>{rawDump && <React.Fragment><b>Raw model output:</b><pre>{rawDump}</pre></React.Fragment>}</div>}
          </div>
        </div>

        {/* ----------------- PREVIEW PANEL (only after Generate) ----------------- */}
        {previewOpen && (
        <div>
          {!spot && loading && (
            <div className="panel"><div className="empty">
              <div className="big" aria-hidden="true"><span className="doodle-star ds-1">✦</span><Icon d={I.spring} size={46} stroke /><span className="doodle-star ds-2">✦</span></div>
              <h2 style={{ margin: "0 0 6px", fontFamily: "var(--font-display)" }}>Building your Springboard…</h2>
              <LoadingLines />
            </div></div>
          )}

          {spot && (
            <React.Fragment>
              {Object.keys(spots).length > 1 && (
                <div className="band-tabs" role="group" aria-label="Band decks">
                  {BAND_ORDER.filter(b => spots[b]).map(b => (
                    <button key={b} type="button" aria-pressed={activeBand === b}
                      className={"band-tab" + (activeBand === b ? " on" : "")}
                      onClick={() => setActiveBand(b)}>
                      <span className={"band-dot band-" + b.toLowerCase()}></span>{bandLabelOf(b)}
                    </button>
                  ))}
                </div>
              )}
              {stimulusStale && <div className="alert info" role="status">You changed the stimulus. Hit <b>Regenerate</b> so the slides match.</div>}
              <div className="toolbar">
                <button type="button" className="btn ghost" disabled={loading || !!regenSlide || !selectedRoutine} onClick={generate}><Icon d={I.refresh} size={16} stroke /> Regenerate</button>
                <button type="button" className="btn primary" disabled={exporting} onClick={download}><Icon d={I.download} size={16} stroke /> {exporting ? "Preparing…" : "Download PowerPoint"}</button>
              </div>

              <div className="slides">
                {/* Springboard title — search keywords are generated automatically into the file's tags/notes; no teacher-facing field */}
                <div className="slide"><div className="bar" style={barStyle}></div><div className="body">
                  <div className="slide-head"><div className="slide-tag"><span className="n">★</span> <h2 style={{ font: "inherit", margin: 0, display: "inline" }}>Springboard title</h2> <span className="aside">· ≤8 words · band &amp; topic shown here</span></div></div>
                  <textarea className="editable titlebig" rows={1} aria-label="Springboard title" value={spot.title} placeholder="A short, catchy title…" onChange={e => patch({ title: e.target.value })} />
                  <textarea className="editable" rows={2} aria-label="Learning intention" value={spot.intention || ""} placeholder="We are learning to…" onChange={e => patch({ intention: e.target.value })} />
                  <div className="meta-chips">
                    <span className={"chip band-" + band.toLowerCase()}>{bandLabel}{year ? " · " + year : ""}</span>
                    {theme && <span className="chip gold">{theme}</span>}
                  </div>
                </div></div>

                {/* IGNITE */}
                <div className="slide s-ignite"><div className="bar"></div><div className="body">
                  <div className="slide-head"><div className="slide-tag"><span className="n">1</span> <h2 style={{ font: "inherit", margin: 0, display: "inline" }}>Ignite</h2> <span className="aside">· one provocative question</span></div>{regenButton("ignite")}</div>
                  <textarea className="editable" rows={2} aria-label="Ignite question" value={spot.ignite.question} placeholder="One provocative question…" onChange={e => patchSlide("ignite", { question: e.target.value })} />
                  {(media.length > 0 || (mode === "article" && articleImageUrl) || link.trim()) && (
                    <div className="stim-preview">
                      <div className="cap" style={{ marginTop: 12 }}>On slide 1 <span style={{ fontWeight: 500, textTransform: "none", letterSpacing: 0, color: "var(--muted)" }}>· the stimulus students will see</span></div>
                      {media.length > 0 && <div className="reel-wrap"><MediaCarousel items={media} index={reelIndex} setIndex={setReelIndex} /></div>}
                      {mode === "article" && articleImageUrl && media.length === 0 && (
                        <div className="reel-wrap"><div className="reel-frame"><img src={articleImageUrl} alt="Article lead image" /></div></div>
                      )}
                      {link.trim() && <div style={{ marginTop: 10 }}><StimLink url={link.trim()} verb={MODE_VERB[mode] || "Open"} /></div>}
                    </div>
                  )}
                  <details className="notes-details">
                    <summary>Teacher notes</summary>
                    <textarea className="editable" rows={5} aria-label="Ignite teacher notes" value={spot.notes.ignite} placeholder="FACILITATION: … ENABLING PROMPT: … EXTENDING PROMPT: … CURRICULUM LINKS: …" onChange={e => patchNote("ignite", e.target.value)} />
                  </details>
                </div></div>

                {/* THINK */}
                <div className="slide s-think"><div className="bar"></div><div className="body">
                  <div className="slide-head"><div className="slide-tag"><span className="n">2</span> <h2 style={{ font: "inherit", margin: 0, display: "inline" }}>Think</h2> <span className="aside">· {ROUTINE_SOURCE}</span></div>{regenButton("think")}</div>
                  <div className="routine-name-row">
                    <span className="chip">{spot.think.routine}</span>
                    <a className="routine-card-link" href={routineUrlFor} target="_blank" rel="noopener">View routine ↗</a>
                  </div>
                  <div className="hint" style={{ marginTop: 4 }}>To use a different routine, re-pick it in Analyse on the left and Regenerate.</div>
                  <div className="cap" style={{ marginTop: 12 }}>How to run it</div>
                  <textarea className="editable" rows={1} aria-label="How to run the routine" value={spot.think.structure} placeholder="e.g. Think-pair-share, 3 min" onChange={e => patchSlide("think", { structure: e.target.value })} />
                  {mode === "article" && (
                    <React.Fragment>
                      <div className="cap" style={{ marginTop: 12 }}>What students read <span style={{ fontWeight: 500, textTransform: "none", letterSpacing: 0, color: "var(--muted)" }}>· 5 sentences beside the routine</span></div>
                      <textarea className="editable" rows={5} aria-label="Article summary students read" value={spot.think.summary || ""} placeholder="A short summary of the article, in students' language…" onChange={e => patchSlide("think", { summary: e.target.value })} />
                    </React.Fragment>
                  )}
                  <div className="cap" style={{ marginTop: 12 }}>Student prompts <span style={{ fontWeight: 500, textTransform: "none", letterSpacing: 0, color: "var(--muted)" }}>· up to 4</span></div>
                  {spot.think.steps.map((st, i) => (
                    <div className="step" key={i} style={{ gridTemplateColumns: "28px 1fr auto" }}>
                      <span className="rp-num" style={{ background: hx(T.accent), color: "#fff" }}>{i + 1}</span>
                      <textarea className="editable" rows={2} aria-label={"Student prompt " + (i + 1)} value={st} onChange={e => patchArr("think", "steps", i, e.target.value)} />
                      <button type="button" className="iconbtn" aria-label={"Remove prompt " + (i + 1)} title="Remove" onClick={() => delArr("think", "steps", i)}><Icon d={I.close} size={14} stroke /></button>
                    </div>
                  ))}
                  {spot.think.steps.length < 4 && <button type="button" className="addbtn" onClick={() => addArr("think", "steps")}>+ Add prompt</button>}
                  <details className="notes-details">
                    <summary>Teacher notes</summary>
                    <textarea className="editable" rows={5} aria-label="Think teacher notes" value={spot.notes.think} placeholder="FACILITATION: … ENABLING PROMPT: … EXTENDING PROMPT: … CURRICULUM LINKS: …" onChange={e => patchNote("think", e.target.value)} />
                  </details>
                </div></div>

                {/* LAUNCH */}
                <div className="slide s-launch"><div className="bar"></div><div className="body">
                  <div className="slide-head"><div className="slide-tag"><span className="n">3</span> <h2 style={{ font: "inherit", margin: 0, display: "inline" }}>Launch</h2> <span className="aside">· into today's lesson</span></div>{regenButton("launch")}</div>
                  <div className="cap">Bridge from the stimulus</div>
                  <textarea className="editable" rows={2} aria-label="Bridge from the stimulus" value={spot.launch.bridge} placeholder="From the stimulus to today's lesson…" onChange={e => patchSlide("launch", { bridge: e.target.value })} />
                  <div className="cap" style={{ marginTop: 10 }}>Lesson launch question</div>
                  <textarea className="editable" rows={2} aria-label="Lesson launch question" value={spot.launch.question} placeholder="The question that opens the lesson…" onChange={e => patchSlide("launch", { question: e.target.value })} />
                  <details className="notes-details">
                    <summary>Teacher notes · not shown to students</summary>
                    <div className="cap">Curriculum connection</div>
                    <textarea className="editable" rows={2} aria-label="Curriculum connection" value={spot.launch.connection} placeholder="How this links to your outcome…" onChange={e => patchSlide("launch", { connection: e.target.value })} />
                    <div className="cap" style={{ marginTop: 10 }}>Notes</div>
                    <textarea className="editable" rows={5} aria-label="Launch teacher notes" value={spot.notes.launch} placeholder="FACILITATION: … ENABLING PROMPT: … EXTENDING PROMPT: … CURRICULUM LINKS: …" onChange={e => patchNote("launch", e.target.value)} />
                  </details>
                </div></div>

                {/* REFLECT */}
                <div className="slide s-reflect"><div className="bar"></div><div className="body">
                  <div className="slide-head"><div className="slide-tag"><span className="n">4</span> <h2 style={{ font: "inherit", margin: 0, display: "inline" }}>Reflect</h2> <span className="aside">· revisit thinking at lesson end</span></div></div>
                  <label className="toggle-row">
                    <input type="checkbox" checked={includeReflect} onChange={e => setIncludeReflect(e.target.checked)} />
                    Include REFLECT slide (revisit thinking at lesson end)
                  </label>
                  <div className={"reflect-body" + (includeReflect ? "" : " dimmed")} aria-hidden={!includeReflect}>
                    {includeReflect && (
                      <div style={{ display: "flex", alignItems: "flex-end", gap: 12, justifyContent: "space-between", flexWrap: "wrap" }}>
                        <div className="routine-pick" style={{ margin: 0 }}>
                          <label htmlFor="reflect-routine" className="cap" style={{ display: "block", marginBottom: 4 }}>Reflection routine</label>
                          <select id="reflect-routine" value={reflectRoutine} disabled={!!regenSlide || loading}
                            onChange={e => pickReflectRoutine(e.target.value)}>
                            <option value="">Auto — vary each lesson</option>
                            {REFLECT_ROUTINES.map(r => <option key={r.name} value={r.name}>{r.name}</option>)}
                          </select>
                        </div>
                        {regenButton("reflect")}
                      </div>
                    )}
                    <div className="cap" style={{ marginTop: 10 }}>Revisit the ignite question</div>
                    <textarea className="editable" rows={2} aria-label="Revisit the ignite question" value={spot.reflect.revisit} placeholder="…revisiting the opening question" onChange={e => patchSlide("reflect", { revisit: e.target.value })} disabled={!includeReflect} />
                    <div className="cap" style={{ marginTop: 10 }}>Reflection prompts <span style={{ fontWeight: 500, textTransform: "none", letterSpacing: 0, color: "var(--muted)" }}>· up to 4</span></div>
                    {spot.reflect.prompts.map((pr, i) => (
                      <div className="step" key={i} style={{ gridTemplateColumns: "28px 1fr auto" }}>
                        <span className="rp-num" style={{ background: "var(--gold-soft)", color: "var(--accent-2-ink)" }}>{i + 1}</span>
                        <textarea className="editable" rows={1} aria-label={"Reflection prompt " + (i + 1)} value={pr} onChange={e => patchArr("reflect", "prompts", i, e.target.value)} disabled={!includeReflect} />
                        <button type="button" className="iconbtn" aria-label={"Remove reflection prompt " + (i + 1)} title="Remove" onClick={() => delArr("reflect", "prompts", i)} disabled={!includeReflect}><Icon d={I.close} size={14} stroke /></button>
                      </div>
                    ))}
                    {includeReflect && spot.reflect.prompts.length < 4 && <button type="button" className="addbtn" onClick={() => addArr("reflect", "prompts")}>+ Add prompt</button>}
                    <details className="notes-details">
                      <summary>Teacher notes</summary>
                      <textarea className="editable" rows={5} aria-label="Reflect teacher notes" value={spot.notes.reflect} placeholder="FACILITATION: … ENABLING PROMPT: … EXTENDING PROMPT: … CURRICULUM LINKS: …" onChange={e => patchNote("reflect", e.target.value)} disabled={!includeReflect} />
                      <textarea className="editable" style={{ marginTop: 8 }} rows={2} aria-label="Metacognition line for the teacher notes" value={spot.reflect.metacognition || ""} placeholder="Metacognition — the strategy students used today, and how to get them to notice it" onChange={e => patchSlide("reflect", { metacognition: e.target.value })} disabled={!includeReflect} />
                    </details>
                  </div>
                </div></div>
              </div>
            </React.Fragment>
          )}
        </div>
        )}
      </main>
      </React.Fragment>)}
    </React.Fragment>
  );
}

/* QR preview component (synchronous, crash-proof) */
function StimLink({ url, verb }) {
  const qr = makeQrDataUrl(url);
  return (
    <div className="stim-link">
      {qr && <img className="qr" src={qr} alt={"QR code for " + url} />}
      <div><div style={{ marginBottom: 4 }}>{verb} here:</div><a href={url} target="_blank" rel="noreferrer">{url}</a></div>
    </div>
  );
}

/* Error boundary so a render error shows a message instead of a blank screen */
class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error("App crashed:", err, info); }
  render() {
    if (this.state.err) {
      return (
        <div style={{ maxWidth: 720, margin: "60px auto", padding: 24, fontFamily: "var(--font-body)" }}>
          <h2 style={{ color: "var(--bad-ink)" }}>Something crashed in the app</h2>
          <p>Try a hard refresh (Ctrl+F5). If it keeps happening, send this message:</p>
          <pre style={{ whiteSpace: "pre-wrap", background: "var(--bad-bg)", color: "var(--bad-ink)", border: "1px solid var(--bad)", borderRadius: 10, padding: 12 }}>
            {String(this.state.err && (this.state.err.stack || this.state.err.message || this.state.err))}
          </pre>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
</html>
