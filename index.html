/* How hard the model thinks before it writes a word. Measured on a real Year 4 lesson
   (2026-08-03): the default burned 3,024 reasoning tokens and emitted NOTHING for the first ~60s
   of a 66s call, so the first slide only reached the screen at 67s. Streaming cannot shorten
   silence — this is the only knob that does. Held at "medium" rather than "low" (2026-08-04):
   the speed win from "low" was real but rested on a single sampled lesson, and lesson quality
   is worth more here than the ~15-25s it costs back. */
const GEN_REASONING = "medium";

// Slide accent colours. Module scope, not inside App: LiveBuild below is a top-level component,
// and referencing a component-scoped const from here throws at runtime, not at compile time.
const SLIDE_CC = { ignite: "#823a9e", think: "#34508f", launch: "#c0592a", reflect: "#3f7a34" };

/* The lesson arriving, live. Each part shows its real words the moment the model writes them, so
   a teacher can read IGNITE while REFLECT is still being written instead of watching a bar for
   over a minute (measured build: ~69s). Purely a view of the streamed partial — nothing here is
   editable, and it is replaced by the real editor the moment the reply completes. */
const LiveBuild = ({ live }) => {
  if (!live) return null;
  const th = live.think || {};
  const parts = [
    { k: "IGNITE", cc: SLIDE_CC.ignite, text: (live.ignite || {}).question || "" },
    { k: "THINK", cc: SLIDE_CC.think, text: (Array.isArray(th.steps) ? th.steps : []).filter(Boolean).join("  ·  ") },
    { k: "LAUNCH", cc: SLIDE_CC.launch, text: (live.launch || {}).question || "" },
    { k: "REFLECT", cc: SLIDE_CC.reflect, text: (Array.isArray((live.reflect || {}).prompts) ? live.reflect.prompts : []).filter(Boolean).join("  ·  ") },
  ];
  // The part being written is the first one with nothing in it yet.
  const writingAt = parts.findIndex(p => !p.text);
  return (
    <div className="bx-live">
      {live.title && <div className="bx-live-title">{live.title}</div>}
      {parts.map((p, i) => (
        <div className="bx-live-row" key={p.k} style={{ "--cc": p.cc }}>
          <span className="k">{p.k}</span>
          <span className={"t" + (p.text ? "" : " waiting")}>
            {p.text || (i === writingAt ? "writing…" : "waiting")}
          </span>
        </div>
      ))}
    </div>
  );
};

// Determinate circular progress ring (white, for use on the primary button).
const ProgressRing = ({ value, size = 18 }) => {
  const r = (size - 3) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(100, value)) / 100);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: "rotate(-90deg)" }} aria-hidden="true" focusable="false">
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(255,255,255,.35)" strokeWidth="2.5" />
      <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={off} style={{ transition: "stroke-dashoffset .25s linear" }} />
    </svg>
  );
};

// Rotating build-time lines — a friendlier wait than a static sentence.
const LOADING_LINES = [
  "Warming up the thinking routines…",
  "Reading your stimulus closely…",
  "Sharpening the questions…",
  "Bridging to your curriculum…",
  "Adding a little spring…",
];
function LoadingLines() {
  const [i, setI] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setI(v => (v + 1) % LOADING_LINES.length), 2600);
    return () => clearInterval(t);

}

// Download celebration: watercolour washes bleeding across the page, the way the brain world
// paints itself. Replaced a party-popper confetti burst (Nathan, 2026-08-03) — plastic rectangles
// belonged to a different app.
//
// Rewritten 2026-08-04: the first watercolour version read as "mud being splattered over the
// screen" (Nathan), and that was a fair description of what it did. 22 drops in the eight DARK
// thinking-move inks plus Wesley gold, multiply-blended, means every overlap of two unrelated
// hues (dark red over olive over navy) resolves toward brown. The 46 outward-flung specks were
// literally splatter. Both are gone.
//
// What replaces them: nine LARGE, PALE washes in one cool analogous family plus a single warm
// gold, so multiply overlaps deepen in-family instead of going to sludge. No pooled core layer
// (that dark centre was the "mud dot"), no specks, no radial burst from the middle. They bleed
// open slowly across the whole page, drift gently upward like ink released into still water,
// and dry away. No-op under reduced motion.
function fireInkBloom() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const c = document.createElement("canvas");
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  // The canvas multiplies into the page as ONE layer (CSS), and the washes inside it blend
  // normally with each other. Doing the multiply per-shape inside the canvas instead made every
  // soft edge sprout a bright white rim: multiply against a near-transparent destination reads
  // that destination as white, so wherever two feathered washes met they drew an outline.
  c.style.cssText = "position:fixed;inset:0;pointer-events:none;z-index:120;mix-blend-mode:multiply";
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  // Tints, not inks. Adjacent on the wheel (blue -> periwinkle -> violet, with teal and sage
  // bridging), so any two multiplied together stay in the same cool family. The gold is the one
  // warm note and appears once.
  // Mid-tone, not pale: multiply darkens by the pigment, so a very light wash over light paper
  // leaves almost no mark at all (measured — a pass at #93AEDB/0.075 alpha was invisible).
  // Four hues only, all adjacent bar the gold. Six hues (violet and sage included) turned every
  // three-way overlap grey, which is the mud problem coming back by a longer road.
  const INKS = ["#5E86C6", "#5FA3AE", "#7C86CE", "#D8BC72", "#5FA3AE", "#5E86C6"];
  const R = Math.max(w, h);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2, PTS = 26;
  // A ring of radius multipliers — real watercolour never lands as a circle, so each blob is drawn
  // through these instead of arced. Three low harmonics with random phase, NOT 13 independent
  // random radii: independent radii made spiky rounded-polygon blobs (the second attempt looked
  // like heptagons), harmonics stay organic however few points you draw through.
  const ring = () => {
    const p2 = rnd(0, TAU), p3 = rnd(0, TAU), p5 = rnd(0, TAU);
    const k2 = rnd(0.06, 0.15), k3 = rnd(0.04, 0.10), k5 = rnd(0.02, 0.06);
    return Array.from({ length: PTS }, (_, i) => {
      const a = (i / PTS) * TAU;
      return 1 + k2 * Math.sin(2 * a + p2) + k3 * Math.sin(3 * a + p3) + k5 * Math.sin(5 * a + p5);
    });
  };
  // Six washes on fixed, well-separated slots rather than a burst from the centre — a burst
  // radiating from one point is the shape of an explosion, and an explosion is never serene.
  // Fixed slots matter: nine free-floating screen-sized washes merged into a single slab of
  // blue fog covering the page, which is no better than the splatter it replaced. These are
  // deliberately smaller than that, with paper left breathing between them.
  const SLOTS = [[0.13, 0.30], [0.34, 0.74], [0.52, 0.17], [0.69, 0.79], [0.86, 0.35], [0.96, 0.72]];
  const blooms = SLOTS.map((s, i) => ({
    x: w * (s[0] + rnd(-0.04, 0.04)),
    y: h * (s[1] + rnd(-0.06, 0.06)),
    rMax: rnd(0.085, 0.125) * R,
    rings: [ring(), ring()],
    // Two layers, offset so they don't read as onion rings. There is deliberately no third
    // "pooled core" layer: that dark centre is what made each drop a splat.
    offs: [[0, 0], [rnd(-0.12, 0.12), rnd(-0.12, 0.12)]],
    squash: rnd(0.82, 1.0), lean: rnd(-0.4, 0.4),
    delay: rnd(0, 1.3), col: INKS[i % INKS.length],
  }));
  // One wobbly closed blob for layer `li`, smoothed through its ring of radius multipliers.
  const blob = (g2, b, li, lr, cx, cy) => {
    const rr = b.rings[li], n = rr.length, pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + b.lean, m = rr[i] * lr;
      pts.push([cx + Math.cos(a) * m, cy + Math.sin(a) * m * b.squash]);
    }
    g2.beginPath();
    g2.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
    for (let i = 0; i < n; i++) {
      const nx = pts[(i + 1) % n];
      g2.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + nx[0]) / 2, (pts[i][1] + nx[1]) / 2);
    }
    g2.closePath(); g2.fill();
  };
  /* Each wash is pre-rendered ONCE as a blurred sprite, then just scaled up each frame.
     A radial gradient clipped by the wobbly path cannot be both organic and soft-edged: whatever
     opacity the gradient still carries where the path cuts it becomes a hard rim, and pulling the
     gradient in far enough to avoid that throws away the wobble and leaves a plain circle. Both
     were tried; the shapes came out looking like cut paper. Blurring the filled path instead
     softens the real outline, which is what pigment creeping into damp paper actually looks like.
     Doing it once per wash rather than per frame keeps a 4-second animation cheap. */
  const PAD = 1.42; // sprite half-width as a multiple of rMax, room for the blur to fall off in
  blooms.forEach(b => {
    const S = Math.ceil(b.rMax * 2 * PAD), c0 = S / 2;
    const sc = document.createElement("canvas"); sc.width = S; sc.height = S;
    const g2 = sc.getContext("2d");
    g2.fillStyle = b.col;
    // Outer wash: full width, softest edge.
    g2.filter = "blur(" + (b.rMax * 0.20).toFixed(2) + "px)";
    g2.globalAlpha = 0.55;
    blob(g2, b, 0, b.rMax, c0, c0);
    // Inner body: denser, offset so the two don't read as concentric rings.
    g2.filter = "blur(" + (b.rMax * 0.14).toFixed(2) + "px)";
    g2.globalAlpha = 0.42;
    blob(g2, b, 1, b.rMax * 0.66, c0 + b.offs[1][0] * b.rMax, c0 + b.offs[1][1] * b.rMax);
    b.sprite = sc;
  });
  const DUR = 4.4, FADE = 1.8, SPREAD = 2.4, PEAK = 0.42;
  const t0 = performance.now();
  (function tick(t) {
    const el = (t - t0) / 1000;
    const dry = Math.min(1, Math.max(0, (el - (DUR - FADE)) / FADE)); // dries away slowly at the end
    ctx.clearRect(0, 0, w, h);
    blooms.forEach(b => {
      const p = Math.min(1, (el - b.delay) / SPREAD);
      if (p <= 0) return;
      const ease = 1 - Math.pow(1 - p, 2);       // opens steadily, then creeps — no snap
      const r = b.rMax * ease;
      if (r < 1) return;
      const lift = -R * 0.045 * ease;            // the whole wash rises as it opens
      const half = r * PAD;
      ctx.globalAlpha = PEAK * (1 - dry);
      ctx.drawImage(b.sprite, b.x - half, b.y + lift - half, half * 2, half * 2);
    });
    if (el < DUR) requestAnimationFrame(tick); else c.remove();
  })(t0);
}

/* ------------------------------ App ------------------------------ */

function MediaCarousel({ items, index, setIndex }) {
  const n = items.length;
  const clamp = (i) => (i + n) % n;
  const go = (d) => setIndex(i => clamp(i + d));
  const drag = React.useRef(null);
  if (!n) return null;
  const it = items[Math.min(index, n - 1)];
  return (
    <div className="reel" tabIndex={0} role="group" aria-label={`Stimulus ${index + 1} of ${n}`}
      onKeyDown={e => { if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); } if (e.key === "ArrowRight") { e.preventDefault(); go(1); } }}
      onPointerDown={e => { drag.current = e.clientX; }}
      onPointerUp={e => { if (drag.current != null) { const dx = e.clientX - drag.current; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); } drag.current = null; }}>
      <div className="reel-frame">
        {it.kind === "image"
          ? <img src={it.dataUrl} alt={"Stimulus " + (index + 1) + ": " + it.name} />
          : it.kind === "youtube"
            ? <iframe src={"https://www.youtube.com/embed/" + it.youtubeId} title={it.name}
                style={{ width: "100%", height: "100%", border: 0 }}
                allow="encrypted-media; picture-in-picture" allowFullScreen />
            : <video src={it.dataUrl || undefined} poster={it.poster} controls playsInline />}
        {n > 1 && <React.Fragment>
          <button type="button" className="reel-arrow left" aria-label="Previous item" onClick={() => go(-1)}>‹</button>
          <button type="button" className="reel-arrow right" aria-label="Next item" onClick={() => go(1)}>›</button>
        </React.Fragment>}
      </div>
      {n > 1 && <div className="reel-dots">
        {items.map((m, i) => <button key={m.id} type="button" className={"dot" + (i === index ? " on" : "")} aria-label={"Go to " + ((m.kind === "video" || m.kind === "youtube") ? "video " : "image ") + (i + 1)} aria-current={i === index ? "true" : "false"} onClick={() => setIndex(i)} />)}
      </div>}
      {n > 1 && <div className="sr-only" aria-live="polite">{`Stimulus ${index + 1} of ${n}`}</div>}
    </div>
  );
}

/* ---------------------- Zoom In: the reveal (crop) tool ----------------------
   Zoom In is the one routine whose method IS what the class can see: reveal a sliver, take a
   hypothesis, reveal more, and only then show the whole picture (Nathan, 2026-07-30 — before this
   the deck put the entire photo on slide 1, which gives the game away on the routine's first move).
   Frames are normalised rects (0-1 of the photo) so they hold at any display or export size, and
   the whole picture is always the last reveal, never one of the frames. */
const REVEAL_MAX_FRAMES = 3;
const DEFAULT_REVEAL_FRAMES = [{ x: 0.36, y: 0.36, w: 0.28, h: 0.28 }, { x: 0.2, y: 0.2, w: 0.6, h: 0.6 }];
const clampFrame = (r) => {
  const w = Math.min(1, Math.max(0.08, r.w)), h = Math.min(1, Math.max(0.08, r.h));
  return { x: +Math.min(1 - w, Math.max(0, r.x)).toFixed(4), y: +Math.min(1 - h, Math.max(0, r.y)).toFixed(4), w: +w.toFixed(4), h: +h.toFixed(4) };
};
// A frame drawn as a CSS-cropped thumbnail (no canvas work for the on-screen previews).
const revealThumbStyle = (src, r) => ({
  backgroundImage: "url(" + src + ")",
  backgroundSize: (100 / Math.max(0.02, r.w)).toFixed(1) + "% " + (100 / Math.max(0.02, r.h)).toFixed(1) + "%",
  backgroundPosition: (r.w >= 1 ? 50 : (r.x / (1 - r.w)) * 100).toFixed(1) + "% " + (r.h >= 1 ? 50 : (r.y / (1 - r.h)) * 100).toFixed(1) + "%",
});
// Bake a crop into a fresh JPEG. Deliberately NOT pptxgenjs `sizing:{type:"crop"}`: that keeps the
// whole photo inside the .pptx (a student can drag the frame open and spoil the reveal) and it
// stretches the picture the same way sizing:"contain" does. Resolves null if the canvas can't be
// read (a cross-origin lead image taints it), and the caller then leaves the deck untouched.
function cropImageToDataUrl(src, r, maxW = 1600) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      try {
        const nw = im.naturalWidth, nh = im.naturalHeight;
        const sx = Math.max(0, Math.round(r.x * nw)), sy = Math.max(0, Math.round(r.y * nh));
        const sw = Math.max(1, Math.min(nw - sx, Math.round(r.w * nw)));
        const sh = Math.max(1, Math.min(nh - sy, Math.round(r.h * nh)));
        const k = Math.min(1, maxW / sw);
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(sw * k));
        cv.height = Math.max(1, Math.round(sh * k));
        cv.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
        res({ dataUrl: cv.toDataURL("image/jpeg", 0.86), aspect: cv.width / cv.height });
      } catch (_) { res(null); }
    };
    im.onerror = () => res(null);
    im.src = src;
  });
}

// The crop tool itself. Drag on the photo to draw the selected frame; the frame is also focusable
// so arrow keys move it and +/- resize it (Smaller/Bigger do the same), because a drag-only crop
// tool can't be used from a keyboard.
function RevealEditor({ src, frames, setFrames, idx, setIdx }) {
  const stageRef = React.useRef(null);
  const dragRef = React.useRef(null);
  const cur = frames[idx] || frames[0];
  const write = (r) => setFrames(frames.map((f, i) => (i === idx ? clampFrame(r) : f)));
  const at = (e) => {
    const b = stageRef.current.getBoundingClientRect();
    return { x: Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)), y: Math.min(1, Math.max(0, (e.clientY - b.top) / b.height)) };
  };
  const onDown = (e) => {
    if (e.button) return;
    if (stageRef.current.setPointerCapture) stageRef.current.setPointerCapture(e.pointerId);
    dragRef.current = at(e);
  };
  const onMove = (e) => {
    if (!dragRef.current) return;
    const a = dragRef.current, b = at(e);
    const r = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y) };
    if (r.w > 0.03 && r.h > 0.03) write(r);
  };
  const onUp = () => { dragRef.current = null; };
  const resize = (k) => { const w = cur.w * k, h = cur.h * k; write({ x: cur.x + (cur.w - w) / 2, y: cur.y + (cur.h - h) / 2, w, h }); };
  const onKey = (e) => {
    const d = e.shiftKey ? 0.1 : 0.02;
    const act = { ArrowLeft: () => write({ ...cur, x: cur.x - d }), ArrowRight: () => write({ ...cur, x: cur.x + d }),
                  ArrowUp: () => write({ ...cur, y: cur.y - d }), ArrowDown: () => write({ ...cur, y: cur.y + d }),
                  "+": () => resize(1.12), "=": () => resize(1.12), "-": () => resize(0.9) }[e.key];
    if (act) { e.preventDefault(); act(); }
  };
  const pct = (v) => (v * 100).toFixed(2) + "%";
  const frameLabel = (i) => (i === 0 ? "First look" : "Reveal " + (i + 1));
  return (
    <div className="rv-wrap">
      <div className="rv-strip">
        {frames.map((f, i) => (
          <button key={i} type="button" className={"rv-thumb" + (i === idx ? " on" : "")} aria-pressed={i === idx}
            onClick={() => setIdx(i)}>
            <span className="rv-thumb-img" style={revealThumbStyle(src, f)} aria-hidden="true" />
            <span className="rv-thumb-lab">{frameLabel(i)}</span>
          </button>
        ))}
        <span className="rv-thumb fixed">
          <span className="rv-thumb-img" style={revealThumbStyle(src, { x: 0, y: 0, w: 1, h: 1 })} aria-hidden="true" />
          <span className="rv-thumb-lab">Whole picture</span>
        </span>
      </div>
      <div className="rv-stage" ref={stageRef} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}>
        <img src={src} alt="" draggable="false" />
        <div className="rv-hole" style={{ left: pct(cur.x), top: pct(cur.y), width: pct(cur.w), height: pct(cur.h) }}
          tabIndex={0} role="group" onKeyDown={onKey}
          aria-label={frameLabel(idx) + ": the part of the picture students see. Arrow keys move it, plus and minus change its size."} />
      </div>
      <div className="rv-ctl">
        <button type="button" className="rv-btn" onClick={() => resize(0.9)}>− Smaller</button>
        <button type="button" className="rv-btn" onClick={() => resize(1.12)}>+ Bigger</button>
        <button type="button" className="rv-btn" disabled={frames.length >= REVEAL_MAX_FRAMES}
          onClick={() => { setFrames(frames.concat([clampFrame({ x: 0.12, y: 0.12, w: 0.76, h: 0.76 })])); setIdx(frames.length); }}>+ Add a reveal</button>
        <button type="button" className="rv-btn" disabled={frames.length < 2}
          onClick={() => { setFrames(frames.filter((_, i) => i !== idx)); setIdx(Math.max(0, idx - 1)); }}>Remove this one</button>
        <button type="button" className="rv-btn" onClick={() => { setFrames(DEFAULT_REVEAL_FRAMES.map(r => ({ ...r }))); setIdx(0); }}>Start again</button>
      </div>
      <p className="bx-note rv-help">Drag on the picture to draw the frame students see. Slide 1 shows the <b>first look</b> only, each reveal after it is its own slide, and the whole picture comes last. If you added more than one photo, the reveal uses the first one.</p>
    </div>
  );
}

const KEY_STORE = "sb_passcode";

// Admin-analytics password popup. Validates the password against the server before
// leaving Springboard, so a wrong password keeps the teacher on this page instead of
// bouncing to the stats gate. On success it stashes the password for stats.html (same
// sessionStorage key that page auto-loads from) and navigates there in the same tab.
function AdminGate({ onClose }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  React.useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  React.useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);

  async function submit(e) {
    e.preventDefault();
    const p = pw.trim();
    if (!p) { setErr("Enter the admin password."); return; }
    setErr(""); setBusy(true);
    try {
      const res = await fetch(API_BASE + "/api/stats", { method: "POST", headers: { "x-sb-admin": p } });
      if (res.status === 401) { setErr("Wrong password."); setBusy(false); return; }
      if (!res.ok) { setErr("Couldn't reach the server. Try again."); setBusy(false); return; }
      try { sessionStorage.setItem("sb_admin", p); } catch (_) {}
      window.location.href = "stats.html";
    } catch (_) {
      setErr("Couldn't reach the server. Try again."); setBusy(false);
    }
  }

  return (
    <div className="modal-backdrop" onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal" role="dialog" aria-modal="true" aria-labelledby="adminGateTitle">
        <div className="modal-head">
          <h2 id="adminGateTitle">Admin analytics</h2>
          <button type="button" className="iconbtn" aria-label="Close" onClick={onClose}><Icon d={I.close} size={14} stroke /></button>
        </div>
        <p className="modal-sub">Enter the admin password to view usage analytics.</p>
        <form onSubmit={submit}>
          <input ref={inputRef} type="password" autoComplete="current-password" value={pw}
            onChange={e => setPw(e.target.value)} placeholder="Admin password" aria-label="Admin password"
            aria-invalid={err ? "true" : undefined} />
          {err ? <p className="modal-err" role="alert">{err}</p> : null}
          <div className="modal-actions">
            <button type="button" className="btn ghost" onClick={onClose}>Cancel</button>
            <button type="submit" className="btn primary" disabled={busy}>{busy ? "Checking…" : "Open analytics"}</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ---- YouTube online-video post-processing ----
   Same marked-poster trick as SharePoint videos above, but simpler markup:
   current PowerPoint represents a YouTube clip as an ordinary poster pic whose
   nvPr carries <a:videoFile r:link> to an EXTERNAL video relationship targeting
   the youtube.com/embed/<id> URL, plus an interactive click-to-toggle timing
   block. No p14:media / p15:webVideoPr. Desktop AND web PowerPoint play it; the
   clip streams live from YouTube, so no download, no bot-block. Ground truth
   captured from PowerPoint's own AddMediaObjectFromEmbedTag output and verified
   on SharePoint web (docs/superpowers/notes/2026-07-17-youtube-ooxml-groundtruth.md).
   Click-to-play by design: interactive togglePause timing, NOT autoplay. */
const YT_MARK_PREFIX = "TSG-YT::";
// EXACT timing PowerPoint writes for an online video (click-to-toggle + media
// node). Copied verbatim from docs/superpowers/notes/yt-timing-template.xml —
// never hand-edit (one dropped tag hard-corrupts the file; spike lesson).
const YT_TIMING_TEMPLATE = `<p:timing><p:tnLst><p:par><p:cTn id="1" dur="indefinite" restart="never" nodeType="tmRoot"><p:childTnLst><p:seq concurrent="1" nextAc="seek"><p:cTn id="2" restart="whenNotActive" fill="hold" evtFilter="cancelBubble" nodeType="interactiveSeq"><p:stCondLst><p:cond evt="onClick" delay="0"><p:tgtEl><p:spTgt spid="SPID_PLACEHOLDER"/></p:tgtEl></p:cond></p:stCondLst><p:endSync evt="end" delay="0"><p:rtn val="all"/></p:endSync><p:childTnLst><p:par><p:cTn id="3" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst><p:par><p:cTn id="4" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst><p:par><p:cTn id="5" presetID="2" presetClass="mediacall" presetSubtype="0" fill="hold" nodeType="clickEffect"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst><p:cmd type="call" cmd="togglePause"><p:cBhvr><p:cTn id="6" dur="1" fill="hold"/><p:tgtEl><p:spTgt spid="SPID_PLACEHOLDER"/></p:tgtEl></p:cBhvr></p:cmd></p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn><p:nextCondLst><p:cond evt="onClick" delay="0"><p:tgtEl><p:spTgt spid="SPID_PLACEHOLDER"/></p:tgtEl></p:cond></p:nextCondLst></p:seq><p:video><p:cMediaNode vol="80000"><p:cTn id="7" fill="hold" display="0"><p:stCondLst><p:cond delay="indefinite"/></p:stCondLst></p:cTn><p:tgtEl><p:spTgt spid="SPID_PLACEHOLDER"/></p:tgtEl></p:cMediaNode></p:video></p:childTnLst></p:cTn></p:par></p:tnLst></p:timing>`;
async function injectYouTubeVideos(blob, ytMarks) {
  if (!ytMarks.length || typeof JSZip === "undefined") return blob;
  const zip = await JSZip.loadAsync(blob);
  const slidePaths = Object.keys(zip.files).filter(p => /^ppt\/slides\/slide\d+\.xml$/.test(p));
  for (const sp of slidePaths) {
    let xml = await zip.file(sp).async("string");
    if (xml.indexOf(YT_MARK_PREFIX) === -1) continue;
    const relPath = sp.replace(/slides\/(slide\d+)\.xml$/, "slides/_rels/$1.xml.rels");
    let rels = await zip.file(relPath).async("string");
    let relSeq = 0;
    let lastYtSpid = null;
    xml = xml.replace(/<p:pic>[\s\S]*?<\/p:pic>/g, (pic) => {
      const m = pic.match(/descr="TSG-YT::([^"]+)"/);
      if (!m) return pic;
      const id = m[1];
      const idm = pic.match(/<p:cNvPr\s+id="(\d+)"/);
      if (idm) lastYtSpid = idm[1];
      const rid = "rIdYt" + (++relSeq);
      rels = rels.replace("</Relationships>",
        `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/video" Target="https://www.youtube.com/embed/${id}?feature=oembed" TargetMode="External"/></Relationships>`);
      let p = pic.replace(/\s*descr="TSG-YT::[^"]+"/, "");
      p = p.replace(/(<p:cNvPr\b[^>]*?)(\/>|>)/, (full, head, close) => {
        if (close === "/>") return head + '><a:hlinkClick r:id="" action="ppaction://media"/></p:cNvPr>';
        return head + '><a:hlinkClick r:id="" action="ppaction://media"/>';
      });
      const vf = `<a:videoFile r:link="${rid}"/>`;
      if (/<p:nvPr\s*\/>/.test(p)) p = p.replace(/<p:nvPr\s*\/>/, `<p:nvPr>${vf}</p:nvPr>`);
      else if (/<p:nvPr>[\s\S]*?<\/p:nvPr>/.test(p)) p = p.replace(/<\/p:nvPr>/, `${vf}</p:nvPr>`);
      else p = p.replace(/<\/p:nvPicPr>/, `<p:nvPr>${vf}</p:nvPr></p:nvPicPr>`);
      return p;
    });
    // Click-to-play wiring: interactive togglePause timing targeting the video pic.
    // (One reel item per slide, so a YouTube slide never also carries the
    // SharePoint autoplay timing injected by injectOnlineVideos above.)
    if (lastYtSpid) {
      const timing = YT_TIMING_TEMPLATE.replace(/SPID_PLACEHOLDER/g, lastYtSpid);
      xml = xml.replace(/<\/p:sld>/, timing + "</p:sld>");
    }
    zip.file(sp, xml);
    zip.file(relPath, rels);
  }
  return await zip.generateAsync({ type: "blob" });
}

/* ---- THINK slide animations: click-to-start countdown + click-to-reveal ----
   PptxGenJS cannot write animations, so the shapes are drawn as ordinary shapes carrying an
   objectName marker and the timing XML is spliced in afterwards, exactly like the YouTube pass
   above. The XML is NOT hand-invented: it was captured from PowerPoint's own output over COM and
   is recorded verbatim in docs/superpowers/notes/2026-07-30-anim-timing-groundtruth.md (which also
   documents that durations are milliseconds and that presetSubtype 8 = wipe(left)).

   Both effects hang off an interactiveSeq (a click on a NAMED shape) rather than the main sequence.
   That matters in class: a main-sequence effect would swallow the teacher's first ordinary click,
   so pressing on to REFLECT would instead start the timer. This way a click anywhere still advances
   the slide, and only clicking the bar (or the reveal pill) fires the effect. */
const SB_CLOCK_MARK = "SB-CLOCK";           // objectName is "SB-CLOCK::<secondsRemaining>"
const SB_TIMERBTN_MARK = "SB-TIMERBTN";     // objectName is "SB-TIMERBTN::<totalSeconds>"
const SB_REVEAL_TRIGGER = "SB-REVEAL-TRIGGER";
const SB_REVEAL_BODY = "SB-REVEAL-BODY";
const TIMER_PRESETS = [1, 2, 3, 5];         // minutes offered on the slide
const TIMER_MAX_SEC = Math.max(...TIMER_PRESETS) * 60;
// The clock ticks once a SECOND. 301 labels, ~700KB on the THINK slide, and a warm PowerPoint
// opens it in ~80ms (measured 2026-07-31; an earlier "10.8s" reading was PowerPoint's own cold
// start sitting inside the stopwatch, not the file).
const TIMER_STEP_SEC = 1;
const mmss = sec => Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
// One interactive sequence: clicking TRIGGER runs EFFECT (already id-substituted) on its target.
const sbInteractiveSeq = (id, triggerSpid, effectXml, restart = "whenNotActive") =>
  `<p:seq concurrent="1" nextAc="seek"><p:cTn id="${id}" restart="${restart}" fill="hold" evtFilter="cancelBubble" nodeType="interactiveSeq"><p:stCondLst><p:cond evt="onClick" delay="0"><p:tgtEl><p:spTgt spid="${triggerSpid}"/></p:tgtEl></p:cond></p:stCondLst><p:endSync evt="end" delay="0"><p:rtn val="all"/></p:endSync><p:childTnLst><p:par><p:cTn id="${id + 1}" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst><p:par><p:cTn id="${id + 2}" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst>${effectXml}</p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn><p:nextCondLst><p:cond evt="onClick" delay="0"><p:tgtEl><p:spTgt spid="${triggerSpid}"/></p:tgtEl></p:cond></p:nextCondLst></p:seq>`;
// Appear (entrance): the target is invisible in the slideshow until this fires. It stays visible in
// the normal editing view, which is what we want — the teacher reads the reveal while planning.
const sbAppearEffect = (id, spid) =>
  `<p:par><p:cTn id="${id}" presetID="1" presetClass="entr" presetSubtype="0" fill="hold" grpId="0" nodeType="clickEffect"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst><p:set><p:cBhvr><p:cTn id="${id + 1}" dur="1" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst></p:cTn><p:tgtEl><p:spTgt spid="${spid}"/></p:tgtEl><p:attrNameLst><p:attrName>style.visibility</p:attrName></p:attrNameLst></p:cBhvr><p:to><p:strVal val="visible"/></p:to></p:set></p:childTnLst></p:cTn></p:par>`;
// One clock tick: show/hide a single MM:SS label at a fixed delay after the preset was clicked.
// grp is the preset's build group — sharing grpId="0" across presets makes PowerPoint hand each
// label to whichever preset claims it first and silently truncate the rest (measured in the spike:
// the 2 min preset stopped at 1:01, the 3 min at 2:01).
const sbClockStep = (id, spid, ms, show, first, grp) =>
  `<p:par><p:cTn id="${id}" presetID="1" presetClass="${show ? "entr" : "exit"}" presetSubtype="0" fill="hold" grpId="${grp}" nodeType="${first ? "clickEffect" : "withEffect"}"><p:stCondLst><p:cond delay="${ms}"/></p:stCondLst><p:childTnLst><p:set><p:cBhvr><p:cTn id="${id + 1}" dur="1" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst></p:cTn><p:tgtEl><p:spTgt spid="${spid}"/></p:tgtEl><p:attrNameLst><p:attrName>style.visibility</p:attrName></p:attrNameLst></p:cBhvr><p:to><p:strVal val="${show ? "visible" : "hidden"}"/></p:to></p:set></p:childTnLst></p:cTn></p:par>`;

async function injectThinkAnimations(blob) {
  if (typeof JSZip === "undefined") return blob;
  const zip = await JSZip.loadAsync(blob);
  const slidePaths = Object.keys(zip.files).filter(p => /^ppt\/slides\/slide\d+\.xml$/.test(p));
  for (const sp of slidePaths) {
    let xml = await zip.file(sp).async("string");
    if (xml.indexOf(SB_CLOCK_MARK) === -1 && xml.indexOf(SB_REVEAL_TRIGGER) === -1) continue;
    const idOf = (name) => {
      const m = xml.match(new RegExp('<p:cNvPr id="(\\d+)" name="' + name + '(?:::(\\d+))?"'));
      return m ? { spid: m[1], arg: m[2] } : null;
    };
    const allOf = (name) => [...xml.matchAll(new RegExp('<p:cNvPr id="(\\d+)" name="' + name + '::(\\d+)"', "g"))]
      .map(m => ({ spid: m[1], arg: +m[2] }));
    const trig = idOf(SB_REVEAL_TRIGGER), body = idOf(SB_REVEAL_BODY);
    // Start our ids above anything already in the file: the YouTube pass may have written a timing
    // block on this slide, and two nodes sharing a cTn id is a corrupt deck.
    // Starts at 2, never 1: on a slide with no timing yet the wrapper we write below owns id 1 for
    // its tmRoot, and two nodes sharing an id makes PowerPoint repair the file on open.
    let nextId = 2;
    for (const m of xml.matchAll(/<p:cTn id="(\d+)"/g)) nextId = Math.max(nextId, +m[1] + 1);
    // builds can repeat a spid: the 0:00 label is listed once by each preset's leading hide and
    // again when that preset's countdown reaches zero. Deduped at every join site below.
    const seqs = [], builds = [];
    // One click sequence per preset button, each stepping the shared stack of MM:SS labels.
    // Each step shows its own label and hides the one before it, so when a run finishes only the
    // 0:00 label is left visible; the next run's first act is to hide that, leaving the resting
    // label showing until its own first tick. Without the hide-the-previous pass the stack ends up
    // fully visible with 0:00 on top, and the next preset would surface 0:01 instead of its own
    // duration. restart="always" so a second preset can interrupt a running one.
    // Each preset needs its OWN grpId: sharing grpId="0" makes PowerPoint hand each label to
    // whichever preset claims it first and silently truncate the rest (measured in the spike --
    // the 2 min preset stopped at 1:01, the 3 min at 2:01, and no structural check caught it).
    // KNOWN LIMIT: changing preset UP mid-run (1 min at 0:30, then click 5 min) leaves the old
    // label covering the new one, because z-order puts smaller numbers on top. Changing down, or
    // changing once a run has finished, both work.
    const clocks = new Map(allOf(SB_CLOCK_MARK).map(c => [c.arg, c.spid]));
    const zero = clocks.get(0);
    let grp = 0;
    for (const btn of allOf(SB_TIMERBTN_MARK)) {
      const effects = [];
      let eid = nextId + 3;
      if (zero) {
        effects.push(sbClockStep(eid, zero, 0, false, true, grp + 8)); eid += 2;
        builds.push(`<p:bldP spid="${zero}" grpId="${grp + 8}"/>`);
      }
      for (let t = btn.arg; t >= 0; t -= TIMER_STEP_SEC) {
        const spid = clocks.get(t);
        if (!spid) continue;
        const at = (btn.arg - t) * 1000;
        effects.push(sbClockStep(eid, spid, at, true, !zero && t === btn.arg, grp)); eid += 2;
        builds.push(`<p:bldP spid="${spid}" grpId="${grp}"/>`);
        const prev = clocks.get(t + TIMER_STEP_SEC);
        // Exits live in their OWN build group: a label cannot carry both an entrance and an exit in
        // the same group, and PowerPoint silently dropped every hide when they shared one.
        if (prev && t + TIMER_STEP_SEC <= btn.arg) {
          effects.push(sbClockStep(eid, prev, at, false, false, grp + 8)); eid += 2;
          builds.push(`<p:bldP spid="${prev}" grpId="${grp + 8}"/>`);
        }
      }
      seqs.push(sbInteractiveSeq(nextId, btn.spid, effects.join(""), "always"));
      nextId = eid + 1;
      grp++;
    }
    if (trig && body) {
      seqs.push(sbInteractiveSeq(nextId, trig.spid, sbAppearEffect(nextId + 3, body.spid)));
      builds.push(`<p:bldP spid="${body.spid}" grpId="0"/>`);
      nextId += 5;
    }
    if (!seqs.length) continue;
    if (xml.indexOf("<p:timing>") !== -1) {
      // Merge into the timing this slide already has (a YouTube clip on the same slide), rather
      // than adding a second <p:timing> — one per slide is all the schema allows.
      xml = xml.replace(/<\/p:childTnLst><\/p:cTn><\/p:par><\/p:tnLst>/, seqs.join("") + "</p:childTnLst></p:cTn></p:par></p:tnLst>");
      xml = xml.indexOf("<p:bldLst>") !== -1
        ? xml.replace("</p:bldLst>", [...new Set(builds)].join("") + "</p:bldLst>")
        : xml.replace("</p:timing>", `<p:bldLst>${[...new Set(builds)].join("")}</p:bldLst></p:timing>`);
    } else {
      const timing = `<p:timing><p:tnLst><p:par><p:cTn id="1" dur="indefinite" restart="never" nodeType="tmRoot"><p:childTnLst>${seqs.join("")}</p:childTnLst></p:cTn></p:par></p:tnLst><p:bldLst>${[...new Set(builds)].join("")}</p:bldLst></p:timing>`;
      xml = xml.replace(/<\/p:sld>/, timing + "</p:sld>");
    }
    // The marker did its job; leave a clean shape name behind in the finished deck.
    xml = xml.replace(new RegExp('name="' + SB_CLOCK_MARK + '::\\d+"', "g"), 'name="Lesson timer"')
             .replace(new RegExp('name="' + SB_TIMERBTN_MARK + '::\\d+"', "g"), 'name="Timer preset"')
             .replace(new RegExp('name="' + SB_REVEAL_TRIGGER + '"'), 'name="Reveal button"')
             .replace(new RegExp('name="' + SB_REVEAL_BODY + '"'), 'name="Reveal"');
    zip.file(sp, xml);
  }
  return await zip.generateAsync({ type: "blob" });
}

// Minutes the teacher's "how to run it" line asks for ("Think-pair-share, 3 min" -> 3), clamped to
// something a lesson could actually use. Default 3 when the line doesn't say.
function thinkMinutes(structure) {
  const m = String(structure || "").match(/(\d+)\s*(?:-|–|to)?\s*(\d+)?\s*min/i);
  const n = m ? parseInt(m[2] || m[1], 10) : 3;
  return Math.max(1, Math.min(30, Number.isFinite(n) ? n : 3));
}

// Client-side twin of api/youtube-meta.js's youtubeVideoId() — keep the two in sync.
// (index.html ships standalone to GitHub Pages, so it can't import server code.)
function youtubeIdFromLink(raw) {
  let u;
  try { u = new URL(String(raw || "").trim()); } catch (_) { return ""; }
  if (u.protocol !== "https:" && u.protocol !== "http:") return "";
  const host = u.hostname.toLowerCase().replace(/^(www|m|music)\./, "");
  const parts = u.pathname.split("/").filter(Boolean);
  let id = "";
  if (host === "youtu.be") id = parts[0] || "";
  else if (host === "youtube.com" || host === "youtube-nocookie.com") {
    if (parts[0] === "watch") id = u.searchParams.get("v") || "";
    else if (["shorts", "live", "embed", "v"].includes(parts[0])) id = parts[1] || "";
  }
  return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : "";
}

// Bake a play badge into a 16:9 cover-cropped copy of the thumbnail so the item
// never reads as "just a photo" — in the reel, on the slide, anywhere the poster
// shows. Empty/broken input -> dark placeholder with the badge alone.
async function addPlayBadge(dataUrl) {
  const W = 640, H = 360;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = "#111111"; x.fillRect(0, 0, W, H);
  if (dataUrl) {
    const im = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = dataUrl; });
    if (im && im.naturalWidth && im.naturalHeight) {
      const ar = im.naturalWidth / im.naturalHeight, box = W / H;
      let sw = im.naturalWidth, sh = im.naturalHeight, sx = 0, sy = 0;
      if (ar > box) { sw = sh * box; sx = (im.naturalWidth - sw) / 2; }
      else { sh = sw / box; sy = (im.naturalHeight - sh) / 2; }
      x.drawImage(im, sx, sy, sw, sh, 0, 0, W, H);
    }
  }
  x.fillStyle = "rgba(0,0,0,0.55)"; x.beginPath(); x.arc(W / 2, H / 2, 46, 0, Math.PI * 2); x.fill();
  x.strokeStyle = "rgba(255,255,255,0.9)"; x.lineWidth = 3; x.stroke();
  x.fillStyle = "#FFFFFF"; x.beginPath();
  x.moveTo(W / 2 - 14, H / 2 - 22); x.lineTo(W / 2 + 24, H / 2); x.lineTo(W / 2 - 14, H / 2 + 22);
  x.closePath(); x.fill();
  return c.toDataURL("image/jpeg", 0.9);
}

  "Build Explanations":                   { bx: 0.150, by: 0.68, lx: 0.150, ly: 0.815, bloom: "green",      dark: "#3f5c38", c: -0.10 },
  "Consider Different Viewpoints":        { bx: 0.385, by: 0.81, lx: 0.385, ly: 0.945, bloom: "yellow",     dark: "#7A5012", c: 0.08 },
  "Make Connections":                     { bx: 0.625, by: 0.81, lx: 0.625, ly: 0.945, bloom: "orange",     dark: "#8A4B12", c: -0.08 },
  "Describe What's There":                { bx: 0.850, by: 0.68, lx: 0.845, ly: 0.815, bloom: "periwinkle", dark: "#4242A1", c: 0.10 },
};
// The central PALE/UNLIT neuron every other neuron's axon runs into (see inside.png — it's
// Hub (gold bloom) and title lockup — same viewport-fraction convention as IMG_MOVE_POS.
const BX_CENTER = { bx: 0.5, by: 0.52 };  // the gold hub bloom every cord runs into
const BX_TITLE = { bx: 0.5, by: 0.5 };    // the map's name IS the centrepiece — large, dead centre, the eight blooms orbit it (no hub splotch)
// Viewport-fraction -> stage px (the whole map is composed in code, no artwork mapping).
function bxStagePoint(stage, bx, by) {
  return { left: bx * stage.clientWidth, top: by * stage.clientHeight };
}

// Paper-world text tint: the move's AA-safe DARK ink (headings on the light chamber, label
// dots, pulse droplets). The old night-world lift-to-white is gone with the dark theme.
const bwTint = (name) => (IMG_MOVE_POS[name] && IMG_MOVE_POS[name].dark) || "#2B281F";
// Move colour as an rgba() at alpha `a` (e.g. the label pill's coloured border at 55%).
const bxColorRGBA = (name, a) => {
  const c = parseInt((BX_COLOR[name] || "#ffffff").slice(1), 16);
  return "rgba(" + (c >> 16) + "," + ((c >> 8) & 255) + "," + (c & 255) + "," + a + ")";
};

/* A curriculum item arrives as "AC9E7LA03 — identify and describe how texts are structured…".
   Leading with the code makes every row start on its least useful word, so the row is split
   and the code rendered as a tag on the end. VCE items carry no code — they come back whole
   and are rendered as-is. The tick value stays `it.text` either way, so nothing downstream
   (classInfo.focus, studyGuide.focus) sees this split. */
const splitFocusCode = (text) => {
  const m = /^([A-Z0-9.\-]{4,20})\s+[—–-]\s+([\s\S]+)$/.exec(String(text || "").trim());
  return m ? { code: m[1], desc: m[2] } : { code: "", desc: String(text || "").trim() };
};

function App() {

  const [activeBand, setActiveBand] = useState(null);// which generated deck is shown

  const [intentionAuto, setIntentionAuto] = useState(false);  // true while the box is deliberately blank (the build writes one)

  // Zoom In only: the crops the class sees before the whole picture, in reveal order (see

  const [outcomeMode, setOutcomeMode] = useState("paste");    // "paste" | "ai"
  const [suggests, setSuggests] = useState(null);             // [{outcome, why}] | null
  const [suggesting, setSuggesting] = useState(false);

  // Status for the article link row: {text, ok}. It lives HERE, beside the link box, because the

  const [error, setError] = useState("");
  const [rawDump, setRawDump] = useState("");
  const [spots, setSpots] = useState({});            // { [band]: deckObject }
  const [exporting, setExporting] = useState(false); // PowerPoint download in flight (drives button disabled)
  const busyRef = useRef({ exporting: false }); // synchronous re-entrancy guard (beats same-tick double-clicks before React re-renders)
  // Brain view renders the finished deck BELOW the three step panels, so a successful

  // Lesson editor: every textarea grows to fit its own text. The fields used to be fixed-height

  // wall of half-sentences (Nathan, 2026-07-31). Re-fit on deck change and on resize, because the

  const editWrapRef = useRef(null);

  // media reel

  const [mediaNote, setMediaNote] = useState(""); // soft inline status under the dropzone
  const [postLink, setPostLink] = useState("");       // paste-a-link box
  const [importingPost, setImportingPost] = useState(false); // link fetch in flight

  const mediaInput = useRef(null);
  const pdfInput = useRef(null);
  const bxPdfInput = useRef(null); // the brain chamber's own PDF picker (Classic keeps pdfInput)
  const genBtnRef = useRef(null);
  const genStimKey = useRef(""); // stimulus fingerprint at last successful generate (stale-deck hint)

  // Plain-English stage label beside the build percentage (the call isn't streamed, so

  // seconds while it plans (measured: 3,024 reasoning tokens before the first character), so a

  // Active band drives the (single) preview/edit/export view; before generation

  // If the active deck is a combined one, its cover/label reads "Middle & Senior".

  const bandLabel = activeCombo ? comboBandLabel(activeCombo) : bandLabelOf(band);

  // The preview/edit/export view is single-deck: `spot` is the active band's deck,
  // and `setSpot` (accepting a value OR a function updater, like the old useState
  // setter) writes back into the active band's slot of the spots map.

  // The 3 "ways to run the launch" (teacher notes only). Absent on decks the model
  // returned without them, so always read through this guard.
  const launchIdeas = (spot && spot.launch && Array.isArray(spot.launch.ideas)) ? spot.launch.ideas : [];
  const setSpot = (upd) => setSpots(all => {
    if (!activeBand) return all;
    const cur = all[activeBand] || null;
    const next = typeof upd === "function" ? upd(cur) : upd;
    return { ...all, [activeBand]: next };

  // Preview earns its column only once Generate is clicked (loading) or a deck exists;
  // before that the builder takes the full width (.layout.pre).
  const previewOpen = loading || Object.keys(spots).length > 0;

  // The Generate button sits at the bottom of the full-width form, so the teacher is
  // scrolled down when the preview column appears — jump back to the top so they see it.
  const prevPreviewOpen = useRef(false);
  React.useEffect(() => {

  // Stale-deck hint: fingerprint the stimulus so we can nudge "Regenerate" if it changed

  const stimKey = mode + "|" + media.length + "|" + (mode === "article" ? articleText.length : 0)
    + "|" + classInfo.curriculum + "|" + classInfo.subject + "|" + classInfo.yearLevel;
  const stimulusStale = Object.keys(spots).length > 0 && genStimKey.current && genStimKey.current !== stimKey;

  // Fire-and-forget analytics: logs event + context to the backend.
  // passcode/classInfo in scope; stimulusType derived from mode/media state by callers.
  function logEvent(event, extra = {}) {
    try {
      fetch(API_BASE + "/api/log", {
        method: "POST",

        }),

  // "Suggest connections" on the Outcome field: ask the AI for curriculum connections.

  // whole thing to generate. A blank box still works the old way (the build writes one).
  async function runSuggestIntention() {

  // Keep reelIndex in range whenever the reel shrinks.
  React.useEffect(() => { if (reelIndex > Math.max(0, media.length - 1)) setReelIndex(0); }, [media.length]);

  // Fetch the tickable curriculum items whenever a recognised VCE/AC subject is chosen.
  // Only the brain experience shows the focus panel, so skip the call behind Classic view.
  useEffect(() => {
    if (!brainView) { setFocusGroups([]); return; }
    const guide = vceStudyGuide(classInfo) || acStudyGuide(classInfo);
    if (!guide) { setFocusGroups([]); return; }
    let cancelled = false;
    (async () => {
      setFocusLoading(true); setFocusError("");
      try {
        const r = await fetch(API_BASE + "/api/guide", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-sb-passcode": passcode.trim() },

      } catch (_) {
        if (!cancelled) { setFocusGroups([]); setFocusError("Couldn't load the curriculum list — you can still make the lesson."); }
      } finally {
        if (!cancelled) setFocusLoading(false);
      }
    })();

  }, [classInfo.subject, classInfo.yearLevel, brainView]);

  /* ------- file handlers ------- */
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  // Intrinsic aspect (w/h) of an image data URL, so the PPTX export can letterbox it
  // correctly (pptxgenjs `sizing:contain` stretches; we compute contain ourselves).
  const imageAspect = (dataUrl) => new Promise(res => {
    const im = new Image();
    im.onload = () => res(im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : 0);
    im.onerror = () => res(0);
    im.src = dataUrl;
  });

  // In-flight codec-check/convert jobs (id -> Promise) so Download can wait them out.
  const videoPrepRef = React.useRef(new Map());

  // Check a freshly added clip's codec and re-encode it when PowerPoint couldn't play
  // it (Instagram/Facebook VP9 clips look fine in the browser and in desktop PowerPoint
  // but play sound over a blank frame in PowerPoint for the web). Runs in the
  // background so the teacher can keep working.
  async function prepareVideoForPpt(vidId, file) {
    const setIt = (patch) => setMedia(m => m.map(x => x.id === vidId ? { ...x, ...patch } : x));
    try {
      const codec = await sniffVideoCodec(file);
      if (!codec || codec === "h264") { setIt({ convertState: "done", convertPct: 100 }); return; }
      setIt({ convertState: "converting", convertPct: 0 });
      setMediaNote("This clip is in a format PowerPoint can't show — converting it now, keep working and it'll be ready by Download.");
      const out = await convertToPptVideo(file, pct => setIt({ convertPct: pct }));
      let dataUrl = "";
      if (out.size <= VIDEO_EMBED_MAX_BYTES) { try { dataUrl = await readFileAsDataURL(out); } catch (_) {} }
      setIt(Object.assign({ convertState: "done", convertPct: 100, convertedFrom: codec, name: out.name, sizeBytes: out.size },
                          dataUrl ? { dataUrl } : {}));
      setMediaNote("Converted that clip so it plays in PowerPoint ✓");
    } catch (_) {
      setIt({ convertState: "failed", convertPct: 0 });
      setMediaNote("Couldn't convert that clip automatically — in PowerPoint on the web it may play sound with no picture. Try a different clip.");
    }
  }

  async function addMediaFiles(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setError(""); setMediaNote("");
    const room = MAX_MEDIA - media.length;
    if (room <= 0) { setMediaNote(`That's the limit of ${MAX_MEDIA} items — remove one to add more.`); return; }
    const take = files.slice(0, room);
    if (files.length > room) setMediaNote(`Only added ${room} — a reel holds up to ${MAX_MEDIA} items.`);

    for (const f of take) {
      if (f.type.startsWith("image/")) {
        // TWO copies, deliberately. dataUrl stays at full camera resolution because the deck draws
        // from it and Zoom In crops a small region of it onto a whole slide — downscaling that
        // source makes the zoom slides soft (Nathan, 2026-08-03). smallUrl is the shrunk copy sent
        // to the model, which reads no more detail from a big image but is much slower to upload.
        try {
          const dataUrl = await readFileAsDataURL(f);
          const smallUrl = await downscaleDataUrl(dataUrl);
          const aspect = await imageAspect(dataUrl);
          setMedia(m => m.length >= MAX_MEDIA ? m : [...m, { id: newId(), kind: "image", dataUrl, smallUrl, name: f.name, aspect }]);
        }
        catch (_) { setError("Could not read image: " + f.name); }
      } else if (f.type.startsWith("video/")) {
        setExtractCount(c => c + 1);
        try {
          let dataUrl = "";
          if (f.size <= VIDEO_EMBED_MAX_BYTES) { try { dataUrl = await readFileAsDataURL(f); } catch (_) {} }
          const { frames, poster, width, height } = await extractVideoFrames(f, 4);
          const vidId = newId();
          setMedia(m => m.length >= MAX_MEDIA ? m : [...m, { id: vidId, kind: "video", dataUrl, name: f.name, sizeBytes: f.size,
            poster, aspect: width && height ? width / height : 0, frames, text: "", transcribeState: "running", transcribeNote: "",
            convertState: "checking", convertPct: 0 }]);
          if (!frames.length) setMediaNote("Couldn't read frames from " + f.name + " — add a description under its thumbnail. It will still embed in the PowerPoint.");
          else if (f.size > VIDEO_EMBED_MAX_BYTES) setMediaNote(`${f.name} is large (${formatBytes(f.size)}) — the deck will use its first frame (add a Link on the left for a clickable link + QR) instead of embedding.`);
          // Codec-check and, if PowerPoint couldn't play it, re-encode in the background.
          // The Download gate awaits this so a deck is never built from the original.
          const prep = prepareVideoForPpt(vidId, f);
          videoPrepRef.current.set(vidId, prep);
          prep.finally(() => videoPrepRef.current.delete(vidId));
          (async () => {
            try {
              const { text, truncated, discarded } = await transcribeMedia({ passcode: passcode.trim(), file: f });
              const note = truncated ? "(transcript truncated)"
                : discarded ? "no speech in this clip — frames will be used"
                : "";
              setMedia(m => m.map(x => x.id === vidId ? { ...x, text, transcribeState: "done", transcribeNote: note } : x));
            } catch (_) {
              setMedia(m => m.map(x => x.id === vidId ? { ...x, transcribeState: "failed", transcribeNote: "couldn't get transcript — frames will be used" } : x));
            }
          })();
        } catch (_) { setError("Could not read video: " + f.name); }
        finally { setExtractCount(c => c - 1); }
      }
    }
  }

  // Plenty of pasted links aren't social posts at all — a museum object page, a news story, a blog
  // post. The grabber can't touch those, but our own page reader can: take that page's lead image
  // and add it exactly like an upload. Throws with a teacher-readable message when it can't.
  async function importPageImage(url) {
    let image = "";
    try { image = (await readViaServer(url)).image; }     // data URL when the bytes came back
    catch (err) {
      // The reader's advice is written for the article box ("copy the text in") — in the photo box
      // only the picture matters, so say the picture half.
      const m = String(err.message || "");
      throw new Error(/real person/.test(m)
        ? "That site only opens for a real person's browser, so the app can't reach the picture. Open the page yourself, right-click the picture → Save image as… then drop that file here."
        : m);
    }
    if (!image) throw new Error("No picture on that page the app could use.");
    const dataUrl = /^data:/i.test(image) ? image : await urlToDataUrl(image);
    if (!dataUrl) throw new Error("Found a picture but that site wouldn't let the app download it.");
    return dataUrlToFile(dataUrl, "picture.jpg");
  }

  // Right-click a picture on ANY website -> "Copy image" -> press Ctrl+V here. The clipboard carries
  // the real bytes out of the teacher's own browser, so this works even on sites that answer every
  // server, reader service and image proxy with 403. In article mode the pasted picture becomes the
  // lead image (deliberately chosen, so a later text edit must not clear it — hence no
  // fetchedArticleRef stamp; see onArticleTextChange).
  React.useEffect(() => {
    const onPaste = async (e) => {
      const items = e.clipboardData ? Array.from(e.clipboardData.items || []) : [];
      const files = items.filter(it => it.kind === "file" && /^image\//i.test(it.type)).map(it => it.getAsFile()).filter(Boolean);
      if (!files.length) return;                        // ordinary text paste — leave it alone
      e.preventDefault();
      if (mode === "article") {
        try {
          setArticleImageUrl(await blobToDataUrl(files[0]));
          setArticleNote({ text: "Picture pasted in ✓", ok: true });
        } catch (_) { setArticleNote({ text: "Couldn't read that pasted picture. Try saving it and uploading the file.", ok: false }); }
        return;
      }
      await addMediaFiles(files);
      setMediaNote("Pasted picture added ✓");
    };
    document.addEventListener("paste", onPaste);
    return () => document.removeEventListener("paste", onPaste);
  }, [mode, media.length]);

  // When a site opens for nobody but a real person's browser, the words in its link are still
  // readable. Search Wikimedia Commons for the same subject and add that free picture instead,
  // naming it plainly so the teacher can throw it back if it's the wrong one. "" if nothing fits.
  async function tryFreeVersion(url) {
    const q = keywordsFromLink(url);
    if (!q) return "";
    const hit = await findFreeImage(q);
    if (!hit) return "";
    const dataUrl = await imageUrlToDataUrl(hit.url);
    if (!dataUrl) return "";
    await addMediaFiles([dataUrlToFile(dataUrl, "commons-picture.jpg")]);
    return `That site won't open for the app, so I found a free version on Wikimedia Commons: “${hit.title}”. Remove it if it isn't the right picture ✓`;
  }

  // Paste a post link -> Cobalt lists its media -> fetch each tunnel URL in the
  // browser -> feed through addMediaFiles (same path as the picker). YouTube routes
  // to its own metadata-only handler (Cobalt is bot-blocked on YouTube). Anything Cobalt can't
  // handle falls through to importPageImage, so an ordinary web page's photo still lands.
  // Every failure goes to mediaNote, NOT setError: the chamber only draws {error} inside step
  // three, so a setError here just snapped the button back to "Add from link" and said nothing.
  async function importFromPostLink(overrideUrl) {
    const pasted = (typeof overrideUrl === "string" ? overrideUrl : postLink).trim();
    setError(""); setMediaNote("");
    if (!/^https?:\/\//i.test(pasted)) { setMediaNote("Paste a full link starting with http(s):// first."); return; }
    if (MAX_MEDIA - media.length <= 0) { setMediaNote(`That's the limit of ${MAX_MEDIA} items — remove one to add more.`); return; }
    // Google's image viewer hides the real picture's address in ?imgurl= — unwrap it and carry on
    // as if the teacher had pasted that address, which is what they meant.
    const url = imageUrlFromSearchLink(pasted) || pasted;
    if (youtubeIdFromLink(url)) return importYouTubeLink(url);
    // Say what went wrong BEFORE the readers get to half-succeed on it. Nothing on a results-page
    // link names the picture, so guessing one and calling it "found" is worse than saying no.
    if (isSearchResultsPage(url)) {
      setMediaNote("That's a search results page, not a picture — the link doesn't say which image you were looking at. Right-click the picture itself and choose Copy image, then press Ctrl+V here. (Copy image address works too, and so does Save image as… plus Add pictures.)");
      return;
    }
    // A picture's own address: fetch the bytes and be done. Neither reader below can read one, so
    // without this the teacher who followed the advice above got told to follow it again.
    if (looksLikeImageUrl(url)) {
      setImportingPost(true);
      try {
        const dataUrl = await imageUrlToDataUrl(url);   // the host's own CORS first, then the proxy
        if (dataUrl) {
          await addMediaFiles([dataUrlToFile(dataUrl, "picture.jpg")]);
          setMediaNote("Grabbed that picture ✓");
          setPostLink("");
        } else {
          setMediaNote("That picture's address wouldn't open for the app. Right-click the picture ▸ Copy image, then press Ctrl+V here instead.");
        }
      } finally { setImportingPost(false); }
      return;
    }

    // Last resort for a link the grabber couldn't use: try it as a plain web page with a picture,
    // and if even that is walled, hunt for a free version of the same subject on Wikimedia Commons
    // using the words in the link itself (all the app can read when a site blocks every reader).
    const tryAsPage = async (grabberMsg) => {
      try {
        const file = await importPageImage(url);
        await addMediaFiles([file]);
        setMediaNote("Grabbed the picture from that page ✓");
        setPostLink("");
      } catch (pageErr) {
        const freeNote = await tryFreeVersion(url);
        setMediaNote(freeNote || grabberMsg || pageErr.message || "Couldn't get a photo or video from that link.");
        if (freeNote) setPostLink("");
      }
    };

    setImportingPost(true);
    try {
      const headers = { "Content-Type": "application/json" };
      if (passcode.trim()) headers["x-sb-passcode"] = passcode.trim();
      const resp = await fetch(API_BASE + "/api/fetch-post-media", { method: "POST", headers, body: JSON.stringify({ url }) });
      const data = await resp.json().catch(() => ({}));
      const items = resp.ok && Array.isArray(data.items) ? data.items : [];
      // A social-post failure (private, login-only, unsupported site) is worth saying out loud, but
      // only after the page reader has also had a go — for a museum or news page it's the wrong
      // diagnosis, so the page reader's own message wins when the grabber had nothing useful.
      if (!items.length) return await tryAsPage(/private|login|isn't supported|YouTube/i.test(String(data.error || "")) ? data.error : "");

      const files = [];
      for (const it of items) {
        try {
          const mr = await fetch(it.url);                 // Cobalt tunnel is CORS-open
          if (!mr.ok) throw new Error("http " + mr.status);
          const b = await mr.blob();
          const fallback = it.type === "video" ? "video/mp4" : "image/jpeg";
          files.push(new File([b], it.filename || (it.type === "video" ? "clip.mp4" : "photo.jpg"), { type: b.type || fallback }));
        } catch (_) { /* skip the ones the site blocks */ }
      }
      if (!files.length) return await tryAsPage("Found media but couldn't download it (the site may be blocking it).");
      await addMediaFiles(files);                          // handles cap + ingest + transcript
      if (data.note) setMediaNote(data.note);
      setPostLink("");
    } catch (_) {
      await tryAsPage("Couldn't reach the link-import service. Try again in a moment.");
    } finally {
      setImportingPost(false);
    }
  }

  // Paste a YouTube link -> oEmbed title + thumbnail -> reel item kind:"youtube".
  // Nothing is downloaded; the export bakes a click-to-play player onto its slide.
  async function importYouTubeLink(url) {
    setImportingPost(true);
    try {
      const headers = { "Content-Type": "application/json" };
      if (passcode.trim()) headers["x-sb-passcode"] = passcode.trim();
      const resp = await fetch(API_BASE + "/api/youtube-meta", { method: "POST", headers, body: JSON.stringify({ url }) });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) { setError(data.error || "Couldn't read that YouTube link. Check it and try again."); return; }
      const thumb = data.thumbnailDataUrl || "";          // clean frame -> fed to the model
      const poster = await addPlayBadge(thumb);            // play-badged -> reel + slide
      setMedia(m => m.length >= MAX_MEDIA ? m : [...m, {
        id: newId(), kind: "youtube", youtubeId: data.videoId,
        watchUrl: "https://www.youtube.com/watch?v=" + data.videoId,
        poster, thumb, title: data.title || "", author: data.author || "",
        name: data.title || "YouTube video", aspect: 16 / 9, text: "",
      }]);
      setMediaNote("YouTube clip added. It can't be transcribed — type what happens in it under its thumbnail so the questions match.");
      setPostLink("");
    } catch (_) {
      setError("Couldn't reach the YouTube lookup. Try again in a moment.");
    } finally {
      setImportingPost(false);
    }
  }

  function onMedia(e) { addMediaFiles(e.target.files); e.target.value = ""; }
  const removeMedia = (id) => setMedia(m => m.filter(x => x.id !== id));
  const setMediaText = (id, text) => setMedia(m => m.map(x => x.id === id ? { ...x, text } : x));
  function moveMedia(id, dir) {
    setMedia(m => {
      const i = m.findIndex(x => x.id === id); const j = i + dir;
      if (i < 0 || j < 0 || j >= m.length) return m;
      const out = m.slice(); const [it] = out.splice(i, 1); out.splice(j, 0, it); return out;
    });
  }

  // The fetched article's lead image belongs to the text that fetch returned. Editing a typo should
  // keep the photo; pasting a DIFFERENT article over the top must not silently keep the old story's
  // picture on IGNITE and THINK. Compare the opening of the text against what the fetch produced.
  const fetchedArticleRef = React.useRef("");
  const onArticleTextChange = (t) => {
    setArticleText(t);
    const src = fetchedArticleRef.current;
    if (!src || !articleImageUrl) return;
    const head = (s) => String(s).replace(/\s+/g, " ").trim().slice(0, 80);
    if (head(t) !== head(src)) { setArticleImageUrl(""); setArticleNote(null); fetchedArticleRef.current = ""; }
  };

  const pdfSeqRef = React.useRef(0);
  async function onPdf(e) {
    const f = e.target.files?.[0]; e.target.value = ""; if (!f) return; // reset so re-picking the same file re-fires
    const seq = ++pdfSeqRef.current; // any later pick supersedes this one so a slow parse can't clobber a newer PDF
    setPdfName(f.name + " (extracting…)");
    try {
      const t = await extractPdfText(f);
      if (seq !== pdfSeqRef.current) return;
      setArticleText(t); setPdfName(f.name + ` (${t.length.toLocaleString()} chars)`);
      // The PDF replaces whatever article was loaded before it, so drop that article's lead image
      // and link too — otherwise the deck printed the OLD story's photo and QR beside the new text.
      setArticleImageUrl(""); setLink(""); setArticleNote(null); fetchedArticleRef.current = "";
    } catch (err) {
      if (seq !== pdfSeqRef.current) return;
      setError("Could not extract text from that PDF: " + err.message); setPdfName("");
    }
  }
  // Reader 1: r.jina.ai turns a public page into markdown and allows browser/CORS requests, so
  // the browser can call it straight. It runs from datacenter IPs though, so a site with a bot
  // check serves it a challenge page instead of the article — caught by looksLikeBotWall.
  async function readViaJina(url) {
    const resp = await fetch("https://r.jina.ai/" + url);
    if (!resp.ok) throw new Error("Reader service returned HTTP " + resp.status);
    const rawMd = await resp.text();
    const text = cleanArticleMarkdown(rawMd);
    if (looksLikeBotWall(rawMd)) throw new Error("that site is running a robot check");
    if (text.length < 40) throw new Error("got too little text back — the page may be paywalled or JS-only");
    return { text, image: extractLeadImage(rawMd) }; // lead image read before the stripping
  }

  // Reader 2: our own backend fetches the page with browser-shaped headers, which gets through
  // some walls the reader can't, and hands back the lead image inline (no CORS to fight).
  async function readViaServer(url) {
    const headers = { "Content-Type": "application/json" };
    if (passcode.trim()) headers["x-sb-passcode"] = passcode.trim();
    const resp = await fetch(API_BASE + "/api/fetch-article", { method: "POST", headers, body: JSON.stringify({ url }) });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.error || "couldn't read that page");
    return { text: String(data.text || ""), image: String(data.imageDataUrl || data.image || "") };
  }

  // Pull readable article text + lead image from a public link. Try the reader service first
  // (best prose), fall back to our own fetch when it's walled, and top up a missing picture from
  // our fetch too — pages whose whole point IS the picture often carry no social preview image.
  async function fetchArticleFromLink(overrideUrl) {
    const url = (typeof overrideUrl === "string" ? overrideUrl : link).trim();
    const fail = (msg) => { setArticleNote({ text: msg, ok: false }); return { text: "", image: "" }; };
    setError(""); setArticleNote(null);
    if (!/^https?:\/\//i.test(url)) return fail("Enter a full article link starting with http(s):// first.");
    if (isSearchResultsPage(url)) return fail("That's a search results page, not an article. Open the story itself and paste that link, or paste the article's text into the box below.");
    setLink(url);
    setFetchingArticle(true);
    try {
      let out = null;
      let why = "";
      try { out = await readViaJina(url); }
      catch (err) { why = err.message || String(err); }

      if (!out) {
        try { out = await readViaServer(url); }
        catch (err) {
          // Our own fetch says the more useful thing (what the site did and what to do about it);
          // the reader service's reason is only worth showing when ours has nothing specific.
          const server = String(err.message || "");
          return fail(server.length > 40 ? server : "Couldn't fetch that link (" + (why || server) + "). Paste the article text instead.");
        }
      } else if (!out.image) {
        try { const s = await readViaServer(url); if (s.image) out = { ...out, image: s.image }; }
        catch (_) { /* no picture available — text alone still works */ }
      }

      setArticleText(out.text);
      setArticleImageUrl(out.image);
      fetchedArticleRef.current = out.text; // the image belongs to THIS text — see onArticleTextChange
      setArticleNote(out.image
        ? { text: "Text and picture loaded from the link.", ok: true }
        : { text: "Got the text, but no picture on that page the app could use. Save the picture yourself and add it as an image if you want one on the slides.", ok: false });
      return out;
    } catch (err) {
      return fail("Couldn't fetch that link (" + (err.message || err) + "). Paste the article text instead.");
    } finally {
      setFetchingArticle(false);
    }
  }

  /* ------- validation ------- */
  function inputReady() {
    const hasStimulus = mode === "media" ? media.length > 0 : mode === "article" ? articleText.trim().length > 20 : false;
    return hasStimulus && !!classInfo.subject.trim() && !!classInfo.yearLevel.trim();
  }

  /* ------- analyse (recommend routines, before Generate) ------- */
  async function runAnalyse() {
    if (analysing) return;
    setAnalyseError("");
    if (!inputReady()) { setAnalyseError("Please add a stimulus first, and fill in the subject and year level."); return; }
    if (!selectedMove) { setAnalyseError("Please choose a Thinking Move first."); return; }
    setAnalysing(true);
    try {
      const sourceText = mode === "article" ? articleText : "";
      const result = await analyseStimulus({ passcode: passcode.trim(), mode, media, sourceText, classInfo, move: selectedMoveObj });
      setAnalysis(result);
      setSelectedRoutine("");
      // Log the successful analyse event.
      const hasVideo = media.some(m => m.kind === "video");
      const hasImage = media.some(m => m.kind === "image");
      let stimulusType = mode === "article" ? (pdfName ? "pdf" : "article") : (hasVideo && hasImage ? "mixed" : hasVideo ? "video" : hasImage ? "image" : "unknown");
      logEvent("analyse", { stimulusType });
    } catch (err) {
      setAnalyseError(err.message || String(err));
    } finally {
      setAnalysing(false);
    }
  }
  function pickRoutine(name) {
    setSelectedRoutine(name);
  }
  function pickMove(name) {
    if (name === selectedMove) return;
    setSelectedMove(name);
    // A new move changes the candidate routines, so drop the stale analysis + pick.
    setAnalysis(null); setSelectedRoutine(""); setAnalyseError("");
  }
  const analyseBandRoutines = useMemo(() => {
    const tag = bandOf(classInfo.yearLevel);
    // Scope the browse list to the chosen move (band-filtered, topped up); full band list only if no move.
    return selectedMoveObj ? moveRoutineList(selectedMoveObj, tag) : ROUTINES.filter(r => r.bands.includes(tag));
  }, [classInfo.yearLevel, selectedMove]);
  const routineGroups = useMemo(() => {
    const map = new Map();
    analyseBandRoutines.forEach(r => { if (!map.has(r.group)) map.set(r.group, []); map.get(r.group).push(r); });
    return [...map.entries()];
  }, [analyseBandRoutines]);
  const routineUrl = (name) => (ROUTINES.find(r => r.name === name) || {}).url || "https://pz.harvard.edu/thinking-routines";

  /* ------- Zoom In's reveal frames ------- */
  // The tool applies to exactly one case: the Zoom In routine over a photo the teacher uploaded.
  // (A video, an article's lead image or a link-only stimulus has nothing local to crop.) Picking
  // the routine, or changing the photo, resets the frames to a small centre box growing outward —
  // a teacher who does nothing at all still gets a real reveal.
  const revealPhoto = useMemo(
    () => (mode === "media" ? (media.find(m => m && m.kind === "image" && m.dataUrl) || null) : null),
    [mode, media]);
  const zoomInPicked = selectedRoutine === "Zoom In" && !!revealPhoto;
  useEffect(() => {
    setRevealFrames(zoomInPicked ? DEFAULT_REVEAL_FRAMES.map(r => ({ ...r })) : null);
    setRevealIdx(0);
  }, [zoomInPicked, revealPhoto && revealPhoto.id]);
  // Frames that survive into the export: only while Zoom In is still the routine and the photo is still there.
  const activeReveal = zoomInPicked && Array.isArray(revealFrames) && revealFrames.length ? revealFrames : null;

  /* ------- generate ------- */
  async function generate() {
    if (regenSlide || loading) return; // a slide regen is in flight, or a generate is already running
    setError(""); setRawDump("");
    if (mode === "media" && !media.length) { setError("Add at least one image or video first."); return; }
    if (!inputReady()) { setError("Please add a stimulus first (images/video, or article text/PDF), and fill in the subject and year level."); return; }

    setLoading(true);
    // The lesson streams, so the bar reports what has actually ARRIVED (which of the four parts
    // the model has finished writing) rather than an elapsed-time guess. The old estimate eased
    // against a supposed ~28s build; the real measured build is ~69s, which is exactly how you
    // end up with a bar that parks at 90% and reads as a hang.
    setGenProgress(2);
    setGenLive(null);
    setGenPhase("thinking");
    try {
      const sourceText = mode === "article" ? articleText : "";
      // Single-class-per-run: one generate() call produces one deck, pitched to the
      // band derived from classInfo.yearLevel (bandOf + BAND_KEY_OF above).
      const genBand = BAND_KEY_OF[bandOf(classInfo.yearLevel)];
      const { parsed, raw } = await generateSpringboard({
        passcode: passcode.trim(), mode, media, sourceText,
        classInfo, routineName: selectedRoutine, reflectRoutine, intention, scope: "all",
        onPartial: (p) => {
          setGenLive(p);
          setGenPhase("writing");   // words are landing now, so a number becomes meaningful
          // Weight the parts by how much writing each one actually is, or the bar lurches: the
          // notes{} block alone is roughly a third of the reply.
          const done = (p.ignite && p.ignite.question ? 18 : 0)
            + (p.think && Array.isArray(p.think.steps) && p.think.steps.length ? 22 : 0)
            + (p.think && p.think.reveal && p.think.reveal.fact ? 8 : 0)
            + (p.launch && p.launch.question ? 14 : 0)
            + (p.reflect && Array.isArray(p.reflect.prompts) && p.reflect.prompts.length ? 14 : 0)
            + (Array.isArray(p.next) && p.next.length ? 10 : 0)
            + (p.notes && p.notes.reflect ? 12 : 0);
          setGenProgress(Math.max(4, Math.min(97, done)));
        },
      });
      const deck = shapeDeck(parsed, { routineName: selectedRoutine });
      deck.curriculumFocus = Array.isArray(classInfo.focus) ? classInfo.focus.slice() : [];
      setRawDump(raw);
      jumpToDeck.current = true;    // brain view: ride down to the finished deck once it paints
      setSpots({ [genBand]: deck });
      setActiveBand(genBand);
      setIncludeReflect(true);              // fresh deck defaults to including REFLECT
      genStimKey.current = stimKey; // remember the stimulus fingerprint for the stale-deck hint
      setGenProgress(100);
      // Log the successful generate event.
      const hasVideo = media.some(m => m.kind === "video");
      const hasImage = media.some(m => m.kind === "image");
      let stimulusType = mode === "article" ? (pdfName ? "pdf" : "article") : (hasVideo && hasImage ? "mixed" : hasVideo ? "video" : hasImage ? "image" : "unknown");
      logEvent("generate", { stimulusType, routine: selectedRoutine, topic: deck.title });
    } catch (err) {
      setError(err.message || String(err));
      if (err._raw) setRawDump(err._raw);
    } finally {
      setLoading(false);
      setGenPhase("");
      setTimeout(() => { setGenProgress(0); setGenLive(null); }, 500);
    }
  }

  /* ------- regenerate a single slide (targeted, keeps the other slides) ------- */
  async function regenerateSlide(scope, reflectRoutineArg) {
    if (!spot || regenSlide || loading) return;
    setError(""); setRawDump("");
    setRegenSlide(scope);
    try {
      const sourceText = mode === "article" ? articleText : "";
      // Reflect regen honours an explicitly-passed routine (the dropdown fires before
      // state settles); everything else uses the current pinned reflectRoutine.
      const rr = reflectRoutineArg !== undefined ? reflectRoutineArg : reflectRoutine;
      const { parsed } = await generateSpringboard({
        passcode: passcode.trim(), mode, media, sourceText,
        classInfo, routineName: spot.think.routine || selectedRoutine, reflectRoutine: rr,
        // A regenerated slide must keep serving the intention the deck already carries, whoever wrote it.
        intention: (spot.intention || intention || "").trim(),
        scope, current: spot,
      });
      setSpot(s => mergeScopedFields(s, scope, parsed));
      // Log the successful regenerate event.
      logEvent("regenerate", { routine: spot.think.routine, topic: spot.title });
    } catch (err) {
      setError(err.message || String(err));
      if (err._raw) setRawDump(err._raw);
    } finally {
      setRegenSlide(null);
    }
  }

  // Teacher chose an end-of-lesson reflection routine from the REFLECT dropdown: pin it,
  // then re-tailor just the reflect prompts to this lesson (one scoped AI call). "" = Auto.
  async function pickReflectRoutine(name) {
    setReflectRoutine(name);
    await regenerateSlide("reflect", name);
  }

  /* ------- editing helpers ------- */
  // patch: top-level fields (title, keywords). patchSlide: a nested slide object
  // (ignite/think/launch/reflect). patchNote: the teacher note for a slide. arr*: the
  // list fields (think.steps, reflect.prompts).
  const patch = (obj) => setSpot(s => ({ ...s, ...obj }));
  const patchSlide = (slide, obj) => setSpot(s => ({ ...s, [slide]: { ...s[slide], ...obj } }));
  const patchNote = (slide, text) => setSpot(s => ({ ...s, notes: { ...s.notes, [slide]: text } }));
  // (|| [] guards: launch.ideas can be absent on a deck the model returned without it.)
  const patchArr = (slide, key, i, val) => setSpot(s => { const a = (s[slide][key] || []).slice(); a[i] = val; return { ...s, [slide]: { ...s[slide], [key]: a } }; });
  // deck.next is an array of {title, idea, thinking} — one per "Where to next" slide.
