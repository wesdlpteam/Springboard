name: Backend freshness

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "vercel.json"

jobs:
  check-backend-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:backend -- --wait
